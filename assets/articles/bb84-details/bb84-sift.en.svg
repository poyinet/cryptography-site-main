<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" width="1400" height="840" role="img" aria-labelledby="title desc">
<title id="title">Sifting: keep only the positions where Bob guessed the basis</title>
<desc id="desc">Diagram: eight positions with Alice bits, sending bases and states, and Bob’s independently chosen bases; matching-basis positions enter the sifted key, mismatches are discarded. This is an illustration, not the paper’s 15-position table.</desc>
<defs><filter id="soft" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F1D1A" flood-opacity="0.07"/></filter></defs>
