<text x="58" y="68" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="#1F1D1A" text-anchor="start">Sifting: keep only the positions where Bob guessed the basis</text>
<text x="58" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">The quantum stage carries states only; basis announcements and sifting happen on the public channel.</text>
