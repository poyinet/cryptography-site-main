<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="title desc">
<title id="title">四个偏振态，两组共轭基</title>
<desc id="desc">示意图：直角基的水平 0° 与垂直 90°，对角基的 45° 与 135°，分别编码 0 和 1；两组基共轭，用错基测量会丢失信息。</desc>
<defs><filter id="soft" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F1D1A" flood-opacity="0.07"/></filter></defs>
<rect width="1400" height="760" fill="#F7F5EF"/>
<text x="58" y="68" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="32" font-weight="700" fill="#1F1D1A" text-anchor="start">四个偏振态，两组共轭基</text>
<text x="58" y="106" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">同一光子在每组基里只承载 1 bit；两组基不是正交关系，换基测量会得到随机结果。</text>
<rect x="58" y="150" width="626" height="400" rx="20" fill="#FFFFFF" filter="url(#soft)"/>
<rect x="82" y="172" width="150" height="36" rx="10" fill="#ECE9FA"/>
<text x="157.0" y="195.1" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#4B3F9E" text-anchor="middle">直角基 R</text>
<text x="250" y="197" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="16" font-weight="500" fill="#6B655C" text-anchor="start">0° / 90°</text>
<circle cx="371" cy="350" r="32" fill="#ECE9FA" opacity="0.55"/>
<circle cx="371" cy="350" r="22" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="2"/>
<circle cx="371" cy="350" r="6" fill="#4B3F9E"/>
<line x1="207.0" y1="350.0" x2="535.0" y2="350.0" stroke="#4B3F9E" stroke-width="5" opacity="0.3"/>
<line x1="371" y1="350" x2="535.0" y2="350.0" stroke="#4B3F9E" stroke-width="3"/>
<path d="M524.0 345.1 L535.0 350.0 L524.0 354.9" fill="none" stroke="#4B3F9E" stroke-width="3"/>
<line x1="371.0" y1="500.0" x2="371.0" y2="200.0" stroke="#4B3F9E" stroke-width="5" opacity="0.3"/>
<line x1="371" y1="350" x2="371.0" y2="200.0" stroke="#4B3F9E" stroke-width="3"/>
<path d="M366.1 211.0 L371.0 200.0 L375.9 211.0" fill="none" stroke="#4B3F9E" stroke-width="3"/>
<text x="559" y="356" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#4B3F9E" text-anchor="start">0° → bit 0</text>
<text x="371" y="166" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#4B3F9E" text-anchor="middle">90° → bit 1</text>
<text x="82" y="506" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">水平 = 0；垂直 = 1</text>
<rect x="716" y="150" width="626" height="400" rx="20" fill="#FFFFFF" filter="url(#soft)"/>
<rect x="740" y="172" width="150" height="36" rx="10" fill="#E2F3EE"/>
<text x="815.0" y="195.1" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#1F7A6A" text-anchor="middle">对角基 D</text>
<text x="908" y="197" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="16" font-weight="500" fill="#6B655C" text-anchor="start">45° / 135°</text>
<circle cx="1029" cy="350" r="32" fill="#ECE9FA" opacity="0.55"/>
<circle cx="1029" cy="350" r="22" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="2"/>
<circle cx="1029" cy="350" r="6" fill="#4B3F9E"/>
<line x1="913.0344878854062" y1="465.9655121145938" x2="1144.9655121145938" y2="234.03448788540618" stroke="#1F7A6A" stroke-width="5" opacity="0.3"/>
<line x1="1029" y1="350" x2="1144.9655121145938" y2="234.03448788540618" stroke="#1F7A6A" stroke-width="3"/>
<path d="M1133.7 238.3 L1145.0 234.0 L1140.7 245.3" fill="none" stroke="#1F7A6A" stroke-width="3"/>
<line x1="1135.066017177982" y1="456.06601717798213" x2="922.9339828220179" y2="243.93398282201787" stroke="#1F7A6A" stroke-width="5" opacity="0.3"/>
<line x1="1029" y1="350" x2="922.9339828220179" y2="243.93398282201787" stroke="#1F7A6A" stroke-width="3"/>
<path d="M927.2 255.2 L922.9 243.9 L934.2 248.2" fill="none" stroke="#1F7A6A" stroke-width="3"/>
<text x="1155" y="222" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#1F7A6A" text-anchor="start">45° → bit 0</text>
<text x="903" y="222" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#1F7A6A" text-anchor="end">135° → bit 1</text>
<text x="740" y="506" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">45° = 0；135° = 1</text>
<rect x="58" y="586" width="1284" height="116" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="84" y="622" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="start">读图：0/90° 与 45°/135° 不是同一组正交轴。</text>
<text x="84" y="656" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">用错基测量，原来的比特信息不会“读错”，而是被重写成随机结果；这正是 BB84 能检测扰动的原因。</text>
<text x="84" y="684" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">依据：Bennett &amp; Brassard, TCS 560 (2014) 53–62, 176–192。</text>
</svg>
