<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" role="img" aria-labelledby="title desc">
<title id="title">Intercept-resend: about one quarter errors after sifting</title>
<desc id="desc">Diagram: Eve intercepts, measures in the rectilinear basis, and resends. Alice’s R bits survive; Alice’s D bits are projected onto R, so Bob’s later D measurement is random, producing about one quarter errors among sifted bits.</desc>
<defs><filter id="soft" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F1D1A" flood-opacity="0.07"/></filter></defs>
<rect width="1400" height="820" fill="#F7F5EF"/>
<text x="58" y="68" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="29" font-weight="700" fill="#1F1D1A" text-anchor="start">Intercept-resend: about one quarter errors after sifting</text>
<text x="58" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">Eve cannot gain full information without disturbance; the disturbance appears as errors.</text>
<rect x="58" y="150" width="270" height="96" rx="16" fill="#ECE9FA"/>
<text x="80" y="184" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#4B3F9E" text-anchor="start">Alice</text>
<text x="80" y="214" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">random bits / bases</text>
<rect x="368" y="136" width="250" height="124" rx="16" fill="#FBE7E3" stroke="#A33A32" stroke-width="1.5"/>
<text x="390" y="170" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#A33A32" text-anchor="start">Eve</text>
<text x="390" y="200" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">measures in R</text>
<text x="390" y="228" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">resends the result</text>
<rect x="860" y="150" width="270" height="96" rx="16" fill="#E2F3EE"/>
<text x="882" y="184" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F7A6A" text-anchor="start">Bob</text>
<text x="882" y="214" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">independently chooses bases</text>
<line x1="330" y1="198" x2="360" y2="198" stroke="#4B3F9E" stroke-width="3"/>
<path d="M349.0 193.1 L360.0 198.0 L349.0 202.9" fill="none" stroke="#4B3F9E" stroke-width="3"/>
<line x1="620" y1="198" x2="852" y2="198" stroke="#4B3F9E" stroke-width="3"/>
<path d="M841.0 193.1 L852.0 198.0 L841.0 202.9" fill="none" stroke="#4B3F9E" stroke-width="3"/>
<text x="490" y="292" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="middle">quantum channel</text>
<rect x="58" y="340" width="620" height="260" rx="18" fill="#FFFFFF" filter="url(#soft)"/>
<rect x="80" y="362" width="142" height="34" rx="10" fill="#ECE9FA"/>
<text x="151.0" y="383.76" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#4B3F9E" text-anchor="middle">Alice sends R</text>
<text x="80" y="428" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="start">Eve measures in R; the state is unchanged;</text>
<text x="80" y="460" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="start">Bob also uses R, and reads the correct bit.</text>
<rect x="80" y="512" width="160" height="34" rx="10" fill="#E2F3EE"/>
<text x="160.0" y="533.76" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F7A6A" text-anchor="middle">this half: no error</text>
<text x="80" y="574" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">R positions are half of what Alice sends.</text>
<rect x="722" y="340" width="620" height="260" rx="18" fill="#FFFFFF" filter="url(#soft)"/>
<rect x="744" y="362" width="162" height="34" rx="10" fill="#E2F3EE"/>
<text x="825.0" y="383.76" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F7A6A" text-anchor="middle">Alice sends D</text>
<text x="744" y="428" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="start">Eve’s R measurement projects the D state onto R;</text>
<text x="744" y="460" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="start">she resends an R state; Bob’s D measurement is random 0/1.</text>
<rect x="744" y="512" width="160" height="34" rx="10" fill="#FBE7E3"/>
<text x="824.0" y="533.76" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#A33A32" text-anchor="middle">this half: half wrong</text>
<text x="744" y="574" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">D positions are the other half; half of them go wrong.</text>
<rect x="58" y="632" width="1284" height="98" rx="16" fill="#FFF3CD" stroke="#DED9CE" stroke-width="1.5"/>
<text x="84" y="670" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="23" font-weight="700" fill="#9A6A00" text-anchor="start">error rate after sifting ≈ 1/2 × 1/2 = 1/4</text>
<text x="84" y="704" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">Paper’s example: Eve intercepts and resends in R, “inducing disagreements in 1/4”</text>
<text x="84" y="770" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">Reading: this is an intuitive detection example, not every attack is exactly 1/4. The paper states a tradeoff: b bits of information forces disagreement probability at least b/2.</text>
</svg>
