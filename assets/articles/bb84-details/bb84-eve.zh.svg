<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" role="img" aria-labelledby="title desc">
<title id="title">拦截-重发：Eve 全用 R 基，筛后误码约 1/4</title>
<desc id="desc">示意图：Eve 拦截光子并用直角基测量、按结果重发。Alice 的 R 位不受影响；Alice 的 D 位被投影到 R 基后，Bob 再用 D 基测量得到随机结果，于是筛后比特中约四分之一出错。</desc>
<defs><filter id="soft" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F1D1A" flood-opacity="0.07"/></filter></defs>
<rect width="1400" height="820" fill="#F7F5EF"/>
<text x="58" y="68" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">拦截-重发：Eve 全用 R 基，筛后误码约 1/4</text>
<text x="58" y="106" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">Eve 不可能既拿到全部信息又不扰动；扰动会变成误码。</text>
<rect x="58" y="150" width="270" height="96" rx="16" fill="#ECE9FA"/>
<text x="80" y="184" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#4B3F9E" text-anchor="start">Alice</text>
<text x="80" y="214" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">随机比特 / 基</text>
<rect x="368" y="136" width="250" height="124" rx="16" fill="#FBE7E3" stroke="#A33A32" stroke-width="1.5"/>
<text x="390" y="170" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#A33A32" text-anchor="start">Eve</text>
<text x="390" y="200" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">全用 R 基测量</text>
<text x="390" y="228" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">再按结果重发</text>
<rect x="860" y="150" width="270" height="96" rx="16" fill="#E2F3EE"/>
<text x="882" y="184" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F7A6A" text-anchor="start">Bob</text>
<text x="882" y="214" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">独立随机选基</text>
<line x1="330" y1="198" x2="360" y2="198" stroke="#4B3F9E" stroke-width="3"/>
<path d="M349.0 193.1 L360.0 198.0 L349.0 202.9" fill="none" stroke="#4B3F9E" stroke-width="3"/>
<line x1="620" y1="198" x2="852" y2="198" stroke="#4B3F9E" stroke-width="3"/>
<path d="M841.0 193.1 L852.0 198.0 L841.0 202.9" fill="none" stroke="#4B3F9E" stroke-width="3"/>
<text x="490" y="292" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="middle">量子信道</text>
<rect x="58" y="340" width="620" height="260" rx="18" fill="#FFFFFF" filter="url(#soft)"/>
<rect x="80" y="362" width="142" height="34" rx="10" fill="#ECE9FA"/>
<text x="151.0" y="383.76" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#4B3F9E" text-anchor="middle">Alice 发 R 位</text>
<text x="80" y="428" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="start">Eve 用 R 基测量，态不被改写；</text>
<text x="80" y="460" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="start">Bob 也用 R 基，读到正确比特。</text>
<rect x="80" y="512" width="160" height="34" rx="10" fill="#E2F3EE"/>
<text x="160.0" y="533.76" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F7A6A" text-anchor="middle">这一半：不产生误码</text>
<text x="80" y="574" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">R 位占 Alice 发送的一半。</text>
<rect x="722" y="340" width="620" height="260" rx="18" fill="#FFFFFF" filter="url(#soft)"/>
<rect x="744" y="362" width="162" height="34" rx="10" fill="#E2F3EE"/>
<text x="825.0" y="383.76" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F7A6A" text-anchor="middle">Alice 发 D 位</text>
<text x="744" y="428" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="start">Eve 的 R 测量把 D 态投影到 R 基；</text>
<text x="744" y="460" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="start">她重发 R 态，Bob 再用 D 基测量 → 0/1 随机。</text>
<rect x="744" y="512" width="160" height="34" rx="10" fill="#FBE7E3"/>
<text x="824.0" y="533.76" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#A33A32" text-anchor="middle">这一半：一半出错</text>
<text x="744" y="574" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">D 位占另一半；随机的一半错。</text>
<rect x="58" y="632" width="1284" height="98" rx="16" fill="#FFF3CD" stroke="#DED9CE" stroke-width="1.5"/>
<text x="84" y="670" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="23" font-weight="700" fill="#9A6A00" text-anchor="start">筛后总误码 ≈ 1/2 × 1/2 = 1/4</text>
<text x="84" y="704" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">论文原例：Eve 全用 R 基拦截-重发，「inducing disagreements in 1/4」</text>
<text x="84" y="770" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">读图：这是检测的直观例子，不是任何攻击都恰好 1/4。论文给出的是信息量 b 与不一致概率 ≥ b/2 的权衡。</text>
</svg>
