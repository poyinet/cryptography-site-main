<title id="fig-title">EAP-TTLS</title>
<desc id="fig-desc">Protocol · Why — how — where it breaks</desc>
<rect x="0" y="0" width="1240" height="820" fill="#F7F5EF"/>
<text x="60" y="54" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#6B655C">Protocol</text>
<text x="60" y="108" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="38" font-weight="800" fill="#1F1D1A">EAP-TTLS</text>
<text x="60" y="150" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#6B655C">One explanatory line drawn from the article: the problem, the mechanism, then the failure condition.</text>
<rect x="50" y="205" width="350" height="405" rx="22" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="2"/>
<rect x="72" y="227" width="42" height="42" rx="13" fill="#ECE9FA"/><text x="93" y="257" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="800" fill="#4B3F9E" text-anchor="middle">1</text>
<text x="74" y="310" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="800" fill="#4B3F9E">Why needed</text>
<text x="74" y="358" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">The motive is that exposed</text>
<text x="74" y="385" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">challenge/response enables</text>
<text x="74" y="412" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">dictionary attacks: §2 notes</text>
<text x="74" y="439" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">&quot;An issue with such an</text>
<text x="74" y="466" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">approach is that an</text>
<text x="74" y="493" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">eavesdropper that observes</text>
<text x="74" y="520" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">both challenge and response</text>
<text x="74" y="547" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">may be able to moun。</text>
