<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" width="1400" height="620" role="img" aria-labelledby="title desc">
<title id="title">From the 1976 public-key paper to RSA in 1978</title>
<desc id="desc">Four-node timeline: the Diffie–Hellman paper in November 1976, RSA submission on 4 April 1977, revision on 1 September 1977, publication in CACM 21(2) in February 1978.</desc>
<rect width="1400" height="620" fill="#F7F5EF"/>
<text x="55" y="70" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">From the 1976 public-key paper to RSA in 1978</text>
<text x="55" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">1977 is RSA’s submission year; formal publication came in February 1978.</text>
<line x1="90" y1="300" x2="1310" y2="300" stroke="#DED9CE" stroke-width="3"/>
<circle cx="175" cy="300" r="18" fill="#ECE8FF" stroke="#6D5BD0" stroke-width="3"/>
<text x="175" y="254" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="21" font-weight="700" fill="#6D5BD0" text-anchor="middle">1976-11</text>
<text x="175" y="348" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="middle">prior: DH paper</text>
<text x="175" y="378" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">IEEE Trans. IT 22(6)</text>
<circle cx="510" cy="300" r="18" fill="#E3F4EE" stroke="#2E7D6B" stroke-width="3"/>
<text x="510" y="254" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="21" font-weight="700" fill="#2E7D6B" text-anchor="middle">1977-04-04</text>
<text x="510" y="348" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="middle">submitted</text>
<text x="510" y="378" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">Received April 4, 1977</text>
<circle cx="845" cy="300" r="18" fill="#FFF4CF" stroke="#8A6A00" stroke-width="3"/>
<text x="845" y="254" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="21" font-weight="700" fill="#8A6A00" text-anchor="middle">1977-09-01</text>
<text x="845" y="348" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="middle">revised</text>
<text x="845" y="378" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">revised September 1, 1977</text>
<circle cx="1170" cy="300" r="18" fill="#FBE7E3" stroke="#A33A32" stroke-width="3"/>
<text x="1170" y="254" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="21" font-weight="700" fill="#A33A32" text-anchor="middle">1978-02</text>
<text x="1170" y="348" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="middle">published</text>
<text x="1170" y="378" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">CACM 21(2), pp. 120–126</text>
<rect x="50" y="445" width="1300" height="82" rx="16" fill="#FFFFFF" stroke="#E7D9A8" stroke-width="1.5"/>
<text x="78" y="480" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">How to read it: the two 1977 dates are the paper’s received/revised lines; February 1978 is the CACM publication.</text>
<text x="78" y="508" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">Evidence: RSA paper line 265; bibliographic record CACM 21(2), February 1978, pp. 120–126.</text>
<text x="78" y="568" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">Original diagram, CC BY 4.0.</text>
</svg>
