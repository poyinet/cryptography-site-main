<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="title desc">
<title id="title">The encryption and signature skeleton of RSA</title>
<desc id="desc">Three-column diagram: key generation with n=pq, public e and secret d; encryption C=M^e mod n and decryption M=C^d mod n; signing S=M^d mod n and verification M=S^e mod n.</desc>
<rect width="1400" height="760" fill="#F7F5EF"/>
<text x="55" y="68" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">The encryption and signature skeleton of RSA</text>
<text x="55" y="104" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">The paper gives only this skeleton and its security assumption; this entry does not expand it into modern padding, hashing or protocol detail.</text>
<rect x="50" y="150" width="400" height="360" rx="18" fill="#FFFFFF"/>
<rect x="68" y="168" width="190" height="34" rx="12" fill="#ECE8FF"/>
<text x="163.0" y="190.5" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#6D5BD0" text-anchor="middle">1 · Key generation</text>
<rect x="480" y="150" width="440" height="360" rx="18" fill="#FFFFFF"/>
<rect x="498" y="168" width="190" height="34" rx="12" fill="#E3F4EE"/>
<text x="593.0" y="190.5" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#2E7D6B" text-anchor="middle">2 · Encrypt / decrypt</text>
<rect x="950" y="150" width="400" height="360" rx="18" fill="#FFFFFF"/>
<rect x="968" y="168" width="190" height="34" rx="12" fill="#FFF4CF"/>
<text x="1063.0" y="190.5" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6A00" text-anchor="middle">3 · Sign / verify</text>
<text x="70" y="246" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="25" font-weight="700" fill="#6D5BD0" text-anchor="start">n = p · q</text>
<text x="70" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">p, q secret primes</text>
<text x="70" y="328" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="19" font-weight="700" fill="#1F1D1A" text-anchor="start">public: (n, e)</text>
<text x="70" y="358" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="19" font-weight="700" fill="#1F1D1A" text-anchor="start">secret: d</text>
<text x="70" y="406" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">e and d are matched exponents</text>
<text x="70" y="436" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">Public n does not reveal the factorisation of p and q</text>
<text x="498" y="246" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#2E7D6B" text-anchor="start">C = M^e mod n</text>
<text x="498" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">encrypt with public e</text>
<text x="498" y="328" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#2E7D6B" text-anchor="start">M = C^d mod n</text>
<text x="498" y="362" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">decrypt with secret d</text>
<text x="498" y="410" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">Only the holder of d can recover M</text>
<text x="498" y="440" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">The paper represents the message as a number M</text>
<text x="968" y="246" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#8A6A00" text-anchor="start">S = M^d mod n</text>
<text x="968" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">sign with secret d</text>
<text x="968" y="328" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#8A6A00" text-anchor="start">M = S^e mod n</text>
<text x="968" y="362" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">verify with public e</text>
<text x="968" y="410" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">Signing and encryption use the same exponent pair</text>
<text x="968" y="440" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">The paper says signatures cannot be forged or denied</text>
<rect x="50" y="550" width="1300" height="140" rx="16" fill="#FFFFFF" stroke="#E7D9A8" stroke-width="1.5"/>
<text x="78" y="586" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">Security boundary: the paper says security “rests in part on the difficulty of factoring n”, invites attempts to break it and calls it a candidate.</text>
<text x="78" y="616" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">How to read it: this is only the paper’s arithmetic skeleton, not a complete modern RSA specification.</text>
<text x="78" y="648" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">Evidence: RSA paper lines 4–7 and 261–263.</text>
<text x="78" y="728" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">Original diagram, CC BY 4.0.</text>
</svg>
