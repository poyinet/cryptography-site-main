<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" width="1400" height="620" role="img" aria-labelledby="title desc">
<title id="title">从 1976 年公钥论文到 1978 年 RSA 发表</title>
<desc id="desc">四节点时间线：1976 年 11 月 Diffie–Hellman 论文、1977 年 4 月 4 日 RSA 投稿、1977 年 9 月 1 日修订、1978 年 2 月 CACM 21(2) 发表。</desc>
<rect width="1400" height="620" fill="#F7F5EF"/>
<text x="55" y="70" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">从 1976 年公钥论文到 1978 年 RSA 发表</text>
<text x="55" y="106" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">1977 是 RSA 的投稿年；正式发表要等到 1978 年 2 月。</text>
<line x1="90" y1="300" x2="1310" y2="300" stroke="#DED9CE" stroke-width="3"/>
<circle cx="175" cy="300" r="18" fill="#ECE8FF" stroke="#6D5BD0" stroke-width="3"/>
<text x="175" y="254" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="21" font-weight="700" fill="#6D5BD0" text-anchor="middle">1976-11</text>
<text x="175" y="348" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="middle">前史：DH 论文</text>
<text x="175" y="378" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">IEEE Trans. IT 22(6)</text>
<circle cx="510" cy="300" r="18" fill="#E3F4EE" stroke="#2E7D6B" stroke-width="3"/>
<text x="510" y="254" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="21" font-weight="700" fill="#2E7D6B" text-anchor="middle">1977-04-04</text>
<text x="510" y="348" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="middle">投稿</text>
<text x="510" y="378" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">论文文末：Received April 4, 1977</text>
<circle cx="845" cy="300" r="18" fill="#FFF4CF" stroke="#8A6A00" stroke-width="3"/>
<text x="845" y="254" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="21" font-weight="700" fill="#8A6A00" text-anchor="middle">1977-09-01</text>
<text x="845" y="348" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="middle">修订</text>
<text x="845" y="378" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">论文文末：revised September 1, 1977</text>
<circle cx="1170" cy="300" r="18" fill="#FBE7E3" stroke="#A33A32" stroke-width="3"/>
<text x="1170" y="254" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="21" font-weight="700" fill="#A33A32" text-anchor="middle">1978-02</text>
<text x="1170" y="348" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="middle">发表</text>
<text x="1170" y="378" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">CACM 21 卷 2 期，120–126 页</text>
<rect x="50" y="445" width="1300" height="82" rx="16" fill="#FFFFFF" stroke="#E7D9A8" stroke-width="1.5"/>
<text x="78" y="480" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">读图：1977 年的两次日期是论文文末的收稿/修订；1978 年 2 月才是 CACM 发表。</text>
<text x="78" y="508" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">证据：RSA 论文第 265 行；参考出处题录的 CACM 21(2), February 1978, pp. 120–126。</text>
<text x="78" y="568" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">原创示意图，CC BY 4.0。</text>
