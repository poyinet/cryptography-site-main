<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" role="img" aria-labelledby="title desc">
<title id="title">RSA 论文提出的两个后果</title>
<desc id="desc">示意图：左侧公开信道上的密钥分发，不需要信使；右侧可验证签名，不可伪造、不可否认。</desc>
<rect width="1400" height="820" fill="#F7F5EF"/>
<text x="60" y="70" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">RSA 论文提出的两个后果</text>
<text x="60" y="106" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">论文摘要的两个后果；不是 1977 年已经部署的系统。</text>
<rect x="50" y="150" width="620" height="430" rx="18" fill="#FFFFFF"/>
<rect x="72" y="168" width="160" height="34" rx="12" fill="#ECE8FF"/>
<text x="152.0" y="191.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="middle">公开信道</text>
<text x="72" y="244" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#1F1D1A" text-anchor="start">密钥分发</text>
<text x="72" y="276" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">公钥可以公开，只有接收者持有私钥</text>
<rect x="80" y="306" width="180" height="96" rx="14" fill="#ECE8FF"/>
<text x="170" y="344" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="18" font-weight="700" fill="#6D5BD0" text-anchor="middle">public key</text>
<text x="170" y="374" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="16" font-weight="400" fill="#6B655C" text-anchor="middle">(n, e)</text>
<line x1="276" y1="354" x2="344" y2="354" stroke="#6D5BD0" stroke-width="3"/>
<path d="M332 345 L344 354 L332 363" fill="none" stroke="#6D5BD0" stroke-width="3"/>
<rect x="360" y="306" width="250" height="96" rx="14" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="485" y="344" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="middle">recipient</text>
<text x="485" y="374" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="middle">私钥 d</text>
<text x="72" y="438" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#2E7D6B" text-anchor="start">不需要信使携带密钥</text>
<text x="72" y="468" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">「Couriers or other secure means are not needed to transmit keys」</text>
<text x="72" y="508" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">公开信道里传输的是公开值，不是私钥。</text>
<rect x="730" y="150" width="620" height="430" rx="18" fill="#FFFFFF"/>
<rect x="752" y="168" width="136" height="34" rx="12" fill="#E3F4EE"/>
<text x="820.0" y="191.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#2E7D6B" text-anchor="middle">签名</text>
<text x="752" y="244" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#1F1D1A" text-anchor="start">可验证签名</text>
<text x="752" y="276" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">私钥签名，公钥验证</text>
<rect x="760" y="306" width="250" height="96" rx="14" fill="#E3F4EE"/>
<text x="885" y="344" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#2E7D6B" text-anchor="middle">文件 + 签名</text>
<text x="885" y="374" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="15" font-weight="400" fill="#6B655C" text-anchor="middle">S = M^d mod n</text>
<line x1="1036" y1="354" x2="1104" y2="354" stroke="#2E7D6B" stroke-width="3"/>
<path d="M1092 345 L1104 354 L1092 363" fill="none" stroke="#2E7D6B" stroke-width="3"/>
<rect x="1120" y="306" width="190" height="96" rx="14" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="1215" y="344" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="middle">验证</text>
<text x="1215" y="374" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="15" font-weight="400" fill="#6B655C" text-anchor="middle">M = S^e mod n</text>
<text x="752" y="438" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#8A6A00" text-anchor="start">不可伪造；签署者不能事后否认</text>
<text x="752" y="468" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">「Signatures cannot be forged, and a signer cannot later deny the validity of his signature.」</text>
<text x="752" y="508" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">验证使用公开值，因此签名可被第三方检查。</text>
<rect x="50" y="610" width="1300" height="140" rx="16" fill="#FFFFFF" stroke="#E7D9A8" stroke-width="1.5"/>
<text x="78" y="646" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">读图：这两项是论文声称的后果，不是 1977 年的部署清单。</text>
<text x="78" y="676" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">论文随后请读者尝试攻破，并承认方案仍是有待检验的候选。</text>
<text x="78" y="708" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">证据：RSA 论文第 4–7、261–263 行。</text>
<text x="78" y="796" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">原创示意图，CC BY 4.0。</text>
</svg>
