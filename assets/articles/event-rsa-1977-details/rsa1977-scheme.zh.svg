<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="title desc">
<title id="title">RSA 的加密与签名骨架</title>
<desc id="desc">三栏示意图：密钥生成 n=pq、公开 e、保密 d；加密 C=M^e mod n 与解密 M=C^d mod n；签名 S=M^d mod n 与验证 M=S^e mod n。</desc>
<rect width="1400" height="760" fill="#F7F5EF"/>
<text x="55" y="68" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">RSA 的加密与签名骨架</text>
<text x="55" y="104" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">论文只给出骨架与安全性假设；本条不把它扩成现代填充、哈希或协议细节。</text>
<rect x="50" y="150" width="400" height="360" rx="18" fill="#FFFFFF"/>
<rect x="68" y="168" width="160" height="34" rx="12" fill="#ECE8FF"/>
<text x="148.0" y="190.5" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#6D5BD0" text-anchor="middle">1 · 密钥生成</text>
<rect x="480" y="150" width="440" height="360" rx="18" fill="#FFFFFF"/>
<rect x="498" y="168" width="160" height="34" rx="12" fill="#E3F4EE"/>
<text x="578.0" y="190.5" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#2E7D6B" text-anchor="middle">2 · 加密 / 解密</text>
<rect x="950" y="150" width="400" height="360" rx="18" fill="#FFFFFF"/>
<rect x="968" y="168" width="160" height="34" rx="12" fill="#FFF4CF"/>
<text x="1048.0" y="190.5" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6A00" text-anchor="middle">3 · 签名 / 验证</text>
<text x="70" y="246" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="25" font-weight="700" fill="#6D5BD0" text-anchor="start">n = p · q</text>
<text x="70" y="280" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">p、q 为保密大素数</text>
<text x="70" y="328" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="19" font-weight="700" fill="#1F1D1A" text-anchor="start">公开：(n, e)</text>
<text x="70" y="358" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="19" font-weight="700" fill="#1F1D1A" text-anchor="start">保密：d</text>
<text x="70" y="406" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">e 与 d 是配套的指数</text>
<text x="70" y="436" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">公开 n 不泄露 p、q 的分解</text>
<text x="498" y="246" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#2E7D6B" text-anchor="start">C = M^e mod n</text>
<text x="498" y="280" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">用公开指数 e 加密</text>
<text x="498" y="328" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#2E7D6B" text-anchor="start">M = C^d mod n</text>
<text x="498" y="362" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">用保密指数 d 解密</text>
<text x="498" y="410" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">只有 d 的持有者能还原 M</text>
<text x="498" y="440" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">论文把消息表示为一个数 M</text>
<text x="968" y="246" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#8A6A00" text-anchor="start">S = M^d mod n</text>
<text x="968" y="280" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">用保密指数 d 签名</text>
<text x="968" y="328" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#8A6A00" text-anchor="start">M = S^e mod n</text>
<text x="968" y="362" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">用公开指数 e 验证</text>
<text x="968" y="410" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">签名与加密使用同一对指数</text>
<text x="968" y="440" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">论文说签名不可伪造、不可否认</text>
<rect x="50" y="550" width="1300" height="140" rx="16" fill="#FFFFFF" stroke="#E7D9A8" stroke-width="1.5"/>
<text x="78" y="586" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">安全边界：论文说安全「rests in part on the difficulty of factoring n」，请读者尝试攻破，并称其为候选。</text>
<text x="78" y="616" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">读图：这里只是论文的算术骨架，不是现代 RSA 实现的完整规范。</text>
<text x="78" y="648" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">证据：RSA 论文第 4–7、261–263 行。</text>
<text x="78" y="728" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">原创示意图，CC BY 4.0。</text>
</svg>
