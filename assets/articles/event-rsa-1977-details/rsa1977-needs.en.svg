<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" role="img" aria-labelledby="title desc">
<title id="title">Two consequences stated by the RSA paper</title>
<desc id="desc">Diagram: key distribution over a public channel without a courier on the left; verifiable, unforgeable and non-repudiable signatures on the right.</desc>
<rect width="1400" height="820" fill="#F7F5EF"/>
<text x="60" y="70" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">Two consequences stated by the RSA paper</text>
<text x="60" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">The two consequences in the paper’s abstract; not a system deployed in 1977.</text>
<rect x="50" y="150" width="620" height="430" rx="18" fill="#FFFFFF"/>
<rect x="72" y="168" width="160" height="34" rx="12" fill="#ECE8FF"/>
<text x="152.0" y="191.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="middle">public channel</text>
<text x="72" y="244" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#1F1D1A" text-anchor="start">Key distribution</text>
<text x="72" y="276" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">The public key may be public; only the receiver holds the private key</text>
<rect x="80" y="306" width="180" height="96" rx="14" fill="#ECE8FF"/>
<text x="170" y="344" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="18" font-weight="700" fill="#6D5BD0" text-anchor="middle">public key</text>
<text x="170" y="374" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="16" font-weight="400" fill="#6B655C" text-anchor="middle">(n, e)</text>
<line x1="276" y1="354" x2="344" y2="354" stroke="#6D5BD0" stroke-width="3"/>
<path d="M332 345 L344 354 L332 363" fill="none" stroke="#6D5BD0" stroke-width="3"/>
<rect x="360" y="306" width="250" height="96" rx="14" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="485" y="344" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="middle">recipient</text>
<text x="485" y="374" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="middle">private key d</text>
<text x="72" y="438" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#2E7D6B" text-anchor="start">No courier has to carry a key</text>
<text x="72" y="468" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">“Couriers or other secure means are not needed to transmit keys”</text>
<text x="72" y="508" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">What travels on the public channel is the public value, not the private key.</text>
<rect x="730" y="150" width="620" height="430" rx="18" fill="#FFFFFF"/>
<rect x="752" y="168" width="136" height="34" rx="12" fill="#E3F4EE"/>
<text x="820.0" y="191.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#2E7D6B" text-anchor="middle">signature</text>
<text x="752" y="244" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#1F1D1A" text-anchor="start">Verifiable signatures</text>
<text x="752" y="276" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">Sign with the private key; verify with the public key</text>
<rect x="760" y="306" width="250" height="96" rx="14" fill="#E3F4EE"/>
<text x="885" y="344" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#2E7D6B" text-anchor="middle">document + signature</text>
<text x="885" y="374" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="15" font-weight="400" fill="#6B655C" text-anchor="middle">S = M^d mod n</text>
<line x1="1036" y1="354" x2="1104" y2="354" stroke="#2E7D6B" stroke-width="3"/>
<path d="M1092 345 L1104 354 L1092 363" fill="none" stroke="#2E7D6B" stroke-width="3"/>
<rect x="1120" y="306" width="190" height="96" rx="14" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="1215" y="344" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="middle">verify</text>
<text x="1215" y="374" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="15" font-weight="400" fill="#6B655C" text-anchor="middle">M = S^e mod n</text>
<text x="752" y="438" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#8A6A00" text-anchor="start">Cannot be forged; the signer cannot later deny it</text>
<text x="752" y="468" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">“Signatures cannot be forged, and a signer cannot later deny the validity of his signature.”</text>
<text x="752" y="508" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">Verification uses public values, so a third party can check the signature.</text>
<rect x="50" y="610" width="1300" height="140" rx="16" fill="#FFFFFF" stroke="#E7D9A8" stroke-width="1.5"/>
<text x="78" y="646" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">How to read it: these are consequences claimed by the paper, not a 1977 deployment list.</text>
<text x="78" y="676" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">The paper then invites attempts to break the scheme and admits it remains a candidate to be tested.</text>
<text x="78" y="708" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">Evidence: RSA paper lines 4–7 and 261–263.</text>
<text x="78" y="796" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">Original diagram, CC BY 4.0.</text>
</svg>
