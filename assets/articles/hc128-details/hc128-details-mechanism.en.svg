<rect x="80" y="255" width="150" height="50" rx="10" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="155" y="277" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#4B3F9E" text-anchor="middle">K ‖ IV</text>
<text x="155" y="296" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">128 + 128 bit</text>
