<text x="864" y="254" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">Key/IV 128/128 bit</text>
<circle cx="854" cy="275" r="2.5" fill="#4B3F9E"/>
<text x="864" y="279" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">P/Q: 512 × 32 bit each</text>
