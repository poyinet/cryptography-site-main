<text x="864" y="396" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">eSTREAM software portfolio</text>
<circle cx="854" cy="417" r="2.5" fill="#1F7A6A"/>
<text x="864" y="421" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">Bulk software encryption / PRNG</text>
<circle cx="854" cy="442" r="2.5" fill="#1F7A6A"/>
<text x="864" y="446" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">Long messages, not short packets</text>
<rect x="835" y="489" width="350" height="122" rx="12" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.2"/>
<text x="851" y="513" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#8A6100" text-anchor="left">Boundary</text>
