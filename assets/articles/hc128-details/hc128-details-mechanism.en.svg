<text x="864" y="304" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">4 KiB state; 1024-step warm-up</text>
<rect x="835" y="347" width="350" height="122" rx="12" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.2"/>
