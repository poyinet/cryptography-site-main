<text x="375" y="387" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#8A6100" text-anchor="middle">1024-step warm-up</text>
<text x="375" y="406" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">output feeds P/Q</text>
<rect x="515" y="375" width="170" height="54" rx="10" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="600" y="397" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#4B3F9E" text-anchor="middle">per step: update</text>
<text x="600" y="416" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">32 bit</text>
<rect x="735" y="382" width="60" height="40" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="765" y="402" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">s_i</text>
<text x="765" y="418" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">32 bit</text>
<line x1="230" y1="280" x2="280" y2="280" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<line x1="460" y1="270" x2="520" y2="265" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<line x1="460" y1="292" x2="520" y2="325" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<line x1="595" y1="287" x2="495" y2="365" stroke="#8A6100" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowAmber)"/>
<line x1="595" y1="347" x2="540" y2="365" stroke="#8A6100" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowAmber)"/>
<line x1="470" y1="392" x2="515" y2="400" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<line x1="685" y1="402" x2="735" y2="402" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<text x="80" y="485" font-family="'Consolas','SFMono-Regular',monospace" font-size="13" font-weight="500" fill="#6B655C" text-anchor="left">P[i] ← (P[i] + g₁(P[i−3], P[i−10], P[i−511])) ⊕ h₁(P[i−12])</text>
<text x="80" y="507" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">The Q step is symmetric; h₁/h₂ use the other table as an S-box, and each step updates one element.</text>
</g>
<rect x="830" y="185" width="360" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<rect x="835" y="205" width="350" height="122" rx="12" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.2"/>
