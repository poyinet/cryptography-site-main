<text x="370" y="277" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#1F7A6A" text-anchor="middle">W[0..1279]</text>
<text x="370" y="296" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">SHA-256-style expansion</text>
