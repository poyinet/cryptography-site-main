<text x="765" y="402" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">s_i</text>
<text x="765" y="418" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">32 bit</text>
<line x1="230" y1="280" x2="280" y2="280" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<line x1="460" y1="270" x2="520" y2="265" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<line x1="460" y1="292" x2="520" y2="325" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<line x1="595" y1="287" x2="495" y2="365" stroke="#8A6100" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowAmber)"/>
<line x1="595" y1="347" x2="540" y2="365" stroke="#8A6100" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowAmber)"/>
<line x1="470" y1="392" x2="515" y2="400" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<line x1="685" y1="402" x2="735" y2="402" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<text x="80" y="485" font-family="'Consolas','SFMono-Regular',monospace" font-size="13" font-weight="500" fill="#6B655C" text-anchor="left">P[i] ← (P[i] + g₁(P[i−3], P[i−10], P[i−511])) ⊕ h₁(P[i−12])</text>
<text x="80" y="507" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">Q 步对称；h₁/h₂ 用另一张表做查表，每步只更新一个元素。</text>
</g>
