<text x="375" y="387" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#8A6100" text-anchor="middle">1024 步热身</text>
<text x="375" y="406" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">输出反馈 P/Q</text>
