<rect x="0" y="0" width="1240" height="820" fill="#F7F5EF"/>
<text x="60" y="52" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#6B655C" text-anchor="left">FOUNDATIONS · DIGITAL SIGNATURES</text>
<text x="60" y="104" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="37" font-weight="800" fill="#1F1D1A" text-anchor="left">Rompel theorem</text>
<text x="60" y="143" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#6B655C" text-anchor="left">OWF ⇔ secure signatures</text>
<rect x="50" y="185" width="760" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="78" y="224" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="800" fill="#1F1D1A" text-anchor="left">Signatures from one-way functions alone</text>
<g clip-path="url(#mainClip)">
<rect x="64" y="305" width="128" height="105" rx="10" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="128" y="325" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">OWF</text>
<text x="128" y="342" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">any one-way function</text>
<line x1="192" y1="357" x2="208" y2="357" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<rect x="210" y="305" width="128" height="105" rx="10" fill="#FFFFFF" stroke="#8A6100" stroke-width="1.6"/>
<text x="274" y="325" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6100" text-anchor="middle">UOWHF</text>
<text x="274" y="342" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">compress / collision</text>
<line x1="338" y1="357" x2="354" y2="357" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<rect x="356" y="305" width="128" height="105" rx="10" fill="#FFFFFF" stroke="#8A6100" stroke-width="1.6"/>
<text x="420" y="325" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6100" text-anchor="middle">Lamport</text>
<text x="420" y="342" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">one-time signature</text>
<line x1="484" y1="357" x2="500" y2="357" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<rect x="502" y="305" width="128" height="105" rx="10" fill="#FFFFFF" stroke="#8A6100" stroke-width="1.6"/>
<text x="566" y="325" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6100" text-anchor="middle">Merkle</text>
<text x="566" y="342" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">tree extension</text>
<line x1="630" y1="357" x2="646" y2="357" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<rect x="648" y="305" width="128" height="105" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="712" y="325" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">EUF-CMA</text>
<text x="712" y="342" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">many messages</text>
<rect x="64" y="450" width="710" height="40" rx="8" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1"/>
<text x="78" y="476" font-family="'Consolas','SFMono-Regular',monospace" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="left">pk(i,b)=H(s(i,b));  sig(m)=s(1,m1)…s(n,mn)</text>
<text x="64" y="525" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="600" fill="#9B2C2C" text-anchor="left">Signing two different messages under one one-time key leaks two preimages at some bit, enabling forgery.</text>
<text x="64" y="560" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#6B655C" text-anchor="left">A Merkle tree compresses N one-time public keys into one root; signatures carry a path of cost O(log N).</text>
</g>
<rect x="830" y="185" width="360" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
