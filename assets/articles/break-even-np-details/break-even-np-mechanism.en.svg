<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="NP-Completeness of PARTITION mechanism"><rect width="1240" height="820" fill="#fbf8f1"/><text x="42" y="58" font-family="Georgia,Noto Serif SC,serif" font-size="32" font-weight="700" fill="#2d2a24">NP-Completeness of PARTITION</text><text x="42" y="90" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#7a6f5f">Formula-level mechanism: steps, parameters, use and failure boundary</text><rect x="42" y="126" width="256" height="120" rx="16" fill="#f6e7d7" stroke="#cfc4b4"/><text x="60" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 1</text><text x="60" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">instance (S,B)</text><path d="M306 186 L332 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="342" y="126" width="256" height="120" rx="16" fill="#e4efe6" stroke="#cfc4b4"/><text x="360" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 2</text><text x="360" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">certificate subset</text><text x="360" y="208" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">T</text><path d="M606 186 L632 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="642" y="126" width="256" height="120" rx="16" fill="#e6e9f5" stroke="#cfc4b4"/><text x="660" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 3</text><text x="660" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">Karp reduction</text><path d="M906 186 L932 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="942" y="126" width="256" height="120" rx="16" fill="#f3e3ea" stroke="#cfc4b4"/><text x="960" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 4</text><text x="960" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">pseudo-polynomial</text><text x="960" y="208" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">DP boundary</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a89a86"/></marker></defs><rect x="42" y="272" width="1156" height="204" rx="14" fill="#fffdf8" stroke="#d8cfc2"/><text x="62" y="300" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">CORE FORMULAS</text><text x="62" y="328" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">S={a_1,…,a_r}, ΣS=2B, ∃T⊆S: ΣT=B</text><text x="62" y="355" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">c_i=a_i (i≤r); c_{r+1}=b+1; c_{r+2}=Σa_i+1−b</text><text x="62" y="382" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">Σc=2(Σa_i+1), B′=Σa_i+1</text><text x="62" y="409" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">KNAPSACK(a,b) ⇔ PARTITION(c,B′)</text><text x="62" y="444" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">A certificate T summing to B is verified in polynomial time; Karp&#39;s reduction keeps every KNAPSACK number and</text><text x="62" y="466" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">adds the two balancing numbers b+1 and Σa_i+1−b.</text><rect x="42" y="496" width="1156" height="190" rx="14" fill="#f8f4eb" stroke="#d8cfc2"/><text x="62" y="524" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">PARAMETERS AND BOUNDARY</text><text x="62" y="548" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">Input is a multiset S and target B with ΣS=2B; decide whether some T⊆S has ΣT=B; numbers are binary encoded.</text><text x="62" y="592" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">Karp&#39;s 1972 reduction starts from KNAPSACK: c_{r+1}=b+1 and c_{r+2}=Σa_i+1−b, with total and target B′=Σa_i+1.</text><text x="62" y="636" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">Boundary: NP-completeness is worst-case evidence only; the O(rB) DP is pseudo-polynomial and infeasible for large</text><text x="62" y="655" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">binary B; it gives no average-case cryptographic hardness.</text><text x="42" y="714" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#4a433a">Read the assumptions, reduction direction and parameters first, then check implementation modes and failure conditions; the</text><text x="42" y="736" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#4a433a">diagram does not replace a paper theorem or clause text.</text><text x="42" y="786" font-family="Inter,Noto Sans SC,sans-serif" font-size="12" fill="#8b7d6b">Original formula-level mechanism diagram · CC BY 4.0 · poyi knowledge · 2026-11-23</text></svg>