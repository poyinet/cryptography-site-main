<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="平分问题（PARTITION）NP 完全性 mechanism"><rect width="1240" height="820" fill="#fbf8f1"/><text x="42" y="58" font-family="Georgia,Noto Serif SC,serif" font-size="32" font-weight="700" fill="#2d2a24">平分问题（PARTITION）NP 完全性</text><text x="42" y="90" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#7a6f5f">公式级机制：步骤、参数、适用与失效边界</text><rect x="42" y="126" width="256" height="120" rx="16" fill="#f6e7d7" stroke="#cfc4b4"/><text x="60" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 1</text><text x="60" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">实例 (S,B)</text><path d="M306 186 L332 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="342" y="126" width="256" height="120" rx="16" fill="#e4efe6" stroke="#cfc4b4"/><text x="360" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 2</text><text x="360" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">证书子集 T</text><path d="M606 186 L632 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="642" y="126" width="256" height="120" rx="16" fill="#e6e9f5" stroke="#cfc4b4"/><text x="660" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 3</text><text x="660" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">Karp 归约</text><path d="M906 186 L932 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="942" y="126" width="256" height="120" rx="16" fill="#f3e3ea" stroke="#cfc4b4"/><text x="960" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 4</text><text x="960" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">伪多项式 DP 边界</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a89a86"/></marker></defs><rect x="42" y="272" width="1156" height="204" rx="14" fill="#fffdf8" stroke="#d8cfc2"/><text x="62" y="300" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">核心公式</text><text x="62" y="328" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">S={a_1,…,a_r}, ΣS=2B, ∃T⊆S: ΣT=B</text><text x="62" y="355" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">c_i=a_i (i≤r); c_{r+1}=b+1; c_{r+2}=Σa_i+1−b</text><text x="62" y="382" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">Σc=2(Σa_i+1), B′=Σa_i+1</text><text x="62" y="409" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">KNAPSACK(a,b) ⇔ PARTITION(c,B′)</text><text x="62" y="444" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">证书 T 的和为 B 即可在多项式时间验证；Karp 归约把 KNAPSACK 的每个数保留，再加 b+1 与 Σa_i+1−b 两个配平数。</text><rect x="42" y="496" width="1156" height="190" rx="14" fill="#f8f4eb" stroke="#d8cfc2"/><text x="62" y="524" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">参数与边界</text><text x="62" y="548" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">输入为多重集 S 与目标 B，ΣS=2B；判定是否存在 T⊆S 使 ΣT=B；数值以二进制编码。</text><text x="62" y="592" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">Karp 1972 的归约来自 KNAPSACK：c_{r+1}=b+1，c_{r+2}=Σa_i+1−b，总和新目标 B′=Σa_i+1。</text><text x="62" y="636" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">边界：NP 完全只给最坏情况证据；O(rB) 的 DP 是伪多项式，B 的二进制长度很大时不可行；不产生密码学平均-case 困难性。</text><text x="42" y="714" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#4a433a">读法：先核对假设、归约方向与参数，再检查实现模式与失效条件；图不替代论文定理或标准条文。</text><text x="42" y="786" font-family="Inter,Noto Sans SC,sans-serif" font-size="12" fill="#8b7d6b">原创公式级机制图 · CC BY 4.0 · poyi knowledge · 2026-11-23</text></svg>