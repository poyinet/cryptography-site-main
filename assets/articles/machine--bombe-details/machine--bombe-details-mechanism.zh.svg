<text x="582.5" y="587" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">S(S(x))=x：双向传播，减少假 stop</text>
<text x="80" y="630" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="left">stop 仍需人工在 Enigma 复制机上验证并补全插线板。</text>
