<text x="74" y="716" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">Reading: the menu is a graph of letter constraints derived from the crib; the bombe turns each rotor hypothesis</text>
