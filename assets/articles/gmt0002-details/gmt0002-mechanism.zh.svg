<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="GM/T 0002-2012 SM4 分组密码算法">
<rect width="1240" height="820" fill="#f6f3ea"/>
<rect x="28" y="24" width="1184" height="784" rx="18" fill="#fffdf7" stroke="#d8d2c4" stroke-width="1.5"/>
<text x="80" y="74" font-size="22" font-weight="700" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">GM/T 0002-2012 SM4 分组密码算法</text>
<text x="82" y="104" font-size="14" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6c7486">128 位分组 · 128 位密钥 · 32 轮 · 密钥扩展</text>
<rect x="80" y="120" width="1080" height="1" fill="#ded8c8"/>
<text x="82" y="144" font-size="12" letter-spacing="1.2" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">公式级 · 可复述、可核源、可对照</text>
<rect x="80" y="170" width="250" height="150" rx="10" fill="#fffaf0" stroke="#c8a24b" stroke-width="1.2"/>
<circle cx="106" cy="196" r="14" fill="#c8a24b"/>
<text x="106" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">1</text>
<text x="128" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 1</text>
<text x="104" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">密钥与参数</text>
<text x="104" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">定义 / 输入</text>
<rect x="350" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="376" cy="196" r="14" fill="#14213d"/>
<text x="376" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">2</text>
<text x="398" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 2</text>
<text x="374" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">轮密钥扩展</text>
<text x="374" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">变换 / 方程</text>
<rect x="620" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="646" cy="196" r="14" fill="#14213d"/>
<text x="646" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">3</text>
<text x="668" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 3</text>
<text x="644" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">32 轮迭代</text>
<text x="644" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">观测 / 解码</text>
<rect x="890" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="916" cy="196" r="14" fill="#14213d"/>
<text x="916" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">4</text>
<text x="938" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 4</text>
<text x="914" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">解密与示例</text>
<text x="914" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">边界 / 结果</text>
<rect x="80" y="350" width="1080" height="200" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<text x="102" y="382" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">核心公式与量级</text>
<text x="112" y="412" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">MK=(MK_0..MK_3)，K_i=MK_i⊕FK_i</text>
<text x="112" y="429" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">rk_i=K_i⊕T′(K_{i+1}⊕K_{i+2}⊕K_{i+3}⊕CK_i)</text>
<text x="112" y="446" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">T′(x)=L′(Sbox(x))，L′(B)=B⊕(B⋘13)⊕(B⋘23)</text>
<text x="112" y="463" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">X_{i+4}=X_i⊕T(X_{i+1}⊕X_{i+2}⊕X_{i+3}⊕rk_i)</text>
<text x="112" y="480" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">T(x)=L(Sbox(x))</text>
<text x="112" y="497" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">L(B)=B⊕(B⋘2)⊕(B⋘10)⊕(B⋘18)⊕(B⋘24)</text>
<text x="112" y="514" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">解密：rk_31..rk_0 逆序，结构不变</text>
<text x="112" y="531" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">示例：0123…3210 → 681edf34…36e4246</text>
<rect x="80" y="570" width="1080" height="190" rx="10" fill="#fbfaf4" stroke="#ded8c8" stroke-width="1.2"/>
<text x="102" y="590" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">细节 / 参数 / 边界</text>
<text x="112" y="614" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">分组 128 位、密钥 128 位、32 轮，状态为 4 个 32 位字。</text>
<text x="112" y="632" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">密钥扩展用系统参数 FK 与固定参数 CK，得到 32 个轮密钥。</text>
<text x="112" y="650" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">轮函数 T 先过 8×8 S 盒，再做 2/10/18/24 位循环移位异或。</text>
<text x="112" y="668" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">附录 A 给出 0123…3210 到 681edf34…36e4246 的示例；百万次迭代另测。</text>
<text x="112" y="688" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">GM/T 0002-2012：2012-03-21 发布并实施，12 页；现行行业标准，国家标准对应 GB/T 32907-2016。</text>
<text x="112" y="706" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">分组 128 位、密钥 128 位、轮数 32；轮密钥 32×32 位；S 盒 8 位进 8 位出。</text>
<text x="112" y="724" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">边界：只规定分组密码本体；工作模式、MAC、密钥管理与侧信道防护由配套标准与实现负责。</text>
<text x="80" y="774" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">来源：GM/T 0002-2012 标准全文、全国标准信息公共服务平台题录、国家密码管理局标准查询页。</text>
<text x="80" y="790" font-size="11.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6f7788">边界：SM4 是分组密码本体，不能直接当认证或密钥交换协议。</text>
<text x="80" y="806" font-size="11.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6f7788">S 盒查表与轮运算要考虑缓存、功耗和故障注入侧信道。</text>
<text x="1160" y="806" text-anchor="end" font-size="10" font-family="ui-monospace, Consolas, monospace" fill="#a39c8a">R134 · 2026-11-24 · gmt0002-details</text>
</svg>