<text x="420" y="409" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">密钥不确定性必须覆盖消息</text>
<rect x="80" y="480" width="660" height="40" rx="8" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1"/>
<text x="94" y="506" font-family="'Consolas','SFMono-Regular',monospace" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="left">H(M|C)=H(M) ⇒ H(K) ≥ H(M)</text>
<text x="80" y="550" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">一次一密达到等号；重复使用则 C1⊕C2 = M1⊕M2，密钥流相互抵消。</text>
