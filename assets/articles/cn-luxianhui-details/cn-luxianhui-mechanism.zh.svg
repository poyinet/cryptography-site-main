<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="路献辉与格密码">
<rect width="1240" height="820" fill="#f6f3ea"/>
<rect x="28" y="24" width="1184" height="784" rx="18" fill="#fffdf7" stroke="#d8d2c4" stroke-width="1.5"/>
<text x="80" y="74" font-size="28" font-weight="700" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">路献辉与格密码</text>
<text x="82" y="104" font-size="14" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6c7486">格密码、自动机、椭圆曲线与 MPC · 公式级机制卡</text>
<rect x="80" y="120" width="1080" height="1" fill="#ded8c8"/>
<text x="82" y="144" font-size="12" letter-spacing="1.2" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">公式级 · 可复述、可核源、可对照</text>
<rect x="80" y="170" width="250" height="150" rx="10" fill="#fffaf0" stroke="#c8a24b" stroke-width="1.2"/>
<circle cx="106" cy="196" r="14" fill="#c8a24b"/>
<text x="106" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">1</text>
<text x="128" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 1</text>
<text x="104" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">固定环与分布</text>
<text x="104" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">定义 / 输入</text>
<rect x="350" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="376" cy="196" r="14" fill="#14213d"/>
<text x="376" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">2</text>
<text x="398" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 2</text>
<text x="374" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">生成 b=as+e</text>
<text x="374" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">变换 / 方程</text>
<rect x="620" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="646" cy="196" r="14" fill="#14213d"/>
<text x="646" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">3</text>
<text x="668" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 3</text>
<text x="644" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">封装 c=(c1,c2)</text>
<text x="644" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">观测 / 解码</text>
<rect x="890" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="916" cy="196" r="14" fill="#14213d"/>
<text x="916" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">4</text>
<text x="938" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 4</text>
<text x="914" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">消共享项解码</text>
<text x="914" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">边界 / 结果</text>
<rect x="80" y="350" width="1080" height="200" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<text x="102" y="382" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">核心公式与量级</text>
<text x="112" y="424" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">R_q = Z_q[x]/(x^n+1), q=251</text>
<text x="112" y="442" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">KG: b = a s + e</text>
<text x="112" y="460" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Enc: c1 = a r + e1</text>
<text x="112" y="478" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">  c2 = (b r)_lv + e2 + floor(q/2) m</text>
<text x="112" y="496" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Dec: u = c1 s</text>
<text x="112" y="514" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">  m&#39; = c2 - (u)_lv</text>
<text x="112" y="532" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">  bit = 1 iff q/4 &lt;= m&#39;_i &lt; 3q/4</text>
<text x="112" y="550" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">KEM: seed = G(m||pk), c = Enc(pk,m;seed)</text>
<rect x="80" y="570" width="1080" height="190" rx="10" fill="#fbfaf4" stroke="#ded8c8" stroke-width="1.2"/>
<text x="102" y="590" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">细节 / 参数 / 边界</text>
<text x="112" y="614" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">b=as+e 是一个环 LWE 样本：a 由种子展开，s 与 e 从中心二项分布采样。加密把随机掩码 r 乘到 a 与 b 上，第二项再用 floor(q/2)m</text>
<text x="112" y="632" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">把明文推到环元素的两端；解密先用 c1s 消掉 ar 项，再按 q/4 与 3q/4 的阈值恢复比特。</text>
<text x="112" y="688" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">LAC：q=251，n=512 或 1024；秘密与误差用中心二项分布；PKE 为 IND-CPA，KEM 通过 FO 重加密达到 IND-CCA。</text>
<text x="112" y="706" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">CCA 密文量级约 2n+32 字节；q=251 便于按字节运算，代价是不能直接用常规 NTT。</text>
<text x="112" y="724" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">边界：NIST 第二轮候选不等于最终标准；LAC 未进第三轮，参数与安全性必须按具体版本重算。</text>
<text x="80" y="774" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">原创公式级机制图（据 LAC 技术文档、UCAS 简介与 NIST IR 8309 绘制）</text>
<text x="80" y="790" font-size="11.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6f7788">读法：先核对环、q、n 与分布，再检查 FO 重加密和解码阈值；图不替代 LAC 规范、NIST 评估或实现审计。</text>
<text x="1160" y="806" text-anchor="end" font-size="10" font-family="ui-monospace, Consolas, monospace" fill="#a39c8a">R127 · 2026-11-23 · cn-luxianhui-details</text>
</svg>