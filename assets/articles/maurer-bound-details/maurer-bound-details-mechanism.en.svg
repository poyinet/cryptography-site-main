<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Maurer's Bound</title>
<desc id="fig-desc">How many messages one key can authenticate — mechanism schematic with parameters, use and limits.</desc>
<defs>
