<text x="60" y="104" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="38" font-weight="800" fill="#1F1D1A" text-anchor="left">CMC: two-pass CBC–Mask–CBC wide block</text>
<text x="60" y="143" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#6B655C" text-anchor="left">A sector is CBC-encrypted, masked from its end chaining values, then CBC-decrypted; the tweak binds the sector number.</text>
