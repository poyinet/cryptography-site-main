<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Trivium：三个 NLFSR 首尾相接</title>
<desc id="fig-desc">核心路径：三寄存器 → 1152 拍 → 每拍 3 位更新 — mechanism schematic with parameters, use and limits.</desc>
<defs>
      <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4B3F9E"/></marker>
      <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1F7A6A"/></marker>
      <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8A6100"/></marker>
      <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9B2C2C"/></marker>
      <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B655C"/></marker>
      <clipPath id="mainClip"><rect x="50" y="185" width="760" height="450" rx="16"/></clipPath>
    </defs>
<rect x="0" y="0" width="1240" height="820" fill="#F7F5EF"/>
<text x="60" y="52" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#6B655C" text-anchor="left">算法 · 硬件流密码</text>
<text x="60" y="104" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="38" font-weight="800" fill="#1F1D1A" text-anchor="left">Trivium：三个 NLFSR 首尾相接</text>
<text x="60" y="143" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#6B655C" text-anchor="left">288 位状态分成 93/84/111 三个寄存器，每拍只更新三位，1152 拍初始化后逐位出流。</text>
<rect x="50" y="185" width="760" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="78" y="224" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="800" fill="#1F1D1A" text-anchor="left">核心路径：三寄存器 → 1152 拍 → 每拍 3 位更新</text>
<g clip-path="url(#mainClip)">
<rect x="80" y="255" width="650" height="38" rx="8" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="92" y="279" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#4B3F9E" text-anchor="left">A · 93 bit</text>
<text x="718" y="279" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="end">密钥 K 80 bit → A[0..79]</text>
<rect x="80" y="310" width="610" height="38" rx="8" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="92" y="334" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F7A6A" text-anchor="left">B · 84 bit</text>
<text x="678" y="334" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="end">IV 80 bit → B[0..79]</text>
<rect x="80" y="365" width="680" height="38" rx="8" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="92" y="389" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#8A6100" text-anchor="left">C · 111 bit</text>
<text x="748" y="389" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="end">C[285..287] = 1</text>
<rect x="80" y="432" width="220" height="54" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="190" y="454" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#8A6100" text-anchor="middle">1152 拍初始化</text>
<text x="190" y="473" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">4 × 288</text>
<rect x="330" y="432" width="220" height="54" rx="10" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="440" y="454" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#4B3F9E" text-anchor="middle">每拍更新 3 位</text>
<text x="440" y="473" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">输出 1 位</text>
<rect x="580" y="438" width="150" height="42" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="655" y="458" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">z = t₁⊕t₂⊕t₃</text>
<text x="655" y="474" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">1 bit</text>
<line x1="300" y1="459" x2="330" y2="459" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<line x1="550" y1="459" x2="580" y2="459" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<text x="80" y="515" font-family="'Consolas','SFMono-Regular',monospace" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">t₁ = s₆₆⊕s₉₃⊕s₉₁·s₉₂⊕s₁₇₁；t₂ = s₁₆₂⊕s₁₇₇⊕s₁₇₅·s₁₇₆⊕s₂₆₄</text>
<text x="80" y="535" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="left">t₃ = s₂₄₃⊕s₂₈₈⊕s₂₈₆·s₂₈₇⊕s₆₉；三个新位分别移入 A/B/C 头部。</text>
</g>
