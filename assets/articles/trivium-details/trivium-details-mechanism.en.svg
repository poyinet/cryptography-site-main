<text x="440" y="473" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">one output bit</text>
<rect x="580" y="438" width="150" height="42" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="655" y="458" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">z = t₁⊕t₂⊕t₃</text>
<text x="655" y="474" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">1 bit</text>
<line x1="300" y1="459" x2="330" y2="459" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<line x1="550" y1="459" x2="580" y2="459" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<text x="80" y="515" font-family="'Consolas','SFMono-Regular',monospace" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">t₁ = s₆₆⊕s₉₃⊕s₉₁·s₉₂⊕s₁₇₁; t₂ = s₁₆₂⊕s₁₇₇⊕s₁₇₅·s₁₇₆⊕s₂₆₄</text>
<text x="80" y="535" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="left">t₃ = s₂₄₃⊕s₂₈₈⊕s₂₈₆·s₂₈₇⊕s₆₉; the three new bits shift into A/B/C.</text>
</g>
