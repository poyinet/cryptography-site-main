<text x="92" y="334" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F7A6A" text-anchor="left">B · 84 bit</text>
<text x="678" y="334" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="end">IV 80 bit → B[0..79]</text>
<rect x="80" y="365" width="680" height="38" rx="8" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="92" y="389" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#8A6100" text-anchor="left">C · 111 bit</text>
<text x="748" y="389" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="end">C[285..287] = 1</text>
<rect x="80" y="432" width="220" height="54" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
