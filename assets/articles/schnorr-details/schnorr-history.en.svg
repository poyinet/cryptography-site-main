<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="title desc">
<title id="title">From patent filing to journal article: putting the year in place</title>
<desc id="desc">This entry dates the text to the 1991 journal article; the patent dates are supplementary metadata on the same page, not the publication year.</desc>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1F1D1A" flood-opacity="0.075"/></filter></defs>
<rect width="1240" height="820" fill="#F7F5EF"/>
<text x="64" y="42" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#6B655C" text-anchor="start">SCHNORR / 1991</text>
<text x="64" y="88" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="36" font-weight="750" fill="#1F1D1A" text-anchor="start">From patent filing to journal article: putting the year in place</text>
<text x="64" y="122" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">This entry dates the text to the 1991 journal article; the patent dates are supplementary metadata on the same page, not the publication year.</text>
<line x1="64" y1="146" x2="1176" y2="146" stroke="#DED9CE" stroke-width="1.5"/>
<line x1="100" y1="326" x2="1140" y2="326" stroke="#DED9CE" stroke-width="3"/>
<circle cx="160" cy="326" r="18" fill="#9A6A00"/>
<circle cx="160" cy="326" r="7" fill="#FFFFFF"/>
<text x="160" y="274" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="18" font-weight="750" fill="#9A6A00" text-anchor="middle">1989-02-24</text>
<text x="160" y="370" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="middle">European patent application</text>
<text x="160" y="396" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="500" fill="#6B655C" text-anchor="middle">89103290.6</text>
<line x1="160" y1="344" x2="160" y2="430" stroke="#9A6A00" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="620" cy="326" r="18" fill="#4B3F9E"/>
<circle cx="620" cy="326" r="7" fill="#FFFFFF"/>
<text x="620" y="274" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="18" font-weight="750" fill="#4B3F9E" text-anchor="middle">1991-01</text>
<text x="620" y="370" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="middle">Journal of Cryptology</text>
<text x="620" y="396" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="500" fill="#6B655C" text-anchor="middle">4(3): 161–174</text>
<line x1="620" y1="344" x2="620" y2="430" stroke="#4B3F9E" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="1040" cy="326" r="18" fill="#1F7A6A"/>
<circle cx="1040" cy="326" r="7" fill="#FFFFFF"/>
<text x="1040" y="274" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="18" font-weight="750" fill="#1F7A6A" text-anchor="middle">1991-02-19</text>
<text x="1040" y="370" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="middle">US patent</text>
<text x="1040" y="396" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="500" fill="#6B655C" text-anchor="middle">4995082</text>
<line x1="1040" y1="344" x2="1040" y2="430" stroke="#1F7A6A" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="64" y="456" width="540" height="190" rx="18" fill="#FFFFFF" stroke="#1F7A6A" stroke-width="1.2" filter="url(#soft)"/>
<text x="92" y="494" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="750" fill="#1F7A6A" text-anchor="start">The paper gives</text>
<circle cx="100" cy="528" r="10" fill="#1F7A6A"/>
<text x="100" y="533" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="122" y="534" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1F1D1A" text-anchor="start">public-key signature + authentication</text>
<circle cx="100" cy="566" r="10" fill="#1F7A6A"/>
<text x="100" y="571" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="122" y="572" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1F1D1A" text-anchor="start">subgroup parameters p ≥ 2^512, q ≥ 2^140</text>
<circle cx="100" cy="604" r="10" fill="#1F7A6A"/>
<text x="100" y="609" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="122" y="610" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1F1D1A" text-anchor="start">preprocessing speed-up for random exponentiation</text>
<rect x="636" y="456" width="540" height="190" rx="18" fill="#FFFFFF" stroke="#A33A32" stroke-width="1.2" filter="url(#soft)"/>
<text x="664" y="494" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="750" fill="#A33A32" text-anchor="start">The paper does not give</text>
<circle cx="672" cy="528" r="10" fill="#A33A32"/>
<text x="672" y="533" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="694" y="534" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1F1D1A" text-anchor="start">a smart-card product or deployment record</text>
<circle cx="672" cy="566" r="10" fill="#A33A32"/>
<text x="672" y="571" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="694" y="572" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1F1D1A" text-anchor="start">a formal security proof</text>
<circle cx="672" cy="604" r="10" fill="#A33A32"/>
<text x="672" y="609" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="694" y="610" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1F1D1A" text-anchor="start">side-channel implementation detail</text>
<rect x="64" y="674" width="1112" height="74" rx="16" fill="#F0EDE6" stroke="#DED9CE" stroke-width="1"/>
<text x="92" y="708" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1F1D1A" text-anchor="start">Reading rule: "Received 17 August 1989 / Revised 15 March 1991" shows a long revision history;</text>
<text x="92" y="731" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1F1D1A" text-anchor="start">do not turn the 1989 patent filing into the journal publication year.</text>
<line x1="64" y1="762" x2="1176" y2="762" stroke="#DED9CE" stroke-width="1"/>
<text x="64" y="788" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6B655C" text-anchor="start">Article metadata is quoted; patent dates are separate records, not a second publication date.</text>
<text x="1176" y="788" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8A8378" text-anchor="end">schnorr-1991-abstract.txt:10-23</text>
<text x="1176" y="42" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A8378" text-anchor="end">FIG 3</text>
</svg>
