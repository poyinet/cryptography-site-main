<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="title desc">
<title id="title">Three promises in Schnorr's 1991 paper</title>
<desc id="desc">A large prime group, subgroup parameters, signature and authentication, and preprocessing for smart cards.</desc>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1F1D1A" flood-opacity="0.075"/></filter></defs>
<rect width="1240" height="820" fill="#F7F5EF"/>
<text x="64" y="42" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#6B655C" text-anchor="start">SCHNORR / 1991</text>
<text x="64" y="88" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="36" font-weight="750" fill="#1F1D1A" text-anchor="start">Three promises in Schnorr's 1991 paper</text>
<text x="64" y="122" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">A large prime group, subgroup parameters, signature and authentication, and preprocessing for smart cards.</text>
<line x1="64" y1="146" x2="1176" y2="146" stroke="#DED9CE" stroke-width="1.5"/>
<rect x="64" y="184" width="356" height="470" rx="20" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="1.2" filter="url(#soft)"/>
<rect x="64" y="184" width="356" height="64" rx="20" fill="#ECE9FA"/>
<text x="92" y="224" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="750" fill="#4B3F9E" text-anchor="start">(1) Parameters</text>
<circle cx="242" cy="338" r="112" fill="#F0EDE6" stroke="#DED9CE" stroke-width="2"/>
<circle cx="242" cy="338" r="68" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.5"/>
<circle cx="242" cy="330" r="9" fill="#4B3F9E"/>
<text x="242" y="362" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="22" font-weight="700" fill="#4B3F9E" text-anchor="middle">α</text>
<text x="242" y="456" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="18" font-weight="700" fill="#6B655C" text-anchor="middle">Z_p*</text>
<text x="242" y="300" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#4B3F9E" text-anchor="middle">order q</text>
<rect x="92" y="486" width="300" height="44" rx="12" fill="#ECE9FA"/>
<text x="242.0" y="513.44" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="16" font-weight="700" fill="#4B3F9E" text-anchor="middle">p ≥ 2^512</text>
<rect x="92" y="540" width="300" height="44" rx="12" fill="#ECE9FA"/>
<text x="242.0" y="567.44" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="16" font-weight="700" fill="#4B3F9E" text-anchor="middle">q ≥ 2^140</text>
<rect x="92" y="594" width="300" height="44" rx="12" fill="#F0EDE6"/>
<text x="242.0" y="621.1" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="15" font-weight="700" fill="#1F1D1A" text-anchor="middle">α has order q</text>
<rect x="456" y="184" width="360" height="470" rx="20" fill="#FFFFFF" stroke="#1F7A6A" stroke-width="1.2" filter="url(#soft)"/>
<rect x="456" y="184" width="360" height="64" rx="20" fill="#E2F3EE"/>
<text x="484" y="224" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="750" fill="#1F7A6A" text-anchor="start">(2) Two schemes</text>
<circle cx="545" cy="350" r="36" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.5"/>
<text x="545" y="360" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#1F7A6A" text-anchor="middle">✎</text>
<circle cx="727" cy="350" r="36" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.5"/>
<text x="727" y="360" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#1F7A6A" text-anchor="middle">✓</text>
<line x1="590" y1="350" x2="682" y2="350" stroke="#1F7A6A" stroke-width="3"/>
<path d="M671.0 345.1 L682.0 350.0 L671.0 354.9" fill="none" stroke="#1F7A6A" stroke-width="3"/>
<text x="545" y="408" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F1D1A" text-anchor="middle">public-key</text>
<text x="545" y="428" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F1D1A" text-anchor="middle">signature</text>
<text x="727" y="408" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F1D1A" text-anchor="middle">corresponding</text>
<text x="727" y="428" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F1D1A" text-anchor="middle">authentication</text>
<text x="484" y="474" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">Both share the same</text>
<text x="484" y="496" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">discrete-log parameters.</text>
<text x="484" y="528" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1F7A6A" text-anchor="start">paper wording</text>
<text x="484" y="552" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6B655C" text-anchor="start">"a new public-key signature scheme and a</text>
<text x="484" y="570" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6B655C" text-anchor="start">corresponding authentication scheme"</text>
<rect x="848" y="184" width="328" height="470" rx="20" fill="#FFFFFF" stroke="#9A6A00" stroke-width="1.2" filter="url(#soft)"/>
<rect x="848" y="184" width="328" height="64" rx="20" fill="#FFF3CD"/>
<text x="876" y="224" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="750" fill="#9A6A00" text-anchor="start">(3) Speed</text>
<circle cx="1012" cy="326" r="38" fill="#FFF3CD" stroke="#9A6A00" stroke-width="1.5"/>
<text x="1012" y="336" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#9A6A00" text-anchor="middle">⏱</text>
<circle cx="880" cy="391" r="12" fill="#9A6A00"/>
<text x="880" y="397" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="902" y="396" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">faster signing and</text>
<text x="902" y="418" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">verification</text>
<circle cx="880" cy="445" r="12" fill="#9A6A00"/>
<text x="880" y="451" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="902" y="450" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">shorter signatures</text>
<circle cx="880" cy="499" r="12" fill="#9A6A00"/>
<text x="880" y="505" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="902" y="504" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">preprocess random</text>
<text x="902" y="526" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">exponentiation</text>
<text x="876" y="566" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">Three improvements</text>
<text x="876" y="586" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">over ElGamal.</text>
<rect x="64" y="676" width="1112" height="74" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.1"/>
<text x="620" y="718" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#1F1D1A" text-anchor="middle">Paper title: Efficient signature generation by smart cards. The paper presents preprocessing as an optional speed-up, not as a deployment record.</text>
<line x1="64" y1="762" x2="1176" y2="762" stroke="#DED9CE" stroke-width="1"/>
<text x="64" y="788" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6B655C" text-anchor="start">Parameters and claims are from the abstract; the figure does not invent a signing equation.</text>
<text x="1176" y="788" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8A8378" text-anchor="end">schnorr-1991-abstract.txt:10-23</text>
<text x="1176" y="42" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A8378" text-anchor="end">FIG 1</text>
</svg>
