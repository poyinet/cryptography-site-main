<text x="266" y="420" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="9" font-weight="700" fill="#4B3F9E" text-anchor="middle">r4</text>
<rect x="96" y="448" width="40" height="32" rx="8" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1"/>
<text x="116" y="468" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="9" font-weight="700" fill="#4B3F9E" text-anchor="middle">r5</text>
<rect x="146" y="448" width="40" height="32" rx="8" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1"/>
<text x="166" y="468" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="9" font-weight="700" fill="#4B3F9E" text-anchor="middle">r6</text>
