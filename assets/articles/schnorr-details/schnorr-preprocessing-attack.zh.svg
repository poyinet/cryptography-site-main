<text x="266" y="468" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="9" font-weight="700" fill="#4B3F9E" text-anchor="middle">r8</text>
<rect x="342" y="206" width="250" height="300" rx="18" fill="#FFFFFF" stroke="#2B5F8A" stroke-width="1.2" filter="url(#soft)"/>
<rect x="342" y="206" width="250" height="56" rx="18" fill="#E5F0F7"/>
<text x="362" y="242" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="750" fill="#2B5F8A" text-anchor="start">② 组合</text>
<text x="572" y="242" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#2B5F8A" text-anchor="end">2</text>
<text x="366" y="302" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="15.5" font-weight="700" fill="#1F1D1A" text-anchor="start">线性组合 → (r, x)</text>
<text x="366" y="338" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B655C" text-anchor="start">每次签名后“刷新”这组对。</text>
<rect x="372" y="410" width="190" height="36" rx="12" fill="#E5F0F7"/>
<text x="467.0" y="432.08" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="12" font-weight="700" fill="#2B5F8A" text-anchor="middle">Σ c_i (r_i, x_i)</text>
<line x1="372" y1="466" x2="560" y2="466" stroke="#2B5F8A" stroke-width="2"/>
<path d="M549.0 461.1 L560.0 466.0 L549.0 470.9" fill="none" stroke="#2B5F8A" stroke-width="2"/>
<rect x="620" y="206" width="250" height="300" rx="18" fill="#FFFFFF" stroke="#9A6A00" stroke-width="1.2" filter="url(#soft)"/>
<rect x="620" y="206" width="250" height="56" rx="18" fill="#FFF3CD"/>
<text x="640" y="242" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="750" fill="#9A6A00" text-anchor="start">③ 收集</text>
<text x="850" y="242" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#9A6A00" text-anchor="end">3</text>
<text x="644" y="302" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="15.5" font-weight="700" fill="#1F1D1A" text-anchor="start">约 700 个签名</text>
<text x="644" y="338" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B655C" text-anchor="start">签名之间的依赖暴露线性关系。</text>
<rect x="662" y="398" width="120" height="42" rx="8" fill="#FFFFFF" stroke="#9A6A00" stroke-width="1"/>
<rect x="672" y="407" width="120" height="42" rx="8" fill="#FFFFFF" stroke="#9A6A00" stroke-width="1"/>
<rect x="682" y="416" width="120" height="42" rx="8" fill="#FFFFFF" stroke="#9A6A00" stroke-width="1"/>
<text x="722" y="462" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#9A6A00" text-anchor="middle">≈ 700</text>
<rect x="898" y="206" width="250" height="300" rx="18" fill="#FFFFFF" stroke="#A33A32" stroke-width="1.2" filter="url(#soft)"/>
<rect x="898" y="206" width="250" height="56" rx="18" fill="#FBE7E3"/>
<text x="918" y="242" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="750" fill="#A33A32" text-anchor="start">④ 解出私钥</text>
<text x="1128" y="242" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#A33A32" text-anchor="end">4</text>
<text x="922" y="302" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="15.5" font-weight="700" fill="#1F1D1A" text-anchor="start">约 2^31 步</text>
<text x="922" y="338" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B655C" text-anchor="start">解线性依赖，恢复秘密指数。</text>
<rect x="1012" y="421" width="22" height="18" rx="4" fill="#A33A32"/>
<path d="M1016 421 Q1016 406 1023 406 Q1030 406 1030 421" fill="none" stroke="#A33A32" stroke-width="3"/>
<circle cx="1023" cy="429" r="3" fill="#FFFFFF"/>
<text x="1023" y="472" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="20" font-weight="700" fill="#A33A32" text-anchor="middle">K</text>
<line x1="314" y1="356" x2="340" y2="356" stroke="#DED9CE" stroke-width="2"/>
<path d="M329.0 351.1 L340.0 356.0 L329.0 360.9" fill="none" stroke="#DED9CE" stroke-width="2"/>
