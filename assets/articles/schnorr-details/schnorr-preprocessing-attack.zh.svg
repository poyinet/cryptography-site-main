<line x1="870" y1="356" x2="896" y2="356" stroke="#DED9CE" stroke-width="2"/>
<path d="M885.0 351.1 L896.0 356.0 L885.0 360.9" fill="none" stroke="#DED9CE" stroke-width="2"/>
<rect x="64" y="548" width="1112" height="158" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.1"/>
<text x="94" y="588" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="600" fill="#6B655C" text-anchor="start">论文猜测：k=8 的预处理安全水平 2^72</text>
<text x="94" y="620" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#A33A32" text-anchor="start">de Rooij：约 2^31 步 + 约 700 个签名</text>
<line x1="94" y1="654" x2="1146" y2="654" stroke="#DED9CE" stroke-width="1"/>
<rect x="94" y="668" width="700" height="14" rx="7" fill="#FFF3CD"/>
<rect x="94" y="668" width="260" height="14" rx="7" fill="#A33A32"/>
<text x="810" y="681" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#9A6A00" text-anchor="start">2^72</text>
<text x="362" y="681" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#A33A32" text-anchor="start">2^31</text>
<text x="806" y="648" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" font-weight="500" fill="#8A8378" text-anchor="end">log scale / 对数刻度示意</text>
<text x="620" y="707" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6B655C" text-anchor="middle">同一攻击也适用于使用同一预处理的 Brickell–McCurley、ElGamal、DSS。</text>
<line x1="64" y1="762" x2="1176" y2="762" stroke="#DED9CE" stroke-width="1"/>
<text x="64" y="788" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6B655C" text-anchor="start">The attack is about preprocessing; it does not by itself break a Schnorr signature that avoids this preprocessing.</text>
<text x="1176" y="788" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8A8378" text-anchor="end">de-rooij-1997-abstract.txt:10-19</text>
