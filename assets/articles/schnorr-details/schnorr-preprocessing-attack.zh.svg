<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="title desc">
<title id="title">预处理攻击：从 8 对随机指数到一把私钥</title>
<desc id="desc">de Rooij 的攻击针对 Schnorr 的可选预处理，不是无预处理的核心签名本身。</desc>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1F1D1A" flood-opacity="0.075"/></filter></defs>
<rect width="1240" height="820" fill="#F7F5EF"/>
<text x="64" y="42" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#6B655C" text-anchor="start">SCHNORR / 1991–1997</text>
<text x="64" y="88" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="36" font-weight="750" fill="#1F1D1A" text-anchor="start">预处理攻击：从 8 对随机指数到一把私钥</text>
<text x="64" y="122" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">de Rooij 的攻击针对 Schnorr 的可选预处理，不是无预处理的核心签名本身。</text>
<line x1="64" y1="146" x2="1176" y2="146" stroke="#DED9CE" stroke-width="1.5"/>
<rect x="64" y="206" width="250" height="300" rx="18" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="1.2" filter="url(#soft)"/>
<rect x="64" y="206" width="250" height="56" rx="18" fill="#ECE9FA"/>
<text x="84" y="242" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="750" fill="#4B3F9E" text-anchor="start">① 预计算</text>
<text x="294" y="242" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#4B3F9E" text-anchor="end">1</text>
<text x="88" y="302" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="15.5" font-weight="700" fill="#1F1D1A" text-anchor="start">k 对 (r_i, x_i)</text>
<text x="88" y="338" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B655C" text-anchor="start">k = 8；存储线性于 k。</text>
