<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="肖国镇与流密码组合理论">
<rect width="1240" height="820" fill="#f6f3ea"/>
<rect x="28" y="24" width="1184" height="784" rx="18" fill="#fffdf7" stroke="#d8d2c4" stroke-width="1.5"/>
<text x="80" y="74" font-size="28" font-weight="700" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">肖国镇与流密码组合理论</text>
<text x="82" y="104" font-size="14" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6c7486">流密码、哈希与认证码 · 公式级机制卡</text>
<rect x="80" y="120" width="1080" height="1" fill="#ded8c8"/>
<text x="82" y="144" font-size="12" letter-spacing="1.2" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">公式级 · 可复述、可核源、可对照</text>
<rect x="80" y="170" width="250" height="150" rx="10" fill="#fffaf0" stroke="#c8a24b" stroke-width="1.2"/>
<circle cx="106" cy="196" r="14" fill="#c8a24b"/>
<text x="106" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">1</text>
<text x="128" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 1</text>
<text x="104" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">n 条 LFSR 输出</text>
<text x="104" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">定义 / 输入</text>
<rect x="350" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="376" cy="196" r="14" fill="#14213d"/>
<text x="376" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">2</text>
<text x="398" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 2</text>
<text x="374" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">布尔组合函数 f</text>
<text x="374" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">变换 / 方程</text>
<rect x="620" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="646" cy="196" r="14" fill="#14213d"/>
<text x="646" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">3</text>
<text x="668" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 3</text>
<text x="644" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">计算 Walsh 谱</text>
<text x="644" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">观测 / 解码</text>
<rect x="890" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="916" cy="196" r="14" fill="#14213d"/>
<text x="916" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">4</text>
<text x="938" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 4</text>
<text x="914" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">检查零谱带</text>
<text x="914" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">边界 / 结果</text>
<rect x="80" y="350" width="1080" height="200" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<text x="102" y="382" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">核心公式与量级</text>
<text x="112" y="424" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">x = (x1,...,xn), ω = (ω1,...,ωn)</text>
<text x="112" y="442" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">F(ω) = Σ_x f(x)(−1)^(x·ω)</text>
<text x="112" y="460" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">f m-th order CI ⇔ F(ω)=0</text>
<text x="112" y="478" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">for 1 ≤ wt(ω) ≤ m</text>
<text x="112" y="496" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">balanced ⇔ F(0) = 2^(n−1)</text>
<text x="112" y="514" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">f(x) = 2^(−n) Σ_ω F(ω)(−1)^(x·ω)</text>
<text x="112" y="532" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">balanced m-th order CI ⇒ deg f ≤ n−m−1</text>
<rect x="80" y="570" width="1080" height="190" rx="10" fill="#fbfaf4" stroke="#ded8c8" stroke-width="1.2"/>
<text x="102" y="590" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">细节 / 参数 / 边界</text>
<text x="112" y="614" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">相关免疫不是“输出完全不含输入信息”，而是输出与任意不超过 m 条输入统计独立。Walsh 谱把所有 2^n</text>
<text x="112" y="632" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">个输入取值上的相关一次性展开；零带越宽，能利用的相关越少，但平衡与代数次数会限制可达到的参数。</text>
<text x="112" y="688" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">输入：n 条独立平衡二元随机变量；组合函数 f 为无记忆布尔函数；m 为相关免疫阶，1≤m≤n。</text>
<text x="112" y="706" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">判据：F(ω)=0 对 1≤wt(ω)≤m；平衡 F(0)=2^{n−1}；平衡 m 阶相关免疫次数上界 deg f≤n−m−1。</text>
<text x="112" y="724" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">边界：只覆盖无记忆布尔组合器；不保证高阶相关、代数、立方、侧信道或带记忆结构的安全。</text>
<text x="80" y="774" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">原创公式级机制图（据肖—Massey 1988 论文与西电讣告绘制）</text>
<text x="80" y="790" font-size="11.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6f7788">读法：先核对输入独立平衡、组合函数与阶数 m，再检查 Walsh 谱零带；图不替代 1988 年论文证明。</text>
<text x="1160" y="806" text-anchor="end" font-size="10" font-family="ui-monospace, Consolas, monospace" fill="#a39c8a">R126 · 2026-11-23 · cn-xiaogong-details</text>
</svg>