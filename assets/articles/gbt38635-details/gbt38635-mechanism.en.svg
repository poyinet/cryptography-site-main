<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="SM9 Identity-Based Cryptographic Algorithm mechanism"><rect width="1240" height="820" fill="#fbf8f1"/><text x="42" y="58" font-family="Georgia,Noto Serif SC,serif" font-size="32" font-weight="700" fill="#2d2a24">SM9 Identity-Based Cryptographic Algorithm</text><text x="42" y="90" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#7a6f5f">Formula-level mechanism: steps, parameters, use and failure boundary</text><rect x="42" y="126" width="256" height="120" rx="16" fill="#f6e7d7" stroke="#cfc4b4"/><text x="60" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 1</text><text x="60" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">master key and</text><text x="60" y="208" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">parameters</text><path d="M306 186 L332 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="342" y="126" width="256" height="120" rx="16" fill="#e4efe6" stroke="#cfc4b4"/><text x="360" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 2</text><text x="360" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">identity private</text><text x="360" y="208" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">key</text><path d="M606 186 L632 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="642" y="126" width="256" height="120" rx="16" fill="#e6e9f5" stroke="#cfc4b4"/><text x="660" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 3</text><text x="660" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">signature or</text><text x="660" y="208" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">encapsulation</text><path d="M906 186 L932 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="942" y="126" width="256" height="120" rx="16" fill="#f3e3ea" stroke="#cfc4b4"/><text x="960" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 4</text><text x="960" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">pairing</text><text x="960" y="208" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">verification</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a89a86"/></marker></defs><rect x="42" y="272" width="1156" height="204" rx="14" fill="#fffdf8" stroke="#d8cfc2"/><text x="62" y="300" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">CORE FORMULAS</text><text x="62" y="328" font-family="ui-monospace,SFMono-Regular,monospace" font-size="15" fill="#2d2a24">P_{pub}=ks·P_2</text><text x="62" y="355" font-family="ui-monospace,SFMono-Regular,monospace" font-size="15" fill="#2d2a24">d_{ID}=ks·(H_1(ID‖hid,N)+ks)^{-1} mod N·P_1</text><text x="62" y="382" font-family="ui-monospace,SFMono-Regular,monospace" font-size="15" fill="#2d2a24">S=l·d_{ID}, l=(r−h) mod N</text><text x="62" y="409" font-family="ui-monospace,SFMono-Regular,monospace" font-size="15" fill="#2d2a24">h=H_2(M‖w,N), w=e(P_1,P_{pub})^r</text><text x="62" y="440" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">Verification computes u=e(S,H1(ID‖hid,N)P2+Ppub) and w=u·g^h, then checks H2(M‖w,N)=h. Encryption/KEM uses</text><text x="62" y="462" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">Q=H1(ID‖hid,N)P1+Ppub.</text><rect x="42" y="496" width="1156" height="190" rx="14" fill="#f8f4eb" stroke="#d8cfc2"/><text x="62" y="524" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">PARAMETERS AND BOUNDARY</text><text x="62" y="548" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">Pairing e:G1×G2→GT; master secret ks and system public key Ppub=ksP2; user keys are derived by the KGC.</text><text x="62" y="592" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">Signature (h,S); encryption/KEM ciphertext includes C1 and a derived key; curve and pairing parameters follow the</text><text x="62" y="611" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">standard.</text><text x="62" y="636" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">Boundary: key escrow, trusted KGC, pairing side channels and identity privacy; not quantum-resistant.</text><text x="42" y="714" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#4a433a">Read the formulas and round counts first, then check modes and failure conditions; the diagram does not replace clause text or test vectors.</text><text x="42" y="786" font-family="Inter,Noto Sans SC,sans-serif" font-size="12" fill="#8b7d6b">Original formula-level mechanism diagram · CC BY 4.0 · poyi knowledge · 2026-11-23</text></svg>