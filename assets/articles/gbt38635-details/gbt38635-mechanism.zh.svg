<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="SM9 标识密码算法 mechanism"><rect width="1240" height="820" fill="#fbf8f1"/><text x="42" y="58" font-family="Georgia,Noto Serif SC,serif" font-size="32" font-weight="700" fill="#2d2a24">SM9 标识密码算法</text><text x="42" y="90" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#7a6f5f">公式级机制：步骤、参数、适用与失效边界</text><rect x="42" y="126" width="256" height="120" rx="16" fill="#f6e7d7" stroke="#cfc4b4"/><text x="60" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 1</text><text x="60" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">主密钥与系统参数</text><path d="M306 186 L332 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="342" y="126" width="256" height="120" rx="16" fill="#e4efe6" stroke="#cfc4b4"/><text x="360" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 2</text><text x="360" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">用户标识私钥</text><path d="M606 186 L632 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="642" y="126" width="256" height="120" rx="16" fill="#e6e9f5" stroke="#cfc4b4"/><text x="660" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 3</text><text x="660" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">签名或封装</text><path d="M906 186 L932 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="942" y="126" width="256" height="120" rx="16" fill="#f3e3ea" stroke="#cfc4b4"/><text x="960" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 4</text><text x="960" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">配对验证</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a89a86"/></marker></defs><rect x="42" y="272" width="1156" height="204" rx="14" fill="#fffdf8" stroke="#d8cfc2"/><text x="62" y="300" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">核心公式</text><text x="62" y="328" font-family="ui-monospace,SFMono-Regular,monospace" font-size="15" fill="#2d2a24">P_{pub}=ks·P_2</text><text x="62" y="355" font-family="ui-monospace,SFMono-Regular,monospace" font-size="15" fill="#2d2a24">d_{ID}=ks·(H_1(ID‖hid,N)+ks)^{-1} mod N·P_1</text><text x="62" y="382" font-family="ui-monospace,SFMono-Regular,monospace" font-size="15" fill="#2d2a24">S=l·d_{ID}, l=(r−h) mod N</text><text x="62" y="409" font-family="ui-monospace,SFMono-Regular,monospace" font-size="15" fill="#2d2a24">h=H_2(M‖w,N), w=e(P_1,P_{pub})^r</text><text x="62" y="440" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">签名验证计算 u=e(S,H1(ID‖hid,N)P2+Ppub)，再取 w=u·g^h；检查 H2(M‖w,N)=h。加密/KEM 使用 Q=H1(ID‖hid,</text><text x="62" y="462" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">N)P1+Ppub。</text><rect x="42" y="496" width="1156" height="190" rx="14" fill="#f8f4eb" stroke="#d8cfc2"/><text x="62" y="524" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">参数与边界</text><text x="62" y="548" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">配对 e:G1×G2→GT；主私钥 ks，系统公钥 Ppub=ksP2；用户私钥由 KGC 派生。</text><text x="62" y="592" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">签名 (h,S)，加密/KEM 密文含 C1 与派生密钥；曲线与配对参数按标准。</text><text x="62" y="636" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">边界：主密钥托管、KGC 可信、配对实现侧信道、标识隐私；不抗量子。</text><text x="42" y="714" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#4a433a">读法：先核对公式中的参数与轮数，再检查实现模式和失效条件；图不替代标准条文或测试向量。</text><text x="42" y="786" font-family="Inter,Noto Sans SC,sans-serif" font-size="12" fill="#8b7d6b">原创公式级机制图 · CC BY 4.0 · poyi knowledge · 2026-11-23</text></svg>