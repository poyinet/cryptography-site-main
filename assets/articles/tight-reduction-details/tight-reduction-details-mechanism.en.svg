<text x="322.5" y="300" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">G1</text>
<text x="322.5" y="317" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">replace one</text>
<line x1="395" y1="325" x2="419" y2="325" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<text x="401" y="307" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="700" fill="#8A6100" text-anchor="middle">Δ2</text>
<rect x="425" y="280" width="145" height="90" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
