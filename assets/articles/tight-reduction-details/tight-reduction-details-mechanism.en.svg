<text x="60" y="52" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#6B655C" text-anchor="left">FOUNDATIONS · PROVABLE SECURITY</text>
<text x="60" y="104" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="37" font-weight="800" fill="#1F1D1A" text-anchor="left">Tight Reduction</text>
<text x="60" y="143" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#6B655C" text-anchor="left">Adv_real(A) ≤ ℓ(k) · Adv_assump(B) + ε_sim</text>
<rect x="50" y="185" width="760" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="78" y="224" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="800" fill="#1F1D1A" text-anchor="left">The loss factor decides how many extra bits parameters need</text>
