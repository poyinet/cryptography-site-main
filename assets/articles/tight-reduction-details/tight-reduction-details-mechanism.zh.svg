<text x="94" y="446" font-family="'Consolas','SFMono-Regular',monospace" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="left">Adv_real(A) ≤ ℓ(k) · Adv_assump(B) + Σ Δi</text>
<rect x="80" y="495" width="660" height="82" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="410" y="515" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">归约 R：A 的攻击 → B 解假设</text>
<text x="410" y="532" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">损失因子 ℓ(k) 把一次方案优势折成假设优势</text>
<text x="80" y="602" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="600" fill="#6B655C" text-anchor="left">ℓ = 1 或常数：紧致；ℓ = q_s、用户数：非紧致。</text>
</g>
<rect x="830" y="185" width="360" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<rect x="835" y="205" width="350" height="132" rx="12" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.2"/>
