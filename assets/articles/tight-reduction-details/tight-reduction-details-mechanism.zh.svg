<text x="322.5" y="317" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">替换一个组件</text>
<line x1="395" y1="325" x2="419" y2="325" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
