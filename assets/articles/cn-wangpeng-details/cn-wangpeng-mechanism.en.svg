oto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#2d2a24">boundary</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a89a86"/></marker></defs><rect x="42" y="342" width="1156" height="150" rx="14" fill="#fffdf8" stroke="#d8cfc2"/><text x="62" y="374" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#8a5a3b">MECHANISM TEST / FORMULA POSITION</text><text x="62" y="408" font-family="ui-monospace,SFMono-Regular,monospace" font-size="20" fill="#2d2a24">definition → input → operation → boundary</text><text x="42" y="540" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#8a5a3b">READING</text><text x="42" y="572" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" fill="#4a433a">Read the four steps as input, transform, output and failure condition; the diagram does not replace a standard clause or parameter recomputation.</text><text x="42" y="638" font-family="Inter,Noto Sans SC,sans-serif" font-size="12" fill="#8b7d6b">Original mechanism diagram · CC BY 4.0 · poyi knowledge · 2026-11-22</text></svg>