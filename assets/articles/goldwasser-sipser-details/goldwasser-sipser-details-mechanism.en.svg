<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Goldwasser–Sipser Ladder</title>
<desc id="fig-desc">Do not count the set; prove that a random hit is hard to fake — mechanism schematic with parameters, use and limits.</desc>
<defs>
<marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4B3F9E"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1F7A6A"/></marker>
<marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8A6100"/></marker>
<marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9B2C2C"/></marker>
<marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B655C"/></marker>
<clipPath id="mainClip"><rect x="50" y="185" width="760" height="450" rx="16"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="820" fill="#F7F5EF"/>
<text x="60" y="52" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#6B655C" text-anchor="left">INTERACTIVE PROOFS · SET LOWER BOUND</text>
<text x="60" y="104" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="37" font-weight="800" fill="#1F1D1A" text-anchor="left">Goldwasser–Sipser Ladder</text>
<text x="60" y="143" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#6B655C" text-anchor="left">random hashing · hit proof · approximate lower bound</text>
<rect x="50" y="185" width="760" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="78" y="224" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="800" fill="#1F1D1A" text-anchor="left">Do not count the set; prove that a random hit is hard to fake</text>
<g clip-path="url(#mainClip)">
<text x="80" y="255" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F1D1A" text-anchor="left">Use a random hash to turn set size into one hit proof</text>
<rect x="80" y="285" width="160" height="88" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="160" y="305" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">S ⊆ {0,1}^m</text>
<text x="160" y="322" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">set</text>
<line x1="242" y1="329" x2="285" y2="329" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<rect x="285" y="285" width="160" height="88" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="365" y="305" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">random hash h</text>
<text x="365" y="322" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">S → {1,…,K/4}</text>
<line x1="447" y1="329" x2="490" y2="329" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<rect x="490" y="285" width="150" height="88" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="565" y="305" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6100" text-anchor="middle">target y</text>
<text x="565" y="322" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">y ∈ {1,…,K/4}</text>
<line x1="642" y1="329" x2="685" y2="329" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<rect x="685" y="285" width="110" height="88" rx="10" fill="#FBE9E9" stroke="#9B2C2C" stroke-width="1.6"/>
<text x="740" y="305" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#9B2C2C" text-anchor="middle">witness x</text>
<text x="740" y="322" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">h(x)=y</text>
<rect x="80" y="405" width="710" height="40" rx="8" fill="#ECE9FA" stroke="#1F7A6A" stroke-width="1"/>
<text x="94" y="431" font-family="'Consolas','SFMono-Regular',monospace" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="left">YES: |S| ≥ K  ⇒  Pr[hit] = 1 - (1 - 4/K)^K ≥ 2/3</text>
<rect x="80" y="460" width="710" height="40" rx="8" fill="#ECE9FA" stroke="#9B2C2C" stroke-width="1"/>
<text x="94" y="486" font-family="'Consolas','SFMono-Regular',monospace" font-size="13" font-weight="700" fill="#9B2C2C" text-anchor="left">NO: |S| ≤ K/16  ⇒  Pr[any prover hits] ≤ 1/4</text>
<text x="80" y="525" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="600" fill="#1F1D1A" text-anchor="left">Promise gap: between K/16 and K the protocol does not guarantee a decision.</text>
<text x="80" y="555" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="600" fill="#8A6100" text-anchor="left">The hash family must be pairwise-independent; membership must be efficiently verifiable.</text>
<text x="80" y="585" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">This is an interactive proof, not encryption; it reveals neither S nor the exact |S|.</text>
</g>
<rect x="830" y="185" width="360" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<rect x="835" y="205" width="350" height="132" rx="12" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.2"/>
<text x="851" y="229" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#4B3F9E" text-anchor="left">PROMISE</text>
<circle cx="854" cy="252" r="2.5" fill="#4B3F9E"/>
<text x="864" y="256" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">|S| ≥ K</text>
<circle cx="854" cy="280" r="2.5" fill="#4B3F9E"/>
<text x="864" y="284" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">or |S| ≤ K/16</text>
<rect x="835" y="345" width="350" height="132" rx="12" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.2"/>
<text x="851" y="369" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#1F7A6A" text-anchor="left">VERIFIER</text>
<circle cx="854" cy="392" r="2.5" fill="#1F7A6A"/>
<text x="864" y="396" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">pick h and y</text>
<circle cx="854" cy="420" r="2.5" fill="#1F7A6A"/>
<text x="864" y="424" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">h: S → {1,…,K/4}</text>
<rect x="835" y="485" width="350" height="132" rx="12" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.2"/>
<text x="851" y="509" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#8A6100" text-anchor="left">PROVER</text>
<circle cx="854" cy="532" r="2.5" fill="#8A6100"/>
<text x="864" y="536" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">find x∈S with h(x)=y</text>
<circle cx="854" cy="560" r="2.5" fill="#8A6100"/>
<text x="864" y="564" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">plus a membership certificate</text>
<rect x="50" y="660" width="1140" height="105" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="74" y="690" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="800" fill="#4B3F9E" text-anchor="left">How to read this figure</text>
<text x="74" y="716" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">Reading: the protocol does not count |S|. It asks the prover to find a hit under a random hash. A large set hits</text>
<text x="74" y="739" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">with high probability; a small set is spread thinly, so no prover can make a random y land in its image.</text>
<line x1="60" y1="782" x2="1180" y2="782" stroke="#DED9CE" stroke-width="1.2"/>
<text x="60" y="804" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">Original mechanism diagram · CC BY 4.0 · poyi knowledge · 2026-11-22 · statements and bounds drawn from the cited papers</text>
</svg>
