<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Franklin-Reiter Related-Message Attack</title>
<desc id="fig-desc">A known relation turns two ciphertexts into one low-degree equation — mechanism schematic with parameters, use and limits.</desc>
<defs>
<marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4B3F9E"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1F7A6A"/></marker>
<marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8A6100"/></marker>
<marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9B2C2C"/></marker>
<marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B655C"/></marker>
<clipPath id="mainClip"><rect x="50" y="185" width="760" height="450" rx="16"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="820" fill="#F7F5EF"/>
<text x="60" y="52" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#6B655C" text-anchor="left">PUBLIC-KEY ATTACKS · RELATED MESSAGES</text>
<text x="60" y="104" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="37" font-weight="800" fill="#1F1D1A" text-anchor="left">Franklin-Reiter Related-Message Attack</text>
<text x="60" y="143" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#6B655C" text-anchor="left">same modulus · low exponent · known affine relation</text>
<rect x="50" y="185" width="760" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="78" y="224" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="800" fill="#1F1D1A" text-anchor="left">A known relation turns two ciphertexts into one low-degree equation</text>
<g clip-path="url(#mainClip)">
<text x="80" y="255" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F1D1A" text-anchor="left">Two ciphertexts under one modulus with a known affine relation</text>
<rect x="80" y="285" width="185" height="82" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="172.5" y="305" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">c1 = m1^e mod N</text>
<text x="172.5" y="322" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">message m1</text>
<rect x="315" y="285" width="185" height="82" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="407.5" y="305" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">c2 = m2^e mod N</text>
<text x="407.5" y="322" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">m2 = α m1 + β</text>
<line x1="265" y1="326" x2="313" y2="326" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<rect x="555" y="285" width="180" height="82" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="645" y="305" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6100" text-anchor="middle">gcd(f1, f2)</text>
<text x="645" y="322" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">Z/NZ[z]</text>
<line x1="500" y1="326" x2="553" y2="326" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<rect x="80" y="390" width="690" height="40" rx="8" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1"/>
<text x="94" y="416" font-family="'Consolas','SFMono-Regular',monospace" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="left">f1(z)=z^e-c1    f2(z)=(αz+β)^e-c2</text>
<rect x="80" y="445" width="690" height="40" rx="8" fill="#ECE9FA" stroke="#8A6100" stroke-width="1"/>
<text x="94" y="471" font-family="'Consolas','SFMono-Regular',monospace" font-size="13" font-weight="700" fill="#8A6100" text-anchor="left">gcd(f1,f2) = z - m1   (linear factor)</text>
<text x="80" y="515" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="600" fill="#1F1D1A" text-anchor="left">Once m1 is recovered, m2 = α m1 + β gives the second message.</text>
<text x="80" y="545" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="600" fill="#9B2C2C" text-anchor="left">Exceptions: non-invertible leading coefficient; e too large; relation unknown.</text>
<text x="80" y="575" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">Randomised padding makes the relation non-fixed and the gcd route fails.</text>
</g>
<rect x="830" y="185" width="360" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<rect x="835" y="205" width="350" height="132" rx="12" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.2"/>
<text x="851" y="229" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#4B3F9E" text-anchor="left">STRUCTURE</text>
<circle cx="854" cy="252" r="2.5" fill="#4B3F9E"/>
<text x="864" y="256" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">same modulus (N,e)</text>
<circle cx="854" cy="280" r="2.5" fill="#4B3F9E"/>
<text x="864" y="284" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">known m2 = α m1 + β</text>
<rect x="835" y="345" width="350" height="132" rx="12" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.2"/>
<text x="851" y="369" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#1F7A6A" text-anchor="left">OPERATION</text>
<circle cx="854" cy="392" r="2.5" fill="#1F7A6A"/>
<text x="864" y="396" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">gcd over Z/NZ[z]</text>
<circle cx="854" cy="420" r="2.5" fill="#1F7A6A"/>
<text x="864" y="424" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">linear factor z - m1</text>
<rect x="835" y="485" width="350" height="132" rx="12" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.2"/>
<text x="851" y="509" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#8A6100" text-anchor="left">LIMITS</text>
<circle cx="854" cy="532" r="2.5" fill="#8A6100"/>
<text x="864" y="536" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">large e slows the gcd</text>
<circle cx="854" cy="560" r="2.5" fill="#8A6100"/>
<text x="864" y="564" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">random padding breaks relation</text>
<rect x="50" y="660" width="1140" height="105" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="74" y="690" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="800" fill="#4B3F9E" text-anchor="left">How to read this figure</text>
<text x="74" y="716" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">Reading: first check whether both ciphertexts use the same modulus, then whether the relation is known and</text>
<text x="74" y="739" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">low-degree. If both hold, the gcd yields a linear factor. Random padding or an unknown relation kills the route</text>
<text x="74" y="762" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">immediately.</text>
<line x1="60" y1="782" x2="1180" y2="782" stroke="#DED9CE" stroke-width="1.2"/>
<text x="60" y="804" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">Original mechanism diagram · CC BY 4.0 · poyi knowledge · 2026-11-22 · statements and bounds drawn from the cited papers</text>
</svg>
