<text x="646" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">3</text>
<text x="668" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 3</text>
<text x="644" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">重点监管</text>
<text x="644" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">观测 / 解码</text>
<rect x="890" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="916" cy="196" r="14" fill="#14213d"/>
<text x="916" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">4</text>
<text x="938" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 4</text>
<text x="914" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">法律责任</text>
<text x="914" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">边界 / 结果</text>
<rect x="80" y="350" width="1080" height="200" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<text x="102" y="382" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">核心公式与量级</text>
<text x="112" y="412" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Reg_2023 = (Chapters=9, Articles=67)</text>
<text x="112" y="429" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Removed = {生产审批, 销售许可, 型号审批}，|Removed| = 3</text>
<text x="112" y="446" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">KeyScope = {国家安全, 国计民生, 公共利益, KII}</text>
<text x="112" y="463" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Cert(x) = 1 若 x ∈ 强制检测认证目录</text>
<text x="112" y="480" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Obligation(x) = Cert(x) ∨ Assess(x) ∨ TradeLicense(x)</text>
<text x="112" y="497" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Penalty_untested = [10万, 30万] 元 或 [1,3]×违法所得</text>
<text x="112" y="514" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Penalty_KII = [10万, 100万] 元；Person = [1万, 10万] 元</text>
<text x="112" y="531" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Δt = 2023-07-01 − 1999-10-07 ≈ 23.7 年</text>
<rect x="80" y="570" width="1080" height="190" rx="10" fill="#fbfaf4" stroke="#ded8c8" stroke-width="1.2"/>
<text x="102" y="590" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">细节 / 参数 / 边界</text>
<text x="112" y="614" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">2023-04-14 国务院第 4 次常务会议修订通过；04-27 国务院令第 760 号公布；07-01 施行；九章六十七条。</text>
<text x="112" y="632" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">取消生产单位审批、销售单位许可、品种型号审批三项事前许可；改为检测认证 + 关键环节监管。</text>
<text x="112" y="650" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">第 12 条鼓励自愿检测认证；第 17 条建立国家统一推行的认证制度；第 38 条 KII 每年至少一次密评。</text>
<text x="112" y="668" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">第 50 条对未经认定检测/认证设定 10 万–30 万或 1–3 倍违法所得罚款；条例不替代密码法。</text>
<text x="112" y="688" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">Reg_2023 = 2023 年修订条例的结构参数；Removed = 取消的三项事前许可</text>
<text x="112" y="706" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">Cert(x) = 是否属于强制检测认证范围；Assess(x) = 是否须开展密评</text>
<text x="112" y="724" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">TradeLicense(x) = 进出口许可/管制清单义务</text>
<text x="80" y="774" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">poyi knowledge · 原创 SVG 示意图 · CC BY 4.0</text>
<text x="80" y="790" font-size="11.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6f7788">来源：中国政府网 760 号令、国务院公报、司法部答记者问。</text>
<text x="80" y="806" font-size="11.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6f7788">边界：条例细化法律，不替代密码法。</text>
