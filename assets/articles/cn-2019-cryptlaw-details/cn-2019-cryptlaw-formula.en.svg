<text x="102" y="382" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">Core formulas and scales</text>
<text x="112" y="412" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">C = {core, common, commercial}, |C| = 3</text>
<text x="112" y="429" font-size="14" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Class(x) ∈ C; Scope(commercial) = non-state-secret information</text>
<text x="112" y="446" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Chapters = 5, Articles = 44</text>
<text x="112" y="463" font-size="14" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">F(law) = 3 &gt; F(regulation) = 2 &gt; F(department rule) = 1</text>
<text x="112" y="480" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Compliant_KII(x) = UseCrypto(x) ∧ Assess(x)</text>
<text x="112" y="497" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Penalty_KII = [100k, 1m] CNY; Person = [10k, 100k] CNY</text>
<text x="112" y="514" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Δt = 2020-01-01 − 2019-10-26 = 67 d</text>
<text x="112" y="531" font-size="14" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">CommercialDefault = voluntary testing/certification + classification</text>
<rect x="80" y="570" width="1080" height="190" rx="10" fill="#fbfaf4" stroke="#ded8c8" stroke-width="1.2"/>
<text x="102" y="590" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">Detail / parameters / boundary</text>
<text x="112" y="614" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">Passed 26 October 2019; Chair Order No. 35; effective 1 January 2020, 67 days later.</text>
<text x="112" y="632" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">Article 6 creates three classes; Article 8 assigns commercial cryptography to non-state-secret information.</text>
<text x="112" y="650" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">Article 27 requires KII operators to use commercial cryptography and conduct assessment.</text>
<text x="112" y="668" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">Article 37 sets fines of 100k–1m CNY and 10k–100k CNY for the responsible person.</text>
<text x="112" y="688" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">C = core, common and commercial classes; Class(x) = class of a system</text>
<text x="112" y="706" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">F = legal force; KII = critical information infrastructure</text>
<text x="112" y="724" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">Penalty_KII = statutory fine ranges in Article 37 for the operator and responsible person</text>
<text x="80" y="774" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">poyi knowledge · original SVG schematic · CC BY 4.0</text>
<text x="80" y="790" font-size="11.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6f7788">Sources: National Cryptography Administration law text, gov.cn Chair Order and the Administration interpretation.</text>
<text x="80" y="806" font-size="11.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6f7788">Boundary: articles do not equal compliance; regulations and assessment measures supply the process.</text>
