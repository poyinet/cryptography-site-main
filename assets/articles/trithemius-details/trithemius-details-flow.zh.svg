<text x="864" y="420" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">段注记接着记 1553 年 Belaso「</text>
<text x="864" y="451" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">suggested using an easily</text>
<text x="864" y="482" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">changed key (and</text>
<text x="864" y="513" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">key-phrases as mem。</text>
<rect x="60" y="650" width="1120" height="95" rx="18" fill="#ECE9FA"/>
<text x="84" y="685" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="800" fill="#4B3F9E">怎么用这张图</text>
<text x="84" y="718" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">先读第一栏确认它解决的问题，再看中间一栏的机制，最后用第三栏的失效条件检验任何“绝对安全”的说法。</text>
