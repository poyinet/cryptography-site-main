<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">密钥扩展：从主密钥到轮密钥</title>
<desc id="fig-desc">术语 · 为什么—怎么做—哪里失效</desc>
<rect x="0" y="0" width="1240" height="820" fill="#F7F5EF"/>
<text x="60" y="54" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#6B655C">术语</text>
<text x="60" y="108" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="38" font-weight="800" fill="#1F1D1A">密钥扩展：从主密钥到轮密钥</text>
<text x="60" y="150" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#6B655C">从正文提炼的一条解释线：先看问题，再看机制，最后看失效条件。</text>
<rect x="50" y="205" width="350" height="405" rx="22" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="2"/>
<rect x="72" y="227" width="42" height="42" rx="13" fill="#ECE9FA"/><text x="93" y="257" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="800" fill="#4B3F9E" text-anchor="middle">1</text>
<text x="74" y="310" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="800" fill="#4B3F9E">定义</text>
<text x="74" y="358" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">轮密钥的作用是让每一轮使用不同</text>
<text x="74" y="389" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">的密钥材料。如果每一轮都用同一</text>
<text x="74" y="420" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">个子密钥，轮函数的对称性会更强，</text>
<text x="74" y="451" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">攻击者可以利用重复结构；密钥扩</text>
<text x="74" y="482" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">展通过引入轮常数、非线性代换或</text>
<text x="74" y="513" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">移位，打破这种重复。密钥扩展也</text>
<text x="74" y="544" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">是安全边界的一部分。</text>
<line x1="410" y1="400" x2="475" y2="400" stroke="#4B3F9E" stroke-width="3"/><path d="M465 393 L475 400 L465 407" fill="none" stroke="#4B3F9E" stroke-width="3"/>
<rect x="445" y="205" width="350" height="405" rx="22" fill="#FFFFFF" stroke="#1F7A6A" stroke-width="2"/>
<rect x="467" y="227" width="42" height="42" rx="13" fill="#E2F3EE"/><text x="488" y="257" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="800" fill="#1F7A6A" text-anchor="middle">2</text>
<text x="469" y="310" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="800" fill="#1F7A6A">机制</text>
<text x="469" y="358" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">密钥扩展（key schedule）是分</text>
<text x="469" y="389" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">组密码内部的一个确定性过程：它</text>
<text x="469" y="420" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">把用户提供的主密钥转换成每一轮</text>
<text x="469" y="451" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">使用的轮密钥。轮密钥的长度通常</text>
<text x="469" y="482" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">等于分组长度或分组的一部分；轮</text>
<text x="469" y="513" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">数越多，需要的轮密钥材料越多。</text>
<line x1="805" y1="400" x2="870" y2="400" stroke="#1F7A6A" stroke-width="3"/><path d="M860 393 L870 400 L860 407" fill="none" stroke="#1F7A6A" stroke-width="3"/>
<rect x="840" y="205" width="350" height="405" rx="22" fill="#FFFFFF" stroke="#8A6100" stroke-width="2"/>
<rect x="862" y="227" width="42" height="42" rx="13" fill="#FFF3CD"/><text x="883" y="257" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="800" fill="#8A6100" text-anchor="middle">3</text>
<text x="864" y="310" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="800" fill="#8A6100">误用</text>
<text x="864" y="358" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">DES 的弱密钥会让所有子密钥相</text>
<text x="864" y="389" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">同，半弱密钥会让一对密钥互为逆</text>
<text x="864" y="420" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">运算；DES 共有四把弱密钥和六</text>
<text x="864" y="451" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">对半弱密钥。这些是密钥扩展结构</text>
<text x="864" y="482" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">的性质，不是实现错误。相关密钥</text>
<text x="864" y="513" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">攻击则利用两个相关主密钥产生的</text>
<text x="864" y="544" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">轮密钥之间的关系。</text>
<rect x="60" y="650" width="1120" height="95" rx="18" fill="#ECE9FA"/>
<text x="84" y="685" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="800" fill="#4B3F9E">怎么用这张图</text>
<text x="84" y="718" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">先读第一栏确认它解决的问题，再看中间一栏的机制，最后用第三栏的失效条件检验任何“绝对安全”的说法。</text>
<line x1="60" y1="774" x2="1180" y2="774" stroke="#DED9CE" stroke-width="1.5"/><text x="60" y="800" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" fill="#6B655C">原创示意图 · CC BY 4.0 · poyi knowledge · 2026-11-21 · 文字摘自本篇正文</text>
</svg>
