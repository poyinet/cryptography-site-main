<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Cocks in the non-secret encryption chain</title>
  <desc id="desc">Five dated nodes: 1970 theorem, 1973 Cocks method, 1976 Diffie–Hellman, 1977/78 RSA, 1997 narrative; internal records are separated from public literature.</desc>
  <rect width="1400" height="760" fill="#F7F5EF"/>
<text x="80" y="72" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="34" font-weight="700" fill="#1F1D1A" text-anchor="start">Where Cocks sits in the non-secret encryption chain</text>
<text x="80" y="108" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#6B655C" text-anchor="start">Separates the 1970 theorem, the 1973 method, the public 1976/1977–78 literature and the 1997 disclosure of the story.</text><rect x="50" y="245" width="240" height="235" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="50" y="245" width="240" height="56" rx="18" fill="#ECE8FF" stroke="none" stroke-width="1.5"/><text x="170" y="281" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#6D5BD0" text-anchor="middle">1970</text><text x="170" y="341" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="middle">Ellis existence theorem</text><text x="170" y="379" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">NSE proved possible in theory</text><text x="170" y="405" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">CESG internal report</text><g stroke="#6D5BD0" stroke-width="3" fill="none"><line x1="291" y1="365" x2="297" y2="365" stroke="#6D5BD0" stroke-width="3"/><path d="M295 355 L309 365 L295 375"/></g><rect x="310" y="245" width="240" height="235" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="310" y="245" width="240" height="56" rx="18" fill="#E3F4EE" stroke="none" stroke-width="1.5"/><text x="430" y="281" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#2E7D6B" text-anchor="middle">1973-11-20</text><text x="430" y="341" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="middle">Cocks method</text><text x="430" y="379" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">first workable idea</text><text x="430" y="405" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">CESG internal report</text><g stroke="#2E7D6B" stroke-width="3" fill="none"><line x1="551" y1="365" x2="557" y2="365" stroke="#2E7D6B" stroke-width="3"/><path d="M555 355 L569 365 L555 375"/></g><rect x="570" y="245" width="240" height="235" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="570" y="245" width="240" height="56" rx="18" fill="#E3F4EE" stroke="none" stroke-width="1.5"/><text x="690" y="281" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#2E7D6B" text-anchor="middle">1976-04</text><text x="690" y="341" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="middle">Diffie–Hellman</text><text x="690" y="379" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">public key idea in open literature</text><text x="690" y="405" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">public</text><g stroke="#2E7D6B" stroke-width="3" fill="none"><line x1="811" y1="365" x2="817" y2="365" stroke="#2E7D6B" stroke-width="3"/><path d="M815 355 L829 365 L815 375"/></g><rect x="830" y="245" width="240" height="235" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="830" y="245" width="240" height="56" rx="18" fill="#FFF4CF" stroke="none" stroke-width="1.5"/><text x="950" y="281" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#8A6A00" text-anchor="middle">1977 / 1978-02</text><text x="950" y="341" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="middle">RSA</text><text x="950" y="379" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">MIT technical memo</text><text x="950" y="405" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">then CACM, Feb 1978</text><g stroke="#8A6A00" stroke-width="3" fill="none"><line x1="1071" y1="365" x2="1077" y2="365" stroke="#8A6A00" stroke-width="3"/><path d="M1075 355 L1089 365 L1075 375"/></g><rect x="1090" y="245" width="240" height="235" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="1090" y="245" width="240" height="56" rx="18" fill="#F8E5E3" stroke="none" stroke-width="1.5"/><text x="1210" y="281" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#A3443E" text-anchor="middle">1997-12-16</text><text x="1210" y="341" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="middle">Ellis narrative published</text><text x="1210" y="379" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">Cryptome posts the 1987 text</text><text x="1210" y="405" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">the internal story becomes visible</text><text x="80" y="188" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">stage</text><text x="310" y="188" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="start">1970–1973 · inside CESG</text><text x="590" y="188" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#2E7D6B" text-anchor="start">1976–1978 · public literature</text><text x="1080" y="188" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#A3443E" text-anchor="start">1997 · historical disclosure</text><rect x="50" y="528" width="1300" height="108" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><text x="80" y="562" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="start">Reading: Cocks’s 1973 report was an internal CESG record; the 1976 public literature did not cite it.</text><text x="80" y="594" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">What appeared in 1997 was Ellis’s 1987 narrative, not a facsimile of Cocks’s 1973 report.</text><text x="80" y="622" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#8A6A00" text-anchor="start">Thus “put forward in 1973” and “published in 1973” must be kept apart; this diagram dates only the visible records.</text><rect x="50" y="654" width="1300" height="58" rx="18" fill="#FFF9E8" stroke="#E7D9A8" stroke-width="1.5"/><text x="72" y="690" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#8A6A00" text-anchor="start">Source: Ellis 1987, lines 68–69, 135, 297–303; Cryptome posting date at line 58.</text><text x="80" y="742" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">Original diagram, CC BY 4.0.</text>
</svg>
