<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" role="img" aria-labelledby="title desc">
  <title id="title">Cocks 1973 method: from two primes to modular exponentiation</title>
  <desc id="desc">Four-step flow: choose P, Q and N; encrypt with N as exponent; find two inverses; recover the message modulo each prime.</desc>
  <rect width="1400" height="780" fill="#F7F5EF"/>
<text x="80" y="72" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="34" font-weight="700" fill="#1F1D1A" text-anchor="start">Cocks 1973: from two primes to modular exponentiation</text>
<text x="80" y="108" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#6B655C" text-anchor="start">Four steps as retold by Ellis in 1987; notation follows the report and does not add later RSA key-generation details.</text><rect x="50" y="180" width="300" height="260" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="50" y="180" width="300" height="50" rx="18" fill="#ECE8FF" stroke="none" stroke-width="1.5"/><text x="72" y="212" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#6D5BD0" text-anchor="start">Receiver R</text><text x="328" y="212" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="end">key generation</text><text x="72" y="266" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="start">Choose two large primes</text><text x="72" y="308" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#1F1D1A" text-anchor="start">P and Q are large primes</text><text x="72" y="342" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="400" fill="#6B655C" text-anchor="start">N = P Q</text><text x="72" y="376" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">send N to sender S</text><g stroke="#6D5BD0" stroke-width="3" fill="none"><line x1="352" y1="310" x2="371" y2="310" stroke="#6D5BD0" stroke-width="3"/><path d="M369 300 L383 310 L369 320"/></g><rect x="385" y="180" width="300" height="260" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="385" y="180" width="300" height="50" rx="18" fill="#E3F4EE" stroke="none" stroke-width="1.5"/><text x="407" y="212" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#2E7D6B" text-anchor="start">Sender S</text><text x="663" y="212" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="end">encryption</text><text x="407" y="266" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="start">Encrypt with N as exponent</text><text x="407" y="308" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#1F1D1A" text-anchor="start">C = M^N (mod N)</text><text x="407" y="342" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="400" fill="#6B655C" text-anchor="start">M is message; C is ciphertext</text><text x="407" y="376" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">N is both modulus and exponent</text><g stroke="#6D5BD0" stroke-width="3" fill="none"><line x1="687" y1="310" x2="706" y2="310" stroke="#6D5BD0" stroke-width="3"/><path d="M704 300 L718 310 L704 320"/></g><rect x="720" y="180" width="300" height="260" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="720" y="180" width="300" height="50" rx="18" fill="#ECE8FF" stroke="none" stroke-width="1.5"/><text x="742" y="212" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#6D5BD0" text-anchor="start">Receiver R</text><text x="998" y="212" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="end">decryption setup</text><text x="742" y="266" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="start">Find inverses for decryption</text><text x="742" y="308" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="400" fill="#1F1D1A" text-anchor="start">P P′ ≡ 1 (mod Q−1)</text><text x="742" y="342" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="400" fill="#6B655C" text-anchor="start">Q Q′ ≡ 1 (mod P−1)</text><text x="742" y="376" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">keep P, Q and both inverses</text><g stroke="#6D5BD0" stroke-width="3" fill="none"><line x1="1022" y1="310" x2="1041" y2="310" stroke="#6D5BD0" stroke-width="3"/><path d="M1039 300 L1053 310 L1039 320"/></g><rect x="1055" y="180" width="300" height="260" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="1055" y="180" width="300" height="50" rx="18" fill="#FFF4CF" stroke="none" stroke-width="1.5"/><text x="1077" y="212" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#8A6A00" text-anchor="start">Receiver R</text><text x="1333" y="212" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="end">decryption</text><text x="1077" y="266" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="start">Recover M modulo each prime</text><text x="1077" y="308" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="400" fill="#1F1D1A" text-anchor="start">M = C^P′ (mod Q)</text><text x="1077" y="342" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="400" fill="#6B655C" text-anchor="start">M = C^Q′ (mod P)</text><text x="1077" y="376" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">combine the two results</text><rect x="50" y="482" width="1300" height="100" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><text x="80" y="516" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="start">Reading: N is the public modulus and the public exponent; decryption uses the two factors P and Q with separate moduli.</text><text x="80" y="548" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">Ellis calls Cocks a special case of RSA with e = N, and calls the differences superficial.</text><rect x="50" y="610" width="1300" height="96" rx="18" fill="#FFFFFF" stroke="#E7D9A8" stroke-width="1.5"/><text x="80" y="644" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#8A6A00" text-anchor="start">Security assumption: factoring N is difficult.</text><text x="80" y="672" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">Source: Ellis 1987, lines 182–200, 202, 222–223; Cocks report title and date at lines 297–298.</text><text x="80" y="742" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">Original diagram, CC BY 4.0.</text>
</svg>
