<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" role="img" aria-labelledby="title desc">
  <title id="title">科克斯 1973 年方法：从两个素数到模幂</title>
  <desc id="desc">四步流程图：选择 P、Q 与 N，用 N 作指数加密，求两个逆元，再分模恢复明文。</desc>
  <rect width="1400" height="780" fill="#F7F5EF"/>
<text x="80" y="72" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="34" font-weight="700" fill="#1F1D1A" text-anchor="start">科克斯 1973 年方法：从两个素数到模幂</text>
<text x="80" y="108" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#6B655C" text-anchor="start">按 Ellis 1987 年追述复述的四步；公式与报告中的记号一致，不补后来 RSA 的密钥生成细节。</text><rect x="50" y="180" width="300" height="260" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="50" y="180" width="300" height="50" rx="18" fill="#ECE8FF" stroke="none" stroke-width="1.5"/><text x="72" y="212" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#6D5BD0" text-anchor="start">接收方 R</text><text x="328" y="212" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="end">密钥生成</text><text x="72" y="266" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="start">选两个大素数</text><text x="72" y="308" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#1F1D1A" text-anchor="start">P、Q 均为大素数</text><text x="72" y="342" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="400" fill="#6B655C" text-anchor="start">N = P Q</text><text x="72" y="376" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">把 N 交给发送方 S</text><g stroke="#6D5BD0" stroke-width="3" fill="none"><line x1="352" y1="310" x2="371" y2="310" stroke="#6D5BD0" stroke-width="3"/><path d="M369 300 L383 310 L369 320"/></g><rect x="385" y="180" width="300" height="260" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="385" y="180" width="300" height="50" rx="18" fill="#E3F4EE" stroke="none" stroke-width="1.5"/><text x="407" y="212" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#2E7D6B" text-anchor="start">发送方 S</text><text x="663" y="212" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="end">加密</text><text x="407" y="266" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="start">用 N 作指数加密</text><text x="407" y="308" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#1F1D1A" text-anchor="start">C = M^N (mod N)</text><text x="407" y="342" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="400" fill="#6B655C" text-anchor="start">M 为消息，C 为密文</text><text x="407" y="376" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">N 同时充当模数与指数</text><g stroke="#6D5BD0" stroke-width="3" fill="none"><line x1="687" y1="310" x2="706" y2="310" stroke="#6D5BD0" stroke-width="3"/><path d="M704 300 L718 310 L704 320"/></g><rect x="720" y="180" width="300" height="260" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="720" y="180" width="300" height="50" rx="18" fill="#ECE8FF" stroke="none" stroke-width="1.5"/><text x="742" y="212" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#6D5BD0" text-anchor="start">接收方 R</text><text x="998" y="212" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="end">解密准备</text><text x="742" y="266" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="start">为解密求逆元</text><text x="742" y="308" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="400" fill="#1F1D1A" text-anchor="start">P P′ ≡ 1 (mod Q−1)</text><text x="742" y="342" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="400" fill="#6B655C" text-anchor="start">Q Q′ ≡ 1 (mod P−1)</text><text x="742" y="376" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">保留 P、Q 与两个逆元</text><g stroke="#6D5BD0" stroke-width="3" fill="none"><line x1="1022" y1="310" x2="1041" y2="310" stroke="#6D5BD0" stroke-width="3"/><path d="M1039 300 L1053 310 L1039 320"/></g><rect x="1055" y="180" width="300" height="260" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="1055" y="180" width="300" height="50" rx="18" fill="#FFF4CF" stroke="none" stroke-width="1.5"/><text x="1077" y="212" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#8A6A00" text-anchor="start">接收方 R</text><text x="1333" y="212" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="end">解密</text><text x="1077" y="266" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="start">分模恢复明文</text><text x="1077" y="308" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="400" fill="#1F1D1A" text-anchor="start">M = C^P′ (mod Q)</text><text x="1077" y="342" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="400" fill="#6B655C" text-anchor="start">M = C^Q′ (mod P)</text><text x="1077" y="376" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">由中国剩余定理合并</text><rect x="50" y="482" width="1300" height="100" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><text x="80" y="516" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="start">读图：N 是公开的模数，也是公开指数；解密利用 P、Q 两个因子分模计算。</text><text x="80" y="548" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">Ellis 指出，这使 Cocks 成为 RSA 的特例：把 e 取成 N；两者差异是表面的。</text><rect x="50" y="610" width="1300" height="96" rx="18" fill="#FFFFFF" stroke="#E7D9A8" stroke-width="1.5"/><text x="80" y="644" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#8A6A00" text-anchor="start">安全假设：分解 N 困难。</text><text x="80" y="672" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">来源：Ellis 1987 年追述第 182–200、202、222–223 行；Cocks 报告题名与日期见第 297–298 行。</text><text x="80" y="742" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">原创示意图，CC BY 4.0。</text>
</svg>
