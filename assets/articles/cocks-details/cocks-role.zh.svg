<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Cocks 在非秘密加密链条中的位置</title>
  <desc id="desc">五个时间节点：1970 定理、1973 Cocks 方法、1976 Diffie–Hellman、1977/78 RSA、1997 追述公开，区分内部记录与公开文献。</desc>
  <rect width="1400" height="760" fill="#F7F5EF"/>
<text x="80" y="72" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="34" font-weight="700" fill="#1F1D1A" text-anchor="start">Cocks 在非秘密加密链条中的位置</text>
<text x="80" y="108" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#6B655C" text-anchor="start">把 1970 年定理、1973 年方法、1976/1977–78 年公开文献与 1997 年追述公开分开，避免把内部记录当成公开发表。</text><rect x="50" y="245" width="240" height="235" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="50" y="245" width="240" height="56" rx="18" fill="#ECE8FF" stroke="none" stroke-width="1.5"/><text x="170" y="281" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#6D5BD0" text-anchor="middle">1970</text><text x="170" y="341" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="middle">Ellis 存在性定理</text><text x="170" y="379" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">证明 NSE 理论上可行</text><text x="170" y="405" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">CESG 内部报告</text><g stroke="#6D5BD0" stroke-width="3" fill="none"><line x1="291" y1="365" x2="297" y2="365" stroke="#6D5BD0" stroke-width="3"/><path d="M295 355 L309 365 L295 375"/></g><rect x="310" y="245" width="240" height="235" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="310" y="245" width="240" height="56" rx="18" fill="#E3F4EE" stroke="none" stroke-width="1.5"/><text x="430" y="281" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#2E7D6B" text-anchor="middle">1973-11-20</text><text x="430" y="341" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="middle">Cocks 方法</text><text x="430" y="379" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">第一个可实施的想法</text><text x="430" y="405" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">CESG 内部报告</text><g stroke="#2E7D6B" stroke-width="3" fill="none"><line x1="551" y1="365" x2="557" y2="365" stroke="#2E7D6B" stroke-width="3"/><path d="M555 355 L569 365 L555 375"/></g><rect x="570" y="245" width="240" height="235" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="570" y="245" width="240" height="56" rx="18" fill="#E3F4EE" stroke="none" stroke-width="1.5"/><text x="690" y="281" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#2E7D6B" text-anchor="middle">1976-04</text><text x="690" y="341" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="middle">Diffie–Hellman</text><text x="690" y="379" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">公开提出公钥思想</text><text x="690" y="405" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">公开文献</text><g stroke="#2E7D6B" stroke-width="3" fill="none"><line x1="811" y1="365" x2="817" y2="365" stroke="#2E7D6B" stroke-width="3"/><path d="M815 355 L829 365 L815 375"/></g><rect x="830" y="245" width="240" height="235" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="830" y="245" width="240" height="56" rx="18" fill="#FFF4CF" stroke="none" stroke-width="1.5"/><text x="950" y="281" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#8A6A00" text-anchor="middle">1977 / 1978-02</text><text x="950" y="341" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="middle">RSA</text><text x="950" y="379" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">MIT 技术备忘录</text><text x="950" y="405" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">随后发表于 CACM</text><g stroke="#8A6A00" stroke-width="3" fill="none"><line x1="1071" y1="365" x2="1077" y2="365" stroke="#8A6A00" stroke-width="3"/><path d="M1075 355 L1089 365 L1075 375"/></g><rect x="1090" y="245" width="240" height="235" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="1090" y="245" width="240" height="56" rx="18" fill="#F8E5E3" stroke="none" stroke-width="1.5"/><text x="1210" y="281" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#A3443E" text-anchor="middle">1997-12-16</text><text x="1210" y="341" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="middle">Ellis 追述公开</text><text x="1210" y="379" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">Cryptome 贴出 1987 年文稿</text><text x="1210" y="405" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">这段内部史才可见</text><text x="80" y="188" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">阶段</text><text x="310" y="188" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="start">1970–1973 · CESG 内部</text><text x="590" y="188" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#2E7D6B" text-anchor="start">1976–1978 · 公开文献</text><text x="1080" y="188" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#A3443E" text-anchor="start">1997 · 历史公开</text><rect x="50" y="528" width="1300" height="108" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><text x="80" y="562" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="start">读图：Cocks 的 1973 年报告属于 CESG 内部记录；1976 年公开文献没有引用它。</text><text x="80" y="594" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">1997 年公开的是 Ellis 1987 年的追述，不是 Cocks 1973 年原始报告的影印件。</text><text x="80" y="622" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#8A6A00" text-anchor="start">因此，“1973 年提出”与“1973 年公开”必须分开写；本图只标可见记录的日期。</text><rect x="50" y="654" width="1300" height="58" rx="18" fill="#FFF9E8" stroke="#E7D9A8" stroke-width="1.5"/><text x="72" y="690" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#8A6A00" text-anchor="start">来源：Ellis 1987 年追述第 68–69、135、297–303 行；Cryptome 贴出日期第 58 行。</text><text x="80" y="742" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">原创示意图，CC BY 4.0。</text>
</svg>
