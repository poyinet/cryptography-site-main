<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" role="img" aria-labelledby="title desc">
  <title id="title">Cocks 1973 与 RSA 的公式对照</title>
  <desc id="desc">两栏对照 Cocks 与 RSA 的模数、密钥方程、加密和解密公式；中间标出同源但不同。</desc>
  <rect width="1400" height="780" fill="#F7F5EF"/>
<text x="80" y="72" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="34" font-weight="700" fill="#1F1D1A" text-anchor="start">Cocks 1973 与 RSA：同源，但密钥方程不同</text>
<text x="80" y="108" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#6B655C" text-anchor="start">左边是 Ellis 复述的 Cocks 方法，右边是同一追述中概述的 RSA；对照的是公式结构，不是安全性排名。</text><rect x="50" y="175" width="600" height="330" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="50" y="175" width="600" height="56" rx="18" fill="#ECE8FF" stroke="none" stroke-width="1.5"/><text x="78" y="211" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#6D5BD0" text-anchor="start">Cocks 1973：N 直接作指数</text><text x="78" y="275" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">模数</text><text x="78" y="299" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="400" fill="#1F1D1A" text-anchor="start">N = P Q</text><text x="78" y="317" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">加密</text><text x="78" y="341" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="20" font-weight="700" fill="#2E7D6B" text-anchor="start">C = M^N (mod N)</text><text x="78" y="359" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">解密准备</text><text x="78" y="383" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="400" fill="#1F1D1A" text-anchor="start">P P′ ≡ 1 (mod Q−1)；Q Q′ ≡ 1 (mod P−1)</text><text x="78" y="401" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">解密</text><text x="78" y="425" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="20" font-weight="700" fill="#8A6A00" text-anchor="start">M = C^P′ (mod Q)；M = C^Q′ (mod P)</text><rect x="750" y="175" width="600" height="330" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><rect x="750" y="175" width="600" height="56" rx="18" fill="#E3F4EE" stroke="none" stroke-width="1.5"/><text x="778" y="211" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#2E7D6B" text-anchor="start">RSA 1977/78：选择 e 与 d</text><text x="778" y="275" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">模数</text><text x="778" y="299" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="400" fill="#1F1D1A" text-anchor="start">N = P Q；φ = (P−1)(Q−1)</text><text x="778" y="317" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">密钥方程</text><text x="778" y="341" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="20" font-weight="700" fill="#6D5BD0" text-anchor="start">d e ≡ 1 (mod φ)</text><text x="778" y="359" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">加密</text><text x="778" y="383" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="20" font-weight="700" fill="#2E7D6B" text-anchor="start">C = M^e (mod N)</text><text x="778" y="401" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">解密</text><text x="778" y="425" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="20" font-weight="700" fill="#2E7D6B" text-anchor="start">M = C^d (mod N)</text><g><circle cx="700" cy="340" r="38" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><text x="700" y="330" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#6D5BD0" text-anchor="middle">同源</text><text x="700" y="354" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#6B655C" text-anchor="middle">不同</text></g><rect x="50" y="535" width="1300" height="118" rx="18" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/><text x="80" y="571" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="start">共同点：两者都用 N = P Q 作公开模数，都把安全性建立在分解 N 的困难上。</text><text x="80" y="603" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">关键差别：Cocks 令 e = N；RSA 另选 e，并用 d e ≡ 1 (mod φ) 求 d。</text><text x="80" y="633" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">Ellis 的判断：Cocks 是 RSA 的特例，差别是表面的；这不是把两案合并成同一方案。</text><rect x="50" y="677" width="1300" height="58" rx="18" fill="#FFF9E8" stroke="#E7D9A8" stroke-width="1.5"/><text x="72" y="713" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#8A6A00" text-anchor="start">“The differences between the two algorithms are superficial. Cocks is a special case of RSA in that it puts e = N.” — Ellis 1987, 第 222–223 行</text><text x="80" y="762" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">原创示意图，CC BY 4.0。</text>
</svg>
