<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" role="img" aria-labelledby="title desc">
<title id="title">从 1975 年会议报告到 1976 年 11 月论文</title>
<desc id="desc">四节点时间线：1975 年 Lenox 会议、1976 年 6 月投稿、1976 年 6 月 Ronneby 会议、1976 年 11 月论文发表。</desc>
<rect width="1400" height="560" fill="#F7F5EF"/>
<text x="80" y="70" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="29" font-weight="700" fill="#1F1D1A" text-anchor="start">从 1975 年会议报告到 1976 年 11 月论文</text>
<text x="80" y="106" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">论文脚注把会议报告与正式发表分开；本图沿用这一区分。</text>
<line x1="100" y1="260" x2="1300" y2="260" stroke="#DED9CE" stroke-width="3"/>
<circle cx="220" cy="260" r="12" fill="#6D5BD0" stroke="#FFFFFF" stroke-width="3"/>
<rect x="90" y="300" width="260" height="176" rx="14" fill="#FFFFFF"/>
<text x="108" y="340" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="700" fill="#6D5BD0" text-anchor="start">1975-06-23/25</text>
<text x="108" y="376" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#1F1D1A" text-anchor="start">Lenox, MA</text>
<text x="108" y="408" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">IEEE 信息论研讨会</text>
<text x="108" y="438" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">部分工作报告</text>
<text x="108" y="466" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="400" fill="#6B655C" text-anchor="start">论文证词</text>
<circle cx="520" cy="260" r="12" fill="#2E7D6B" stroke="#FFFFFF" stroke-width="3"/>
<rect x="390" y="300" width="260" height="176" rx="14" fill="#FFFFFF"/>
<text x="408" y="340" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="700" fill="#2E7D6B" text-anchor="start">1976-06-03</text>
<text x="408" y="376" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#1F1D1A" text-anchor="start">投稿</text>
<text x="408" y="408" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">Manuscript received</text>
<text x="408" y="438" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">June 3, 1976</text>
<text x="408" y="466" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="400" fill="#6B655C" text-anchor="start">论文证词</text>
<circle cx="820" cy="260" r="12" fill="#2E7D6B" stroke="#FFFFFF" stroke-width="3"/>
<rect x="690" y="300" width="260" height="176" rx="14" fill="#FFFFFF"/>
<text x="708" y="340" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="700" fill="#2E7D6B" text-anchor="start">1976-06-21/24</text>
<text x="708" y="376" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#1F1D1A" text-anchor="start">Ronneby, Sweden</text>
<text x="708" y="408" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">IEEE 信息论研讨会</text>
<text x="708" y="438" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">部分工作报告</text>
<text x="708" y="466" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="400" fill="#6B655C" text-anchor="start">论文证词</text>
<circle cx="1120" cy="260" r="12" fill="#8A6A00" stroke="#FFFFFF" stroke-width="3"/>
<rect x="990" y="300" width="260" height="176" rx="14" fill="#FFFFFF"/>
<text x="1008" y="340" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="700" fill="#8A6A00" text-anchor="start">1976-11</text>
<text x="1008" y="376" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#1F1D1A" text-anchor="start">IEEE Trans. IT</text>
<text x="1008" y="408" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">22(6): 644–654</text>
<text x="1008" y="438" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">正式发表</text>
<text x="1008" y="466" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="400" fill="#6B655C" text-anchor="start">论文证词</text>
<rect x="50" y="480" width="1300" height="58" rx="10" fill="#FFF4CF"/>
<text x="74" y="503" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#8A6A00" text-anchor="start">1975 年会议报告不是正式发表。</text>
<text x="74" y="526" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#8A6A00" text-anchor="start">正式出版：IEEE Trans. IT 22(6), 1976-11, 644–654。</text>
<text x="80" y="553" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="400" fill="#6B655C" text-anchor="start">原创示意图，CC BY 4.0。证据：Diffie–Hellman 1976，第 1、41–46、1105 行。</text>
