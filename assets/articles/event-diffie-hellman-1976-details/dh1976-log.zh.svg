<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" role="img" aria-labelledby="title desc">
<title id="title">公开密钥分配的安全假设</title>
<desc id="desc">流程图：用户选秘密 X 计算 Y=α^X mod q 并公开 Y；由 Y 反推 X 依赖离散对数困难。</desc>
<rect width="1400" height="800" fill="#F7F5EF"/>
<text x="80" y="70" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">公开密钥分配的安全假设</text>
<text x="80" y="106" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">按论文第 567–590、609–614 行的公开密钥分配段落重画；公式为示意记号。</text>
<rect x="50" y="160" width="360" height="300" rx="18" fill="#FFFFFF"/>
<rect x="72" y="180" width="170" height="34" rx="12" fill="#ECE8FF"/>
<text x="157.0" y="203.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="middle">用户 i</text>
<text x="72" y="252" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="start">选秘密 X_i</text>
<text x="72" y="286" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">X_i ∈ {1, …, q−1}</text>
<text x="72" y="328" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">计算公开值</text>
<text x="72" y="362" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#6D5BD0" text-anchor="start">Y_i = α^X_i mod q</text>
<text x="72" y="404" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">X_i 保密，Y_i 公开</text>
<line x1="414" y1="310" x2="446" y2="310" stroke="#6D5BD0" stroke-width="3"/>
<path d="M434 301 L446 310 L434 319" fill="none" stroke="#6D5BD0" stroke-width="3"/>
<rect x="450" y="160" width="340" height="300" rx="18" fill="#FFFFFF"/>
<rect x="472" y="180" width="200" height="34" rx="12" fill="#E3F4EE"/>
<text x="572.0" y="203.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#2E7D6B" text-anchor="middle">公开文件</text>
<text x="472" y="252" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="start">每个用户一行</text>
<text x="472" y="296" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="20" font-weight="400" fill="#1F1D1A" text-anchor="start">i : Y_i</text>
<text x="472" y="328" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="20" font-weight="400" fill="#1F1D1A" text-anchor="start">j : Y_j</text>
<text x="472" y="370" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">只放公开值</text>
<text x="472" y="398" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">任何人都可读</text>
<line x1="794" y1="310" x2="826" y2="310" stroke="#6D5BD0" stroke-width="3"/>
<path d="M814 301 L826 310 L814 319" fill="none" stroke="#6D5BD0" stroke-width="3"/>
<rect x="830" y="160" width="520" height="300" rx="18" fill="#FFFFFF"/>
<rect x="852" y="180" width="260" height="34" rx="12" fill="#FBE7E3"/>
<text x="982.0" y="203.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#A33A32" text-anchor="middle">其他人 / 攻击者</text>
<text x="852" y="252" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="start">拿到 Y_i，想求 X_i</text>
<text x="852" y="292" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="23" font-weight="700" fill="#A33A32" text-anchor="start">X_i = log_α Y_i mod q</text>
<text x="852" y="336" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">「computing logarithms over a finite field GF(q)」</text>
<text x="852" y="374" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">正向容易，反向困难</text>
<text x="852" y="410" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">论文的假设，不是已证明的下界</text>
<rect x="50" y="500" width="1300" height="160" rx="16" fill="#FFFFFF" stroke="#E7D9A8" stroke-width="1.5"/>
<text x="80" y="540" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#8A6A00" text-anchor="start">论文自陈的边界</text>
<text x="80" y="572" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">「The security of our technique depends crucially on the difficulty of computing logarithms mod q」</text>
<text x="80" y="602" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">若存在复杂度按 log q 增长的求对数算法，系统即被破；但论文承认没有逆命题证明。</text>
<text x="80" y="632" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">因此本条不把 q^{1/2} 的估计写成已证明的安全下界。</text>
<text x="80" y="730" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">原创示意图，CC BY 4.0。证据：Diffie–Hellman 1976，第 567–590、609–614 行。</text>
</svg>
