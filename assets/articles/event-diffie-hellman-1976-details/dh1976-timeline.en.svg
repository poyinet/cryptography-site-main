<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" role="img" aria-labelledby="title desc">
<title id="title">From the 1975 conference report to the November 1976 paper</title>
<desc id="desc">Four-node timeline: Lenox 1975, submission June 1976, Ronneby June 1976, publication November 1976.</desc>
<rect width="1400" height="560" fill="#F7F5EF"/>
<text x="80" y="70" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="29" font-weight="700" fill="#1F1D1A" text-anchor="start">From the 1975 conference report to the November 1976 paper</text>
<text x="80" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">The paper’s footnote separates conference reports from formal publication; this diagram keeps that distinction.</text>
<line x1="100" y1="260" x2="1300" y2="260" stroke="#DED9CE" stroke-width="3"/>
<circle cx="220" cy="260" r="12" fill="#6D5BD0" stroke="#FFFFFF" stroke-width="3"/>
<rect x="90" y="300" width="260" height="176" rx="14" fill="#FFFFFF"/>
<text x="108" y="340" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="700" fill="#6D5BD0" text-anchor="start">1975-06-23/25</text>
<text x="108" y="376" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#1F1D1A" text-anchor="start">Lenox, MA</text>
<text x="108" y="408" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">IEEE IT Workshop</text>
<text x="108" y="438" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">portions presented</text>
<text x="108" y="466" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#6B655C" text-anchor="start">printed in the paper</text>
<circle cx="520" cy="260" r="12" fill="#2E7D6B" stroke="#FFFFFF" stroke-width="3"/>
<rect x="390" y="300" width="260" height="176" rx="14" fill="#FFFFFF"/>
<text x="408" y="340" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="700" fill="#2E7D6B" text-anchor="start">1976-06-03</text>
<text x="408" y="376" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#1F1D1A" text-anchor="start">Manuscript</text>
<text x="408" y="408" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">Manuscript received</text>
<text x="408" y="438" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">June 3, 1976</text>
<text x="408" y="466" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#6B655C" text-anchor="start">printed in the paper</text>
<circle cx="820" cy="260" r="12" fill="#2E7D6B" stroke="#FFFFFF" stroke-width="3"/>
<rect x="690" y="300" width="260" height="176" rx="14" fill="#FFFFFF"/>
<text x="708" y="340" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="700" fill="#2E7D6B" text-anchor="start">1976-06-21/24</text>
<text x="708" y="376" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#1F1D1A" text-anchor="start">Ronneby, Sweden</text>
<text x="708" y="408" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">IEEE ISIT</text>
<text x="708" y="438" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">portions presented</text>
<text x="708" y="466" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#6B655C" text-anchor="start">printed in the paper</text>
<circle cx="1120" cy="260" r="12" fill="#8A6A00" stroke="#FFFFFF" stroke-width="3"/>
<rect x="990" y="300" width="260" height="176" rx="14" fill="#FFFFFF"/>
<text x="1008" y="340" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="700" fill="#8A6A00" text-anchor="start">1976-11</text>
<text x="1008" y="376" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#1F1D1A" text-anchor="start">IEEE Trans. IT</text>
<text x="1008" y="408" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">22(6): 644–654</text>
<text x="1008" y="438" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">formal publication</text>
<text x="1008" y="466" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#6B655C" text-anchor="start">printed in the paper</text>
<rect x="50" y="480" width="1300" height="58" rx="10" fill="#FFF4CF"/>
<text x="74" y="503" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#8A6A00" text-anchor="start">The 1975 conference report is not formal publication.</text>
<text x="74" y="526" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#8A6A00" text-anchor="start">Formal publication: IEEE Trans. IT 22(6), November 1976, 644–654.</text>
<text x="80" y="553" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#6B655C" text-anchor="start">Original diagram, CC BY 4.0. Evidence: Diffie–Hellman 1976, lines 1, 41–46 and 1105.</text>
</svg>
