<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" role="img" aria-labelledby="title desc">
<title id="title">1976 年论文要解决的两件事</title>
<desc id="desc">两块面板：密钥分发与书面签名等价物；底部标出论文提出的两类方案。</desc>
<rect width="1400" height="820" fill="#F7F5EF"/>
<text x="80" y="70" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">1976 年论文要解决的两件事</text>
<text x="80" y="106" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">按 Diffie–Hellman 1976 年论文摘要与第 III 节重画；只表达问题，不表示已解决。</text>
<rect x="50" y="150" width="640" height="360" rx="18" fill="#FFFFFF"/>
<rect x="74" y="170" width="220" height="36" rx="12" fill="#ECE8FF"/>
<text x="184.0" y="194.5" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#6D5BD0" text-anchor="middle">需求 A · 密钥分发</text>
<text x="74" y="248" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="700" fill="#1F1D1A" text-anchor="start">公开信道上建立共同密钥</text>
<circle cx="170" cy="340" r="52" fill="#ECE8FF" stroke="#6D5BD0" stroke-width="2"/>
<text x="170" y="349" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="28" font-weight="700" fill="#6D5BD0" text-anchor="middle">A</text>
<circle cx="570" cy="340" r="52" fill="#E3F4EE" stroke="#2E7D6B" stroke-width="2"/>
<text x="570" y="349" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="28" font-weight="700" fill="#2E7D6B" text-anchor="middle">B</text>
<line x1="230" y1="340" x2="510" y2="340" stroke="#6B655C" stroke-width="2"/>
<text x="370" y="325" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="14" font-weight="400" fill="#6B655C" text-anchor="middle">public channel</text>
<text x="370" y="370" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#A33A32" text-anchor="middle">窃听 / 注入</text>
<text x="74" y="440" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="400" fill="#6D5BD0" text-anchor="start">「minimize the need for secure key distribution channels」</text>
<text x="74" y="472" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">减少对安全密钥分发渠道的依赖</text>
<rect x="710" y="150" width="640" height="360" rx="18" fill="#FFFFFF"/>
<rect x="734" y="170" width="250" height="36" rx="12" fill="#FFF4CF"/>
<text x="859.0" y="194.5" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#8A6A00" text-anchor="middle">需求 B · 签名等价物</text>
<text x="734" y="248" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="700" fill="#1F1D1A" text-anchor="start">可被任何人验证的数字签名</text>
<rect x="760" y="282" width="230" height="120" rx="10" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<line x1="782" y1="312" x2="960" y2="312" stroke="#E8E2D6" stroke-width="2"/>
<line x1="782" y1="336" x2="960" y2="336" stroke="#E8E2D6" stroke-width="2"/>
<line x1="782" y1="360" x2="960" y2="360" stroke="#E8E2D6" stroke-width="2"/>
<line x1="790" y1="380" x2="890" y2="380" stroke="#8A6A00" stroke-width="2"/>
<text x="790" y="398" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="10" font-weight="400" fill="#8A6A00" text-anchor="start">signature</text>
<text x="1030" y="310" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">书面合同</text>
<text x="1030" y="340" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">签名可验证</text>
<text x="1030" y="370" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">但复制与争议</text>
<text x="1030" y="400" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">需要新的机制</text>
<text x="734" y="432" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="12" font-weight="400" fill="#8A6A00" text-anchor="start">「supply the equivalent of a written signature」</text>
<text x="734" y="466" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">提供书面签名的等价物</text>
<rect x="50" y="548" width="1300" height="190" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="80" y="590" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="start">论文提出的两类方案</text>
<rect x="80" y="618" width="360" height="52" rx="12" fill="#ECE8FF"/>
<text x="260.0" y="651.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#6D5BD0" text-anchor="middle">public key cryptosystems</text>
<rect x="460" y="618" width="420" height="52" rx="12" fill="#E3F4EE"/>
<text x="670.0" y="651.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#2E7D6B" text-anchor="middle">public key distribution systems</text>
<text x="80" y="704" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">公钥密码系统更适合解决认证问题；公钥分配系统更接近可实现。</text>
<text x="80" y="730" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">这是 1976 年的概念与方法提出，不是部署记录。</text>
<text x="80" y="782" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">原创示意图，CC BY 4.0。证据：Diffie–Hellman 1976，第 8–9、397–426 行。</text>
</svg>
