<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">拖 crib 法</title>
<desc id="fig-desc">两条密文一异或，密钥流就消失了 — mechanism schematic with parameters, use and limits.</desc>
<defs>
<marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4B3F9E"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1F7A6A"/></marker>
<marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8A6100"/></marker>
<marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9B2C2C"/></marker>
<marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B655C"/></marker>
<clipPath id="mainClip"><rect x="50" y="185" width="760" height="450" rx="16"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="820" fill="#F7F5EF"/>
<text x="60" y="52" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#6B655C" text-anchor="left">流密码 · 密钥流重用</text>
<text x="60" y="104" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="37" font-weight="800" fill="#1F1D1A" text-anchor="left">拖 crib 法</text>
<text x="60" y="143" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#6B655C" text-anchor="left">C1⊕C2 = P1⊕P2 · 滑动猜测 · 语言评分</text>
<rect x="50" y="185" width="760" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="78" y="224" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="800" fill="#1F1D1A" text-anchor="left">两条密文一异或，密钥流就消失了</text>
<g clip-path="url(#mainClip)">
<text x="80" y="255" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F1D1A" text-anchor="left">同一密钥流下两条密文异或，密钥流被完全消去</text>
<rect x="80" y="285" width="160" height="76" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="160" y="305" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">C1 = P1 ⊕ K</text>
<text x="160" y="322" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">消息 P1</text>
<rect x="80" y="375" width="160" height="76" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="160" y="395" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">C2 = P2 ⊕ K</text>
<text x="160" y="412" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">消息 P2</text>
<line x1="242" y1="320" x2="298" y2="345" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<line x1="242" y1="415" x2="298" y2="390" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<rect x="298" y="330" width="155" height="76" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="375.5" y="350" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6100" text-anchor="middle">异或</text>
<text x="375.5" y="367" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">C1 ⊕ C2</text>
<line x1="455" y1="368" x2="495" y2="368" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<rect x="495" y="330" width="155" height="76" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="572.5" y="350" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6100" text-anchor="middle">明文异或</text>
<text x="572.5" y="367" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">P1 ⊕ P2</text>
<line x1="652" y1="368" x2="685" y2="368" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<rect x="685" y="330" width="105" height="76" rx="10" fill="#FBE9E9" stroke="#9B2C2C" stroke-width="1.6"/>
<text x="737.5" y="350" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#9B2C2C" text-anchor="middle">候选</text>
<text x="737.5" y="367" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">可读片段</text>
<text x="80" y="475" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F1D1A" text-anchor="left">把已知词 w 滑过所有偏移 i：</text>
<rect x="80" y="510" width="710" height="40" rx="8" fill="#ECE9FA" stroke="#1F7A6A" stroke-width="1"/>
<text x="94" y="536" font-family="'Consolas','SFMono-Regular',monospace" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="left">P2[i…i+ℓ-1] = (P1⊕P2)[i…i+ℓ-1] ⊕ w</text>
<text x="80" y="570" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="600" fill="#1F1D1A" text-anchor="left">候选片段可读，就同时锚定 P1 与 P2 的一小段；再用语言模型向两侧扩展。</text>
<text x="80" y="600" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="600" fill="#9B2C2C" text-anchor="left">边界：nonce 唯一、认证加密、明文语言未知或消息太短，都会让拖 crib 失效。</text>
</g>
<rect x="830" y="185" width="360" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<rect x="835" y="205" width="350" height="132" rx="12" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.2"/>
<text x="851" y="229" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#4B3F9E" text-anchor="left">前提</text>
<circle cx="854" cy="252" r="2.5" fill="#4B3F9E"/>
<text x="864" y="256" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">同一密钥流 K</text>
<circle cx="854" cy="280" r="2.5" fill="#4B3F9E"/>
<text x="864" y="284" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">C1 = P1 ⊕ K, C2 = P2 ⊕ K</text>
<rect x="835" y="345" width="350" height="132" rx="12" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.2"/>
<text x="851" y="369" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#1F7A6A" text-anchor="left">消去</text>
<circle cx="854" cy="392" r="2.5" fill="#1F7A6A"/>
<text x="864" y="396" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">C1 ⊕ C2 = P1 ⊕ P2</text>
<circle cx="854" cy="420" r="2.5" fill="#1F7A6A"/>
<text x="864" y="424" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">密钥流不出现</text>
<rect x="835" y="485" width="350" height="132" rx="12" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.2"/>
<text x="851" y="509" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#8A6100" text-anchor="left">恢复</text>
<circle cx="854" cy="532" r="2.5" fill="#8A6100"/>
<text x="864" y="536" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">滑动已知词 w</text>
<circle cx="854" cy="560" r="2.5" fill="#8A6100"/>
<text x="864" y="564" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">检查另一段是否可读</text>
<rect x="50" y="660" width="1140" height="105" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="74" y="690" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="800" fill="#4B3F9E" text-anchor="left">怎么读这张图</text>
<text x="74" y="716" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">读法：拖 crib 法的前提不是“猜到整条消息”，而是“猜到一小段”。把这段已知词滑过 P1⊕P2，如果另一侧浮现可读文本，就同</text>
<text x="74" y="739" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">时得到两条消息的一小段；再用语言模型和更多密文扩展。</text>
<line x1="60" y1="782" x2="1180" y2="782" stroke="#DED9CE" stroke-width="1.2"/>
<text x="60" y="804" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">原创机制示意图 · CC BY 4.0 · poyi knowledge · 2026-11-22 · 定理陈述与界据所引论文绘制</text>
</svg>
