<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="title desc">
<title id="title">What the paper gives — and what it does not</title>
<desc id="desc">Keep the 1976 key distribution separate from later signatures, PKI, and deployed protocols.</desc>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1F1D1A" flood-opacity="0.075"/></filter></defs>
<rect width="1240" height="820" fill="#F7F5EF"/>
<text x="64" y="42" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#6B655C" text-anchor="start">DIFFIE–HELLMAN / 1976</text>
<text x="64" y="88" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="36" font-weight="750" fill="#1F1D1A" text-anchor="start">What the paper gives — and what it does not</text>
<text x="64" y="122" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">Keep the 1976 key distribution separate from later signatures, PKI, and deployed protocols.</text>
<line x1="64" y1="146" x2="1176" y2="146" stroke="#DED9CE" stroke-width="1.5"/>
<rect x="64" y="184" width="328" height="456" rx="20" fill="#FFFFFF" stroke="#1F7A6A" stroke-width="1.2" filter="url(#soft)"/>
<rect x="64" y="184" width="328" height="64" rx="20" fill="#E2F3EE"/>
<text x="90" y="224" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="750" fill="#1F7A6A" text-anchor="start">The paper gives</text>
<circle cx="356" cy="216" r="18" fill="#1F7A6A"/>
<text x="356" y="222" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
<circle cx="96" cy="277" r="13" fill="#1F7A6A"/>
<text x="96" y="283" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="122" y="282" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">key exchange over a public</text>
<text x="122" y="304" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">channel</text>
<circle cx="96" cy="339" r="13" fill="#1F7A6A"/>
<text x="96" y="345" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="122" y="344" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">a shared key derived by both</text>
<circle cx="96" cy="385" r="13" fill="#1F7A6A"/>
<text x="96" y="391" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="122" y="390" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">key hard to compute from</text>
<text x="122" y="412" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">public values</text>
<text x="90" y="596" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6B655C" text-anchor="start">Boundary: key distribution only,</text>
<text x="90" y="614" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6B655C" text-anchor="start">not identity authentication.</text>
<rect x="456" y="184" width="328" height="456" rx="20" fill="#FFFFFF" stroke="#9A6A00" stroke-width="1.2" filter="url(#soft)"/>
<rect x="456" y="184" width="328" height="64" rx="20" fill="#FFF3CD"/>
<text x="482" y="224" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18.5" font-weight="750" fill="#9A6A00" text-anchor="start">The paper does not give</text>
<circle cx="748" cy="216" r="18" fill="#9A6A00"/>
<text x="748" y="222" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">×</text>
<circle cx="488" cy="277" r="13" fill="#9A6A00"/>
<text x="488" y="283" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="514" y="282" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">a concrete signature scheme</text>
<circle cx="488" cy="323" r="13" fill="#9A6A00"/>
<text x="488" y="329" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="514" y="328" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">certificates / PKI</text>
<circle cx="488" cy="369" r="13" fill="#9A6A00"/>
<text x="488" y="375" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="514" y="374" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">a proof: DLP hard ⇒ secure</text>
<circle cx="488" cy="415" r="13" fill="#9A6A00"/>
<text x="488" y="421" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="514" y="420" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">deployed protocols /</text>
<text x="514" y="442" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">parameters</text>
<text x="482" y="596" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6B655C" text-anchor="start">These arrive in later papers,</text>
<text x="482" y="614" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6B655C" text-anchor="start">standards, or protocols.</text>
<rect x="848" y="184" width="328" height="456" rx="20" fill="#FFFFFF" stroke="#A33A32" stroke-width="1.2" filter="url(#soft)"/>
<rect x="848" y="184" width="328" height="64" rx="20" fill="#FBE7E3"/>
<text x="874" y="224" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="750" fill="#A33A32" text-anchor="start">Do not mix in</text>
<circle cx="1140" cy="216" r="18" fill="#A33A32"/>
<text x="1140" y="222" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text>
<circle cx="880" cy="277" r="13" fill="#A33A32"/>
<text x="880" y="283" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="906" y="282" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">RSA encryption</text>
<circle cx="880" cy="323" r="13" fill="#A33A32"/>
<text x="880" y="329" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="906" y="328" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">key transport</text>
<circle cx="880" cy="369" r="13" fill="#A33A32"/>
<text x="880" y="375" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="906" y="374" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">the complete TLS handshake</text>
<circle cx="880" cy="415" r="13" fill="#A33A32"/>
<text x="880" y="421" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="906" y="420" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1F1D1A" text-anchor="start">deployed DH parameters</text>
<text x="874" y="596" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6B655C" text-anchor="start">Same name is not the same</text>
<text x="874" y="614" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6B655C" text-anchor="start">mechanism.</text>
<rect x="64" y="674" width="1112" height="84" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.1"/>
<text x="94" y="708" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="start">“We propose some techniques for developing public key cryptosystems, but the problem is still largely open.”</text>
<text x="94" y="736" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6B655C" text-anchor="start">— Diffie &amp; Hellman, 1976, p. 645</text>
<text x="1146" y="730" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8A8378" text-anchor="end">p. 645</text>
<line x1="64" y1="762" x2="1176" y2="762" stroke="#DED9CE" stroke-width="1"/>
<text x="64" y="788" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6B655C" text-anchor="start">The quote is the paper's own boundary statement; later systems are separate entries.</text>
<text x="1176" y="788" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8A8378" text-anchor="end">dh-new-directions-1976.txt:87-98, 535-614</text>
<text x="1176" y="42" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A8378" text-anchor="end">FIG 3</text>
</svg>
