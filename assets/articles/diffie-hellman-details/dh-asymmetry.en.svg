<text x="620" y="433" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#6B655C" text-anchor="middle">ASYMMETRY</text>
<rect x="64" y="678" width="1112" height="68" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.1"/>
<text x="620" y="719" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#1F1D1A" text-anchor="middle">This is a 1976 complexity assumption: the paper explicitly says it has no proof of the converse, “DLP hard ⇒ scheme secure”.</text>
<line x1="64" y1="762" x2="1176" y2="762" stroke="#DED9CE" stroke-width="1"/>
<text x="64" y="788" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6B655C" text-anchor="start">Security here is an assumption, not a theorem.</text>
