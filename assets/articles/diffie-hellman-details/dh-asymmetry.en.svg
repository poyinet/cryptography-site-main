<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="title desc">
<title id="title">Easy exponentiation, hard discrete logarithm</title>
<desc id="desc">In the same finite field, the forward and reverse directions are not symmetric.</desc>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1F1D1A" flood-opacity="0.075"/></filter></defs>
<rect width="1240" height="820" fill="#F7F5EF"/>
<text x="64" y="42" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#6B655C" text-anchor="start">DIFFIE–HELLMAN / 1976</text>
<text x="64" y="88" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="36" font-weight="750" fill="#1F1D1A" text-anchor="start">Easy exponentiation, hard discrete logarithm</text>
<text x="64" y="122" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">In the same finite field, the forward and reverse directions are not symmetric.</text>
<line x1="64" y1="146" x2="1176" y2="146" stroke="#DED9CE" stroke-width="1.5"/>
<rect x="64" y="174" width="520" height="470" rx="20" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.2"/>
<text x="94" y="214" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="750" fill="#1F7A6A" text-anchor="start">FORWARD: given X, compute Y</text>
<text x="94" y="258" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="26" font-weight="700" fill="#1F1D1A" text-anchor="start">Y = α^X mod q</text>
<text x="94" y="294" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#1F7A6A" text-anchor="start">Exponentiation is easy</text>
<rect x="94" y="340" width="72" height="58" rx="12" fill="#FFFFFF" stroke="#1F7A6A" stroke-width="1.2"/>
<text x="130" y="376" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="middle">X</text>
<line x1="168" y1="369" x2="182" y2="369" stroke="#1F7A6A" stroke-width="2"/>
<path d="M171.0 364.1 L182.0 369.0 L171.0 373.9" fill="none" stroke="#1F7A6A" stroke-width="2"/>
<rect x="186" y="340" width="72" height="58" rx="12" fill="#FFFFFF" stroke="#1F7A6A" stroke-width="1.2"/>
<text x="222" y="376" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="middle">x²</text>
