<text x="498" y="376" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="middle">Y</text>
<text x="94" y="444" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#1F1D1A" text-anchor="start">square-and-multiply: at most</text>
<text x="94" y="470" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#1F1D1A" text-anchor="start">2 log2 q multiplications.</text>
<rect x="94" y="520" width="210" height="42" rx="12" fill="#1F7A6A"/>
<text x="199.0" y="546.1" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">X → Y</text>
<text x="326" y="548" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">→  public value</text>
<rect x="656" y="174" width="520" height="470" rx="20" fill="#FBE7E3" stroke="#A33A32" stroke-width="1.2"/>
<text x="686" y="214" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="750" fill="#A33A32" text-anchor="start">REVERSE: given Y, find X</text>
<text x="686" y="258" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="26" font-weight="700" fill="#1F1D1A" text-anchor="start">X = log_a Y mod q</text>
<text x="686" y="294" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#A33A32" text-anchor="start">Discrete log is hard</text>
