<text x="314" y="376" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="18" font-weight="700" fill="#1F1D1A" text-anchor="middle">x⁴</text>
<line x1="352" y1="369" x2="366" y2="369" stroke="#1F7A6A" stroke-width="2"/>
