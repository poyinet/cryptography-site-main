<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="title desc">
<title id="title">两方在公开信道上得到同一个密钥</title>
<desc id="desc">各自保留秘密指数，只交换公开值；窃听者看到的是公开值，不是密钥。</desc>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1F1D1A" flood-opacity="0.075"/></filter></defs>
<rect width="1240" height="820" fill="#F7F5EF"/>
<text x="64" y="42" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#6B655C" text-anchor="start">DIFFIE–HELLMAN / 1976</text>
<text x="64" y="88" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="36" font-weight="750" fill="#1F1D1A" text-anchor="start">两方在公开信道上得到同一个密钥</text>
<text x="64" y="122" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">各自保留秘密指数，只交换公开值；窃听者看到的是公开值，不是密钥。</text>
<line x1="64" y1="146" x2="1176" y2="146" stroke="#DED9CE" stroke-width="1.5"/>
<rect x="356" y="186" width="528" height="274" rx="20" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.2"/>
<line x1="356" y1="222" x2="884" y2="222" stroke="#DED9CE" stroke-width="1"/>
<path d="M358 204 Q382 184 406 204 Q382 224 358 204 Z" fill="none" stroke="#A33A32" stroke-width="2.4"/>
<circle cx="382" cy="204" r="7" fill="#A33A32"/>
<circle cx="384" cy="202" r="2.5" fill="#FFFFFF"/>
<text x="408" y="209" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#A33A32" text-anchor="start">公开信道 · 可被窃听</text>
<rect x="64" y="174" width="260" height="286" rx="20" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="1.2" filter="url(#soft)"/>
<circle cx="106" cy="226" r="28" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="2"/>
<circle cx="106" cy="218" r="8" fill="#4B3F9E"/>
<path d="M91 246 Q106 228 121 246" fill="none" stroke="#4B3F9E" stroke-width="3"/>
<text x="150" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="750" fill="#1F1D1A" text-anchor="start">Alice</text>
<text x="150" y="242" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">secret holder</text>
<rect x="88" y="280" width="212" height="54" rx="12" fill="#ECE9FA"/>
<text x="194.0" y="312.1" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="15" font-weight="700" fill="#4B3F9E" text-anchor="middle">秘密指数 x_A</text>
<rect x="88" y="348" width="212" height="70" rx="12" fill="#F0EDE6"/>
<text x="102" y="366" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#6B655C" text-anchor="start">公开值</text>
<text x="102" y="388" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="15" font-weight="700" fill="#1F1D1A" text-anchor="start">Y_A = α^(x_A)</text>
<text x="102" y="406" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="12" font-weight="500" fill="#6B655C" text-anchor="start">mod q</text>
<rect x="916" y="174" width="260" height="286" rx="20" fill="#FFFFFF" stroke="#1F7A6A" stroke-width="1.2" filter="url(#soft)"/>
<circle cx="958" cy="226" r="28" fill="#FFFFFF" stroke="#1F7A6A" stroke-width="2"/>
<circle cx="958" cy="218" r="8" fill="#1F7A6A"/>
<path d="M943 246 Q958 228 973 246" fill="none" stroke="#1F7A6A" stroke-width="3"/>
<text x="1002" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="750" fill="#1F1D1A" text-anchor="start">Bob</text>
<text x="1002" y="242" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">secret holder</text>
<rect x="940" y="280" width="212" height="54" rx="12" fill="#E2F3EE"/>
<text x="1046.0" y="312.1" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="15" font-weight="700" fill="#1F7A6A" text-anchor="middle">秘密指数 x_B</text>
<rect x="940" y="348" width="212" height="70" rx="12" fill="#F0EDE6"/>
<text x="954" y="366" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#6B655C" text-anchor="start">公开值</text>
<text x="954" y="388" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="15" font-weight="700" fill="#1F1D1A" text-anchor="start">Y_B = α^(x_B)</text>
<text x="954" y="406" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="12" font-weight="500" fill="#6B655C" text-anchor="start">mod q</text>
<line x1="330" y1="346" x2="910" y2="346" stroke="#4B3F9E" stroke-width="3"/>
<path d="M899.0 341.1 L910.0 346.0 L899.0 350.9" fill="none" stroke="#4B3F9E" stroke-width="3"/>
<line x1="910" y1="420" x2="330" y2="420" stroke="#1F7A6A" stroke-width="3"/>
<path d="M341.0 424.9 L330.0 420.0 L341.0 415.1" fill="none" stroke="#1F7A6A" stroke-width="3"/>
<text x="620" y="332" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#4B3F9E" text-anchor="middle">发送 Y_A</text>
<text x="620" y="446" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F7A6A" text-anchor="middle">发送 Y_B</text>
<rect x="64" y="510" width="1112" height="230" rx="22" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.2" filter="url(#soft)"/>
<text x="94" y="550" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="750" fill="#1F1D1A" text-anchor="start">双方得到同一个密钥</text>
<text x="620" y="608" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="25" font-weight="700" fill="#4B3F9E" text-anchor="middle">K = Y_B^(x_A) = Y_A^(x_B) = α^(x_A·x_B) mod q</text>
<text x="620" y="648" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6B655C" text-anchor="middle">Alice 用自己的 x_A 与 Bob 的 Y_B 计算</text>
<text x="620" y="672" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6B655C" text-anchor="middle">Bob 用自己的 x_B 与 Alice 的 Y_A 计算</text>
<rect x="94" y="690" width="220" height="34" rx="12" fill="#ECE9FA"/>
<text x="204.0" y="711.08" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="12" font-weight="700" fill="#4B3F9E" text-anchor="middle">Y_B^(x_A)</text>
<rect x="926" y="690" width="220" height="34" rx="12" fill="#E2F3EE"/>
<text x="1036.0" y="711.08" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="12" font-weight="700" fill="#1F7A6A" text-anchor="middle">Y_A^(x_B)</text>
<line x1="64" y1="762" x2="1176" y2="762" stroke="#DED9CE" stroke-width="1"/>
<text x="64" y="788" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6B655C" text-anchor="start">论文记号：α 为固定本原元，q 为素数。图只画 1976 年论文的密钥分发，不画数字签名。</text>
<text x="1176" y="788" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8A8378" text-anchor="end">dh-new-directions-1976.txt:567-614</text>
<text x="1176" y="42" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A8378" text-anchor="end">FIG 1</text>
</svg>
