<text x="620" y="301" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">自适应查询 m_i → σ_i</text>
<line x1="320" y1="300" x2="520" y2="300" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
