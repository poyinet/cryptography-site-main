<text x="580" y="450" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#9B2C2C" text-anchor="middle">伪造输出 (m*, σ*)</text>
<text x="580" y="466" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">m* ∉ Q 且 Verify = 1</text>
<line x1="620" y1="385" x2="620" y2="430" stroke="#9B2C2C" stroke-width="2"  marker-end="url(#arrowRed)"/>
<text x="70" y="540" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="700" fill="#1F1D1A" text-anchor="left">EUF-CMA：存在性伪造；SUF-CMA：同一消息的新签名也不行</text>
<text x="70" y="570" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">GMR 1988：claw-free 置换 + 树形认证，伪造归约到分解</text>
</g>
<rect x="830" y="185" width="360" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<rect x="835" y="205" width="350" height="132" rx="12" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.2"/>
