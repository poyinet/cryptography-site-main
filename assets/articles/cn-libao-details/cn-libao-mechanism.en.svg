<rect width="1240" height="820" fill="#f6f3ea"/>
<rect x="28" y="24" width="1184" height="784" rx="18" fill="#fffdf7" stroke="#d8d2c4" stroke-width="1.5"/>
<text x="80" y="74" font-size="22" font-weight="700" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">Li Bao and Elliptic Curve Cryptography</text>
<text x="82" y="104" font-size="14" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6c7486">Lattices, automata, elliptic curves and MPC · formula-level mechanism</text>
<rect x="80" y="120" width="1080" height="1" fill="#ded8c8"/>
<text x="82" y="144" font-size="12" letter-spacing="1.2" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">FORMULA LEVEL · REPRODUCIBLE, TRACEABLE, COMPARABLE</text>
<rect x="80" y="170" width="250" height="150" rx="10" fill="#fffaf0" stroke="#c8a24b" stroke-width="1.2"/>
<circle cx="106" cy="196" r="14" fill="#c8a24b"/>
<text x="106" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">1</text>
<text x="128" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">Step 1</text>
<text x="104" y="232" font-size="13" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">choose curve and base</text>
<text x="104" y="252" font-size="13" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">point</text>
<text x="104" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">definition / input</text>
<rect x="350" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="376" cy="196" r="14" fill="#14213d"/>
<text x="376" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">2</text>
<text x="398" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">Step 2</text>
<text x="374" y="232" font-size="13" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">scalar multiply Q=[k]P</text>
<text x="374" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">transform / equation</text>
<rect x="620" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="646" cy="196" r="14" fill="#14213d"/>
<text x="646" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">3</text>
<text x="668" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">Step 3</text>
<text x="644" y="232" font-size="13" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">ECDH shared point</text>
<text x="644" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">observe / decode</text>
<rect x="890" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="916" cy="196" r="14" fill="#14213d"/>
<text x="916" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">4</text>
<text x="938" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">Step 4</text>
<text x="914" y="232" font-size="13" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">encode/hash to curve</text>
<text x="914" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">boundary / result</text>
<rect x="80" y="350" width="1080" height="200" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<text x="102" y="382" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">Core formulas and scales</text>
<text x="112" y="424" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">E/F_p: y^2 = x^3 + a x + b, Δ = 4a^3+27b^2 ≠ 0</text>
<text x="112" y="442" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Q = [k] P; ECDLP: find k</text>
<text x="112" y="460" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">SM2: p, n 256-bit; G=(x_G,y_G)</text>
<text x="112" y="478" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">ECDH: S = [d_A] Q_B = [d_A d_B] G</text>
<text x="112" y="496" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">φ: F_q -&gt; E(F_q), time O(log^3 q)</text>
<text x="112" y="514" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">MOV: e(P,Q) -&gt; F_(p^k)^*, if k small</text>
<rect x="80" y="570" width="1080" height="190" rx="10" fill="#fbfaf4" stroke="#ded8c8" stroke-width="1.2"/>
<text x="102" y="590" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">Detail / parameters / boundary</text>
<text x="112" y="614" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">Elliptic-curve points add by the chord-and-tangent rule, and scalar multiplication [k]P uses a chain of doublings</text>
<text x="112" y="632" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">and additions; the public key Q exposes a point while the secret k is the discrete logarithm. SM2 builds signature,</text>
<text x="112" y="650" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">key exchange and encryption on this point group; hashing to a curve first maps an arbitrary string to a finite</text>
<text x="112" y="668" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">field, then uses a deterministic encoding φ to find a point, with retry handling.</text>
<text x="112" y="688" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">SM2: 256-bit prime field, curve y^2=x^3+ax+b, base point G and order n; cofactor h=1, prime-order point group.</text>
<text x="112" y="706" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">Huff encoding: φ: F_q→E(F_q), time O(log^3 q); 557.8 microseconds on the SM2 recommended prime field.</text>
<text x="112" y="724" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">Boundary: curve parameters, embedding degree, point validation and implementation protection must be checked together;</text>
<text x="80" y="774" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">Original formula-level mechanism diagram (drawn from the SM2 parameter draft, the 2014 JUSTC paper and the 2018 survey)</text>
<text x="80" y="790" font-size="11.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6f7788">Verify the curve, base point and point first, then ECDH/signature and hashing to curve; the diagram does not replace the standard,</text>
<text x="80" y="806" font-size="11.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6f7788">papers or an implementation audit.</text>
<text x="1160" y="806" text-anchor="end" font-size="10" font-family="ui-monospace, Consolas, monospace" fill="#a39c8a">R127 · 2026-11-23 · cn-libao-details</text>
</svg>