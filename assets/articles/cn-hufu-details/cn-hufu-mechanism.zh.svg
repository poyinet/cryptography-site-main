<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-label="虎符 mechanism chain"><rect width="1240" height="700" fill="#fbf8f1"/><text x="42" y="62" font-family="Georgia,Noto Serif SC,serif" font-size="34" font-weight="700" fill="#2d2a24">虎符</text><text x="42" y="96" font-family="Inter,Noto Sans SC,sans-serif" font-size="16" fill="#7a6f5f">机制链：输入、处理、输出与边界</text><rect x="42" y="150" width="256" height="150" rx="16" fill="#f6e7d7" stroke="#cfc4b4"/><text x="62" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#8a5a3b">步骤 1</text><text x="62" y="222" font-family="Inter,Noto Sans SC,sans-serif" font-size="22" font-weight="600" fill="#2d2a24">定义</text><path d="M306 225 L332 225" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="342" y="150" width="256" height="150" rx="16" fill="#e4efe6" stroke="#cfc4b4"/><text x="362" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#8a5a3b">步骤 2</text><text x="362" y="222" font-family="Inter,Noto Sans SC,sans-serif" font-size="22" font-weight="600" fill="#2d2a24">输入</text><path d="M606 225 L632 225" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="642" y="150" width="256" height="150" rx="16" fill="#e6e9f5" stroke="#cfc4b4"/><text x="662" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#8a5a3b">步骤 3</text><text x="662" y="222" font-family="Inter,Noto Sans SC,sans-serif" font-size="22" font-weight="600" fill="#2d2a24">操作</text><path d="M906 225 L932 225" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="942" y="150" width="256" height="150" rx="16" fill="#f3e3ea" stroke="#cfc4b4"/><text x="962" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#8a5a3b">步骤 4</text><text x="962" y="222" font-family="Inter,Noto Sans SC,sans-serif" font-size="22" font-weight="600" fill="#2d2a24">边界</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a89a86"/></marker></defs><rect x="42" y="342" width="1156" height="150" rx="14" fill="#fffdf8" stroke="#d8cfc2"/><text x="62" y="374" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#8a5a3b">机制判据 / 公式位置</text><text x="62" y="408" font-family="ui-monospace,SFMono-Regular,monospace" font-size="20" fill="#2d2a24">定义 → 输入 → 操作 → 边界</text><text x="62" y="462" font-family="Inter,Noto Sans SC,sans-serif" font-size="16" fill="#4a433a">虎符把军事命令权分成两半，持有者合符才能调兵，是以物证绑定权限的古典机制。</text><text x="42" y="540" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#8a5a3b">读法</text><text x="42" y="572" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" fill="#4a433a">沿四步读出输入、变换、输出与失败条件；图中不代替标准条文或参数复算。</text><text x="42" y="638" font-family="Inter,Noto Sans SC,sans-serif" font-size="12" fill="#8b7d6b">原创机制示意图 · CC BY 4.0 · poyi knowledge · 2026-11-22</text></svg>