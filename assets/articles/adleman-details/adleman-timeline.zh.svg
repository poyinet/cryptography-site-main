<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" role="img" aria-labelledby="title desc">
<title id="title">阿德曼与 RSA 的可断代坐标</title>
<desc id="desc">时间线：1977 年 4 月 4 日投稿、1977 年 9 月 1 日修订、1978 年 2 月在 CACM 21(2) 发表。</desc>
<rect width="1400" height="560" fill="#F7F5EF"/>
<text x="70" y="70" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">阿德曼与 RSA 的可断代坐标</text>
<text x="70" y="106" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">这条线只断代共同工作，不把 1977 年手稿说成 1977 年出版。</text>
<line x1="100" y1="286" x2="1300" y2="286" stroke="#DED9CE" stroke-width="3"/>
<circle cx="235" cy="286" r="18" fill="#ECE8FF" stroke="#6D5BD0" stroke-width="3"/>
<text x="235" y="240" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="22" font-weight="700" fill="#6D5BD0" text-anchor="middle">1977-04-04</text>
<text x="235" y="334" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="middle">投稿</text>
<text x="235" y="366" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="middle">论文文末：Received April 4, 1977</text>
<circle cx="700" cy="286" r="18" fill="#E3F4EE" stroke="#2E7D6B" stroke-width="3"/>
<text x="700" y="240" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="22" font-weight="700" fill="#2E7D6B" text-anchor="middle">1977-09-01</text>
<text x="700" y="334" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="middle">修订</text>
<text x="700" y="366" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="middle">论文文末：revised September 1, 1977</text>
<circle cx="1165" cy="286" r="18" fill="#FFF4CF" stroke="#8A6A00" stroke-width="3"/>
<text x="1165" y="240" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="22" font-weight="700" fill="#8A6A00" text-anchor="middle">1978-02</text>
<text x="1165" y="334" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="middle">发表</text>
<text x="1165" y="366" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="middle">CACM 21 卷 2 期，120–126 页</text>
<rect x="60" y="410" width="1280" height="78" rx="16" fill="#FFFFFF" stroke="#E7D9A8" stroke-width="1.5"/>
<text x="88" y="444" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">读图：1977 是投稿与修订年，1978 才是发表年。</text>
<text x="88" y="470" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">证据：RSA 论文第 265 行；参考出处题录的 CACM 21(2), February 1978, pp. 120–126。</text>
