<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" role="img" aria-labelledby="title desc">
<title id="title">The RSA paper byline: Rivest, Shamir, Adleman</title>
<desc id="desc">Diagram: the RSA paper title, CACM 21(2) citation and three co-authors; the footer says a joint byline does not assign RSA to one person.</desc>
<rect width="1400" height="700" fill="#F7F5EF"/>
<text x="70" y="70" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">The RSA paper byline: Rivest, Shamir, Adleman</text>
<text x="70" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">HAC lines 76–77 position RSA as a joint discovery by three authors; this person row adds no biography the sources do not print.</text>
<rect x="60" y="150" width="400" height="220" rx="18" fill="#FFFFFF"/>
<rect x="80" y="168" width="112" height="34" rx="12" fill="#ECE8FF"/>
<text x="136.0" y="191.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="middle">co-author</text>
<text x="80" y="250" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="27" font-weight="700" fill="#1F1D1A" text-anchor="start">R. L. Rivest</text>
<text x="80" y="286" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">RSA paper co-author</text>
<text x="80" y="328" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="start">joint contribution only</text>
<rect x="500" y="150" width="400" height="220" rx="18" fill="#FFFFFF"/>
<rect x="520" y="168" width="112" height="34" rx="12" fill="#ECE8FF"/>
<text x="576.0" y="191.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="middle">co-author</text>
<text x="520" y="250" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="27" font-weight="700" fill="#1F1D1A" text-anchor="start">A. Shamir</text>
<text x="520" y="286" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">RSA paper co-author</text>
<text x="520" y="328" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="start">joint contribution only</text>
<rect x="940" y="150" width="400" height="220" rx="18" fill="#FFFFFF"/>
<rect x="960" y="168" width="112" height="34" rx="12" fill="#ECE8FF"/>
<text x="1016.0" y="191.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="middle">co-author</text>
<text x="960" y="250" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="27" font-weight="700" fill="#1F1D1A" text-anchor="start">L. Adleman</text>
<text x="960" y="286" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">RSA paper co-author</text>
<text x="960" y="328" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="start">joint contribution only</text>
<rect x="60" y="410" width="1280" height="112" rx="16" fill="#FFF4CF" stroke="#E7D9A8" stroke-width="1.5"/>
<text x="88" y="446" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#1F1D1A" text-anchor="start">A Method for Obtaining Digital Signatures</text>
<text x="88" y="476" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#1F1D1A" text-anchor="start">and Public-Key Cryptosystems</text>
<text x="88" y="504" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#8A6A00" text-anchor="start">Communications of the ACM 21(2), February 1978, pp. 120–126</text>
<rect x="60" y="550" width="1280" height="78" rx="16" fill="#FFFFFF" stroke="#E7D9A8" stroke-width="1.5"/>
<text x="88" y="584" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">How to read it: a joint byline does not assign RSA to one person; the three names are authors of one paper, not three separate algorithms.</text>
<text x="88" y="610" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">Evidence: HAC lines 76–77; RSA paper lines 1–7 and 261–265.</text>
<text x="88" y="680" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">Original diagram, CC BY 4.0.</text>
</svg>
