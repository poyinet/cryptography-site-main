<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" role="img" aria-labelledby="title desc">
<title id="title">RSA 论文的三人署名：Rivest、Shamir、Adleman</title>
<desc id="desc">示意图：RSA 论文题名、CACM 21(2) 出处与三位共同作者；底部说明共同署名不等于把 RSA 归给单个人物。</desc>
<rect width="1400" height="700" fill="#F7F5EF"/>
<text x="70" y="70" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">RSA 论文的三人署名：Rivest、Shamir、Adleman</text>
<text x="70" y="106" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">HAC 第 76–77 行把 RSA 定位为三人共同发现；本人物行不补来源未印出的传记。</text>
<rect x="60" y="150" width="400" height="220" rx="18" fill="#FFFFFF"/>
<rect x="80" y="168" width="112" height="34" rx="12" fill="#ECE8FF"/>
<text x="136.0" y="191.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="middle">共同署名</text>
<text x="80" y="250" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="27" font-weight="700" fill="#1F1D1A" text-anchor="start">R. L. Rivest</text>
<text x="80" y="286" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">RSA 论文共同作者</text>
<text x="80" y="328" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="start">只记录共同贡献</text>
<rect x="500" y="150" width="400" height="220" rx="18" fill="#FFFFFF"/>
<rect x="520" y="168" width="112" height="34" rx="12" fill="#ECE8FF"/>
<text x="576.0" y="191.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="middle">共同署名</text>
<text x="520" y="250" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="27" font-weight="700" fill="#1F1D1A" text-anchor="start">A. Shamir</text>
<text x="520" y="286" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">RSA 论文共同作者</text>
<text x="520" y="328" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="start">只记录共同贡献</text>
<rect x="940" y="150" width="400" height="220" rx="18" fill="#FFFFFF"/>
<rect x="960" y="168" width="112" height="34" rx="12" fill="#ECE8FF"/>
<text x="1016.0" y="191.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="middle">共同署名</text>
<text x="960" y="250" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="27" font-weight="700" fill="#1F1D1A" text-anchor="start">L. Adleman</text>
<text x="960" y="286" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">RSA 论文共同作者</text>
<text x="960" y="328" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="start">只记录共同贡献</text>
<rect x="60" y="410" width="1280" height="112" rx="16" fill="#FFF4CF" stroke="#E7D9A8" stroke-width="1.5"/>
<text x="88" y="446" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#1F1D1A" text-anchor="start">论文题名</text>
<text x="88" y="476" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700" fill="#1F1D1A" text-anchor="start">A Method for Obtaining Digital Signatures and Public-Key Cryptosystems</text>
<text x="88" y="504" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#8A6A00" text-anchor="start">《Communications of the ACM》21 卷 2 期，1978 年 2 月，120–126 页</text>
<rect x="60" y="550" width="1280" height="78" rx="16" fill="#FFFFFF" stroke="#E7D9A8" stroke-width="1.5"/>
<text x="88" y="584" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">读图：共同署名不等于把 RSA 归给单个人物；三个人名是同一篇论文的作者，不是三种独立算法。</text>
<text x="88" y="610" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">证据：HAC 第 76–77 行；RSA 论文第 1–7、261–265 行。</text>
<text x="88" y="680" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">原创示意图，CC BY 4.0。</text>
</svg>
