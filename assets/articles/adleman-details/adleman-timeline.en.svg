<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" role="img" aria-labelledby="title desc">
<title id="title">Adleman and RSA: datable coordinates</title>
<desc id="desc">Timeline: submission on 4 April 1977, revision on 1 September 1977, publication in CACM 21(2) in February 1978.</desc>
<rect width="1400" height="560" fill="#F7F5EF"/>
<text x="70" y="70" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">Adleman and RSA: datable coordinates</text>
<text x="70" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">This line dates the joint work only; it does not turn the 1977 manuscript into a 1977 publication.</text>
<line x1="100" y1="286" x2="1300" y2="286" stroke="#DED9CE" stroke-width="3"/>
<circle cx="235" cy="286" r="18" fill="#ECE8FF" stroke="#6D5BD0" stroke-width="3"/>
<text x="235" y="240" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="22" font-weight="700" fill="#6D5BD0" text-anchor="middle">1977-04-04</text>
<text x="235" y="334" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="middle">submitted</text>
<text x="235" y="366" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="middle">Received April 4, 1977</text>
<circle cx="700" cy="286" r="18" fill="#E3F4EE" stroke="#2E7D6B" stroke-width="3"/>
<text x="700" y="240" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="22" font-weight="700" fill="#2E7D6B" text-anchor="middle">1977-09-01</text>
<text x="700" y="334" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="middle">revised</text>
<text x="700" y="366" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="middle">revised September 1, 1977</text>
<circle cx="1165" cy="286" r="18" fill="#FFF4CF" stroke="#8A6A00" stroke-width="3"/>
<text x="1165" y="240" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="22" font-weight="700" fill="#8A6A00" text-anchor="middle">1978-02</text>
<text x="1165" y="334" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="middle">published</text>
<text x="1165" y="366" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="middle">CACM 21(2), pp. 120–126</text>
<rect x="60" y="410" width="1280" height="78" rx="16" fill="#FFFFFF" stroke="#E7D9A8" stroke-width="1.5"/>
<text x="88" y="444" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">How to read it: 1977 is the submission and revision year; 1978 is the publication year.</text>
<text x="88" y="470" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">Evidence: RSA paper line 265; bibliographic record CACM 21(2), February 1978, pp. 120–126.</text>
<text x="88" y="532" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">Original diagram, CC BY 4.0.</text>
</svg>
