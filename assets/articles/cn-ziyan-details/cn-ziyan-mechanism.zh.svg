<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="字验 mechanism"><rect width="1240" height="820" fill="#fbf8f1"/><text x="42" y="58" font-family="Georgia,Noto Serif SC,serif" font-size="32" font-weight="700" fill="#2d2a24">字验</text><text x="42" y="90" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#7a6f5f">公式级机制：步骤、参数、适用与失效边界</text><rect x="42" y="126" width="256" height="120" rx="16" fill="#f6e7d7" stroke="#cfc4b4"/><text x="60" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 1</text><text x="60" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">选定四十字诗</text><path d="M306 186 L332 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="342" y="126" width="256" height="120" rx="16" fill="#e4efe6" stroke="#cfc4b4"/><text x="360" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 2</text><text x="360" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">军务逐条配字</text><path d="M606 186 L632 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="642" y="126" width="256" height="120" rx="16" fill="#e6e9f5" stroke="#cfc4b4"/><text x="660" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 3</text><text x="660" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">书信中藏字加印</text><path d="M906 186 L932 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="942" y="126" width="256" height="120" rx="16" fill="#f3e3ea" stroke="#cfc4b4"/><text x="960" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 4</text><text x="960" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">按诗定位查表</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a89a86"/></marker></defs><rect x="42" y="272" width="1156" height="204" rx="14" fill="#fffdf8" stroke="#d8cfc2"/><text x="62" y="300" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">核心公式</text><text x="62" y="320" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">C = {c₁,...,c₄₀}, |C|=40, no repeated character</text><text x="62" y="342" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">f: I → C, |I|≈40, bijection on the table</text><text x="62" y="364" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">encode(m)=π(i), decode(c)=π⁻¹(c)</text><text x="62" y="386" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">H(m) ≤ log2 40 ≈ 5.32 bit per symbol</text><text x="62" y="408" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">cover text is an ordinary letter; key = poem + order table</text><text x="62" y="444" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">字验把约四十条军务各配一个不同的字，再把这首诗当作“密码本”。发信人只在普通书信里写下对应的字并加印记；收信人按诗定位第几字，再查军务表恢复命令。</text><rect x="42" y="496" width="1156" height="190" rx="14" fill="#f8f4eb" stroke="#d8cfc2"/><text x="62" y="524" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">参数与边界</text><text x="62" y="548" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">码本：约 40 条军务、40 字诗，诗中不得重字；诗与军务表由主将和将领各持一本。</text><text x="62" y="592" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">编码：每条约 5.32 bit 上界；印记标出选中字，普通书信提供掩护。</text><text x="62" y="636" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">边界：只能表达表内约 40 条命令；诗或表泄露、诗中重字、印记被识别都会失效。</text><text x="42" y="714" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#4a433a">读法：先核对码本、分片与乱数假设，再检查消息集、共享文本与失效条件；图不替代《六韬》《武经总要》原文或党史考证。</text><text x="42" y="786" font-family="Inter,Noto Sans SC,sans-serif" font-size="12" fill="#8b7d6b">原创公式级机制图 · CC BY 4.0 · poyi knowledge · 2026-11-23</text></svg>