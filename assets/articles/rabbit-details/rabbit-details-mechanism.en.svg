<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Rabbit: counters and coupled squares</title>
<desc id="fig-desc">Core path: key setup → IV mixing → counters and squaring — mechanism schematic with parameters, use and limits.</desc>
<defs>
      <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4B3F9E"/></marker>
      <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1F7A6A"/></marker>
      <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8A6100"/></marker>
      <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9B2C2C"/></marker>
      <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B655C"/></marker>
      <clipPath id="mainClip"><rect x="50" y="185" width="760" height="450" rx="16"/></clipPath>
    </defs>
<rect x="0" y="0" width="1240" height="820" fill="#F7F5EF"/>
<text x="60" y="52" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#6B655C" text-anchor="left">Algorithm · software stream cipher</text>
<text x="60" y="104" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="38" font-weight="800" fill="#1F1D1A" text-anchor="left">Rabbit: counters and coupled squares</text>
<text x="60" y="143" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#6B655C" text-anchor="left">Eight state words and eight counters form a 513-bit state; key and IV are mixed before 128-bit output blocks.</text>
<rect x="50" y="185" width="760" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="78" y="224" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="800" fill="#1F1D1A" text-anchor="left">Core path: key setup → IV mixing → counters and squaring</text>
<g clip-path="url(#mainClip)">
<rect x="80" y="250" width="140" height="50" rx="10" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="150" y="272" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#4B3F9E" text-anchor="middle">K</text>
<text x="150" y="291" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">128 bit</text>
<rect x="250" y="250" width="160" height="50" rx="10" fill="#FFFFFF" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="330" y="272" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#1F7A6A" text-anchor="middle">8 × 16 bit</text>
<text x="330" y="291" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">subkeys interleaved</text>
<rect x="450" y="242" width="190" height="68" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="545" y="264" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#1F7A6A" text-anchor="middle">X0..X7</text>
<text x="545" y="283" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">C0..C7 + carry · 513 bit</text>
<rect x="80" y="322" width="140" height="50" rx="10" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="150" y="344" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#4B3F9E" text-anchor="middle">IV</text>
<text x="150" y="363" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">64 bit</text>
<rect x="250" y="322" width="160" height="50" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="330" y="344" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#8A6100" text-anchor="middle">C_j ^= IV</text>
<text x="330" y="363" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">iterate 4 more times</text>
<rect x="670" y="252" width="100" height="52" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="720" y="272" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">4 rounds</text>
<text x="720" y="288" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">key setup</text>
<rect x="410" y="390" width="300" height="64" rx="10" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="560" y="412" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#4B3F9E" text-anchor="middle">per clock: C += a; g=(x+c)^2; mix X</text>
<text x="560" y="431" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">output 128 bit</text>
<rect x="742" y="400" width="60" height="44" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="772" y="427" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">128 bit</text>
<line x1="220" y1="275" x2="250" y2="275" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<line x1="410" y1="275" x2="450" y2="275" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<line x1="220" y1="347" x2="250" y2="347" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<line x1="410" y1="347" x2="470" y2="310" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<line x1="640" y1="280" x2="670" y2="280" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<line x1="545" y1="310" x2="545" y2="390" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<line x1="710" y1="422" x2="742" y2="422" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<text x="80" y="487" font-family="'Consolas','SFMono-Regular',monospace" font-size="13" font-weight="500" fill="#6B655C" text-anchor="left">gⱼ = (xⱼ + cⱼ)²; eight state words combine into a 128-bit block</text>
<text x="80" y="510" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">Counter constants a = 0x4D34D34D / 0xD34D34D3 / 0x34D34D34 in rotation.</text>
</g>
<rect x="830" y="185" width="360" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<rect x="835" y="205" width="350" height="122" rx="12" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.2"/>
<text x="851" y="229" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#4B3F9E" text-anchor="left">Parameters</text>
<circle cx="854" cy="250" r="2.5" fill="#4B3F9E"/>
<text x="864" y="254" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">Key 128 / IV 64 bit</text>
<circle cx="854" cy="275" r="2.5" fill="#4B3F9E"/>
<text x="864" y="279" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">513-bit state</text>
<circle cx="854" cy="300" r="2.5" fill="#4B3F9E"/>
<text x="864" y="304" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">8 state words + 8 counters</text>
<rect x="835" y="347" width="350" height="122" rx="12" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.2"/>
<text x="851" y="371" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#1F7A6A" text-anchor="left">Use</text>
<circle cx="854" cy="392" r="2.5" fill="#1F7A6A"/>
<text x="864" y="396" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">RFC 4503; eSTREAM</text>
<circle cx="854" cy="417" r="2.5" fill="#1F7A6A"/>
<text x="864" y="421" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">High-speed software stream</text>
<circle cx="854" cy="442" r="2.5" fill="#1F7A6A"/>
<text x="864" y="446" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">Not a TLS cipher suite</text>
<rect x="835" y="489" width="350" height="122" rx="12" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.2"/>
<text x="851" y="513" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#8A6100" text-anchor="left">Boundary</text>
<circle cx="854" cy="534" r="2.5" fill="#8A6100"/>
<text x="864" y="538" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">64-bit IV collision risk</text>
<circle cx="854" cy="559" r="2.5" fill="#8A6100"/>
<text x="864" y="563" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">No auth; fault-injection risk</text>
<circle cx="854" cy="584" r="2.5" fill="#8A6100"/>
<text x="864" y="588" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">Design limit about 2^64 bytes</text>
<rect x="78" y="586" width="200" height="32" rx="16" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1"/>
<text x="178" y="607" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="600" fill="#4B3F9E" text-anchor="middle">513-bit state</text>
<rect x="296" y="586" width="200" height="32" rx="16" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1"/>
<text x="396" y="607" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="600" fill="#4B3F9E" text-anchor="middle">128 bit per clock</text>
<rect x="514" y="586" width="200" height="32" rx="16" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1"/>
<text x="614" y="607" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="600" fill="#4B3F9E" text-anchor="middle">64-bit IV</text>
<rect x="50" y="660" width="1140" height="105" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="74" y="690" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="800" fill="#4B3F9E" text-anchor="left">How to read this figure</text>
<text x="74" y="716" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">See how the key becomes eight 16-bit subkeys in X/C, how the IV is XORed into the counters, and how g=(x+c)^2</text>
<text x="74" y="739" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">plus carries drive the 128-bit output.</text>
