<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Rabbit：计数器加平方耦合</title>
<desc id="fig-desc">核心路径：密钥装载 → IV 混合 → 计数器与平方函数 — mechanism schematic with parameters, use and limits.</desc>
<defs>
      <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4B3F9E"/></marker>
      <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1F7A6A"/></marker>
      <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8A6100"/></marker>
      <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9B2C2C"/></marker>
      <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B655C"/></marker>
      <clipPath id="mainClip"><rect x="50" y="185" width="760" height="450" rx="16"/></clipPath>
    </defs>
<rect x="0" y="0" width="1240" height="820" fill="#F7F5EF"/>
<text x="60" y="52" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#6B655C" text-anchor="left">算法 · 软件流密码</text>
<text x="60" y="104" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="38" font-weight="800" fill="#1F1D1A" text-anchor="left">Rabbit：计数器加平方耦合</text>
<text x="60" y="143" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#6B655C" text-anchor="left">8 个状态字与 8 个计数器组成 513 位状态，密钥与 IV 先混合，再逐拍输出 128 位。</text>
<rect x="50" y="185" width="760" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="78" y="224" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="800" fill="#1F1D1A" text-anchor="left">核心路径：密钥装载 → IV 混合 → 计数器与平方函数</text>
<g clip-path="url(#mainClip)">
<rect x="80" y="250" width="140" height="50" rx="10" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="150" y="272" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#4B3F9E" text-anchor="middle">K</text>
<text x="150" y="291" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">128 bit</text>
<rect x="250" y="250" width="160" height="50" rx="10" fill="#FFFFFF" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="330" y="272" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#1F7A6A" text-anchor="middle">8 × 16 bit</text>
<text x="330" y="291" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">子密钥交叉拼接</text>
<rect x="450" y="242" width="190" height="68" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="545" y="264" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#1F7A6A" text-anchor="middle">X0..X7</text>
<text x="545" y="283" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">C0..C7 + carry · 513 bit</text>
<rect x="80" y="322" width="140" height="50" rx="10" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="150" y="344" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#4B3F9E" text-anchor="middle">IV</text>
<text x="150" y="363" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">64 bit</text>
<rect x="250" y="322" width="160" height="50" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="330" y="344" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#8A6100" text-anchor="middle">C_j ^= IV</text>
<text x="330" y="363" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">再迭代 4 次</text>
<rect x="670" y="252" width="100" height="52" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="720" y="272" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">4 轮</text>
<text x="720" y="288" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">key setup</text>
<rect x="410" y="390" width="300" height="64" rx="10" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="560" y="412" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#4B3F9E" text-anchor="middle">每拍：C += a；g=(x+c)^2；X 混合</text>
<text x="560" y="431" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">输出 128 bit</text>
<rect x="742" y="400" width="60" height="44" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="772" y="427" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">128 bit</text>
<line x1="220" y1="275" x2="250" y2="275" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<line x1="410" y1="275" x2="450" y2="275" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<line x1="220" y1="347" x2="250" y2="347" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<line x1="410" y1="347" x2="470" y2="310" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<line x1="640" y1="280" x2="670" y2="280" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<line x1="545" y1="310" x2="545" y2="390" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<line x1="710" y1="422" x2="742" y2="422" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<text x="80" y="487" font-family="'Consolas','SFMono-Regular',monospace" font-size="13" font-weight="500" fill="#6B655C" text-anchor="left">gⱼ = (xⱼ + cⱼ)²；8 个状态字两两异或成 128 位块</text>
<text x="80" y="510" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">计数器常数 a = 0x4D34D34D / 0xD34D34D3 / 0x34D34D34 循环。</text>
</g>
<rect x="830" y="185" width="360" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<rect x="835" y="205" width="350" height="122" rx="12" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.2"/>
<text x="851" y="229" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#4B3F9E" text-anchor="left">参数</text>
