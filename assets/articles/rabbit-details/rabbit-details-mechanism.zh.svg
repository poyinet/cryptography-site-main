<text x="864" y="254" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">K 128 / IV 64 bit</text>
<circle cx="854" cy="275" r="2.5" fill="#4B3F9E"/>
<text x="864" y="279" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">状态 513 bit</text>
<circle cx="854" cy="300" r="2.5" fill="#4B3F9E"/>
<text x="864" y="304" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">8 状态字 + 8 计数器</text>
<rect x="835" y="347" width="350" height="122" rx="12" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.2"/>
<text x="851" y="371" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#1F7A6A" text-anchor="left">用途</text>
<circle cx="854" cy="392" r="2.5" fill="#1F7A6A"/>
<text x="864" y="396" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">RFC 4503；eSTREAM</text>
<circle cx="854" cy="417" r="2.5" fill="#1F7A6A"/>
<text x="864" y="421" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">高速软件流密码</text>
<circle cx="854" cy="442" r="2.5" fill="#1F7A6A"/>
<text x="864" y="446" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">非 TLS 标准套件</text>
<rect x="835" y="489" width="350" height="122" rx="12" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.2"/>
<text x="851" y="513" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#8A6100" text-anchor="left">边界</text>
