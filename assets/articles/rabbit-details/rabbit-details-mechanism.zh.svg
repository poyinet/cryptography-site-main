<text x="614" y="607" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="600" fill="#4B3F9E" text-anchor="middle">64 bit IV</text>
<rect x="50" y="660" width="1140" height="105" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="74" y="690" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="800" fill="#4B3F9E" text-anchor="left">怎么读这张图</text>
<text x="74" y="716" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">先看密钥如何拆成 8 个 16 位子密钥并装进 X/C，再看 IV 如何异或进计数器，最后看 g=(x+c)^2 和进位怎样驱动</text>
<text x="74" y="739" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">128 位输出。</text>
