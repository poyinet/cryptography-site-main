<text x="864" y="563" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">无认证；故障注入风险</text>
<circle cx="854" cy="584" r="2.5" fill="#8A6100"/>
<text x="864" y="588" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">设计上限约 2^64 字节</text>
<rect x="78" y="586" width="200" height="32" rx="16" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1"/>
<text x="178" y="607" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="600" fill="#4B3F9E" text-anchor="middle">513 bit 状态</text>
<rect x="296" y="586" width="200" height="32" rx="16" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1"/>
