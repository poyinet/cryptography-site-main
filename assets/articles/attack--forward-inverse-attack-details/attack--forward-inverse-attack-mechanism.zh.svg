<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="正反向中间相遇攻击 mechanism"><rect width="1240" height="820" fill="#fbf8f1"/><text x="42" y="58" font-family="Georgia,Noto Serif SC,serif" font-size="32" font-weight="700" fill="#2d2a24">正反向中间相遇攻击</text><text x="42" y="90" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#7a6f5f">公式级机制：步骤、参数、适用与失效边界</text><rect x="42" y="126" width="256" height="120" rx="16" fill="#f6e7d7" stroke="#cfc4b4"/><text x="60" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 1</text><text x="60" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">建立双密钥组合</text><path d="M306 186 L332 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="342" y="126" width="256" height="120" rx="16" fill="#e4efe6" stroke="#cfc4b4"/><text x="360" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 2</text><text x="360" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">正向建表</text><path d="M606 186 L632 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="642" y="126" width="256" height="120" rx="16" fill="#e6e9f5" stroke="#cfc4b4"/><text x="660" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 3</text><text x="660" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">反向扫描</text><path d="M906 186 L932 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="942" y="126" width="256" height="120" rx="16" fill="#f3e3ea" stroke="#cfc4b4"/><text x="960" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 4</text><text x="960" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">第二对过滤</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a89a86"/></marker></defs><rect x="42" y="272" width="1156" height="204" rx="14" fill="#fffdf8" stroke="#d8cfc2"/><text x="62" y="300" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">核心公式</text><text x="62" y="320" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">C=E_{K2}(E_{K1}(P))</text><text x="62" y="342" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">T={(E_{K1}(P),K1): K1∈{0,1}^k}</text><text x="62" y="364" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">D_{K2}(C)=X ⇒ (K1,K2) candidate</text><text x="62" y="386" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">Time≈2^k+2^k=2^{k+1}, Memory=2^k</text><text x="62" y="408" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">False alarms≈2^{2k−n}; k=56 ⇒ 2^57 ops, 2^56 states</text><text x="62" y="444" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">把 2^{2k} 个密钥对拆成两端各 2^k 个单密钥；中间状态必须可比较，第二个明密文对负责过滤误报。</text><rect x="42" y="496" width="1156" height="190" rx="14" fill="#f8f4eb" stroke="#d8cfc2"/><text x="62" y="524" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">参数与边界</text><text x="62" y="548" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">适用：双密钥双重加密、可串联的分组密码、已知一个明密文对。</text><text x="62" y="592" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">双 DES：k=56，时间约 2^57 次分组运算，内存约 2^56 个中间状态，误报约 2^{112−64}=2^48。</text><text x="62" y="636" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">边界：三重独立密钥不直接适用；建表内存与预计算成本必须计入，不能只报时间。</text><text x="42" y="714" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#4a433a">读法：先核对假设、攻击模型与参数，再检查密钥调度、数据量与失效条件；图不替代论文定理或历史原文。</text><text x="42" y="786" font-family="Inter,Noto Sans SC,sans-serif" font-size="12" fill="#8b7d6b">原创公式级机制图 · CC BY 4.0 · poyi knowledge · 2026-11-23</text></svg>