<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">变换能做什么，不能做什么</title>
<desc id="fig-desc">W0a · 适用范围 · 变换能做什么，不能做什么</desc>
<rect x="0" y="0" width="1240" height="820" rx="0" fill="#F7F5EF"/>
<text x="60" y="54" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#6B655C" text-anchor="start">W0a · 适用范围</text>
<text x="60" y="112" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="44" font-weight="800" fill="#1F1D1A" text-anchor="start">变换能做什么，不能做什么</text>
<rect x="60" y="225" width="360" height="505" rx="24" fill="#FFFFFF" stroke="#1F7A6A" stroke-width="2"/>
<rect x="61" y="226" width="358" height="66" rx="22" fill="#E2F3EE"/>
<text x="84" y="268" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="800" fill="#1F7A6A" text-anchor="start">提供</text>
<circle cx="84" cy="323" r="5" fill="#1F7A6A"/>
<text x="102" y="330" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">把公开挑战换成哈希</text>
<circle cx="84" cy="369" r="5" fill="#1F7A6A"/>
<text x="102" y="376" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">把 Σ 协议压成一条消息</text>
<circle cx="84" cy="415" r="5" fill="#1F7A6A"/>
<text x="102" y="422" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">得到签名方案的通用骨架</text>
<rect x="440" y="225" width="360" height="505" rx="24" fill="#FFFFFF" stroke="#8A6100" stroke-width="2"/>
<rect x="441" y="226" width="358" height="66" rx="22" fill="#FFF3CD"/>
<text x="464" y="268" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="800" fill="#8A6100" text-anchor="start">不提供</text>
<circle cx="464" cy="323" r="5" fill="#8A6100"/>
<text x="482" y="330" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">不给标准模型下的无条件安全</text>
<circle cx="464" cy="369" r="5" fill="#8A6100"/>
<text x="482" y="376" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">不保证所有协议都安全</text>
<circle cx="464" cy="415" r="5" fill="#8A6100"/>
<text x="482" y="422" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">不替代具体实现与参数检查</text>
<rect x="820" y="225" width="360" height="505" rx="24" fill="#FFFFFF" stroke="#A33A32" stroke-width="2"/>
<rect x="821" y="226" width="358" height="66" rx="22" fill="#FBE7E3"/>
<text x="844" y="268" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="800" fill="#A33A32" text-anchor="start">不要混入</text>
<circle cx="844" cy="323" r="5" fill="#A33A32"/>
<text x="862" y="330" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">把它与 Schnorr 或 EdDSA 等同</text>
<circle cx="844" cy="369" r="5" fill="#A33A32"/>
<text x="862" y="376" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">忽略弱哈希与可预测挑战</text>
<circle cx="844" cy="415" r="5" fill="#A33A32"/>
<text x="862" y="422" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">把随机预言机证明当成标准模型证</text>
<text x="862" y="450" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">明</text>
<line x1="60" y1="770" x2="1180" y2="770" stroke="#DED9CE" stroke-width="1.5"/>
<text x="60" y="798" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">原创示意图 · CC BY 4.0 · poyi knowledge · 2026-11-20</text>
</svg>
