<text x="60" y="104" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="38" font-weight="800" fill="#1F1D1A" text-anchor="left">CWC：CTR 加密加 Carter–Wegman 哈希</text>
<text x="60" y="143" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#6B655C" text-anchor="left">88 位 nonce 与 40 位计数器驱动 CTR；密文与 AD 进入 GF(2¹²⁷−1) 多项式，输出再加密成标签。</text>
