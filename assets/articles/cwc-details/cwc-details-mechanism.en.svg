<text x="864" y="396" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">IETF CFRG draft</text>
<circle cx="854" cy="420" r="2.5" fill="#1F7A6A"/>
<text x="864" y="424" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">10 Gbps IPsec target</text>
<circle cx="854" cy="448" r="2.5" fill="#1F7A6A"/>
<text x="864" y="452" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">Design predecessor of GCM</text>
<rect x="835" y="485" width="350" height="132" rx="12" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.2"/>
<text x="851" y="509" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#8A6100" text-anchor="left">Boundary</text>
