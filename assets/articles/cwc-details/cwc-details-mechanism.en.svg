<rect x="630" y="445" width="95" height="42" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="677.5" y="465" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6100" text-anchor="middle">E_K</text>
<text x="677.5" y="481" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">tag</text>
