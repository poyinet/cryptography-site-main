<line x1="640" y1="350" x2="640" y2="445" stroke="#1F7A6A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowGreen)"/>
<rect x="450" y="505" width="150" height="38" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="525" y="529" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">Z = E_K(c) &amp; 0x7F…</text>
<line x1="520" y1="505" x2="520" y2="487" stroke="#4B3F9E" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowPurple)"/>
<line x1="170" y1="295" x2="300" y2="350" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<text x="70" y="565" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F1D1A" text-anchor="left">Independent CTR blocks + parallel polynomial reduction → 10 Gbps hardware</text>
<text x="70" y="588" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">Tag = E_K(CW-HASH(AD, C)), truncatable to tl bits</text>
</g>
<rect x="830" y="185" width="360" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<rect x="835" y="205" width="350" height="132" rx="12" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.2"/>
