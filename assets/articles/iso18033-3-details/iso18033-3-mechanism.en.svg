<text x="82" y="144" font-size="12" letter-spacing="1.2" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">FORMULA LEVEL · REPRODUCIBLE, TRACEABLE, COMPARABLE</text>
<rect x="80" y="170" width="250" height="150" rx="10" fill="#fffaf0" stroke="#c8a24b" stroke-width="1.2"/>
<circle cx="106" cy="196" r="14" fill="#c8a24b"/>
<text x="106" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">1</text>
<text x="128" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">Step 1</text>
<text x="104" y="232" font-size="13" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">Choose block size</text>
<text x="104" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">definition / input</text>
<rect x="350" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="376" cy="196" r="14" fill="#14213d"/>
<text x="376" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">2</text>
<text x="398" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">Step 2</text>
<text x="374" y="232" font-size="13" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">Choose cipher and key</text>
<text x="374" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">transform / equation</text>
<rect x="620" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="646" cy="196" r="14" fill="#14213d"/>
<text x="646" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">3</text>
<text x="668" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">Step 3</text>
<text x="644" y="232" font-size="13" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">Run rounds or EDE</text>
<text x="644" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">observe / decode</text>
<rect x="890" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="916" cy="196" r="14" fill="#14213d"/>
<text x="916" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">4</text>
<text x="938" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">Step 4</text>
<text x="914" y="232" font-size="13" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">Output block into a</text>
<text x="914" y="252" font-size="13" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">mode</text>
<text x="914" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">boundary / result</text>
<rect x="80" y="350" width="1080" height="200" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<text x="102" y="382" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">Core formulas and scales</text>
<text x="112" y="424" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">C = E_K(P), P = D_K(C), |P| = |C| = b in {64,128}</text>
<text x="112" y="442" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">64-bit: TDEA, MISTY1, CAST-128, HIGHT</text>
<text x="112" y="460" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">128-bit: AES, Camellia, SEED</text>
<text x="112" y="478" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">TDEA: C = E_K3(D_K2(E_K1(P)))</text>
<text x="112" y="496" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">AES: S(r+1) = MixColumns(ShiftRows(SubBytes(S(r))))</text>
<text x="112" y="514" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">then AddRoundKey(S(r+1), K_r); rounds 10/12/14</text>
<text x="112" y="532" font-size="14" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">keys: TDEA 128/192; AES 128/192/256; Camellia 128/192/256; SEED 128</text>
<text x="112" y="550" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">block-bound: 2^32 blocks for 64-bit; 2^64 for 128-bit</text>
<rect x="80" y="570" width="1080" height="190" rx="10" fill="#fbfaf4" stroke="#ded8c8" stroke-width="1.2"/>
<text x="102" y="590" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">Detail / parameters / boundary</text>
<text x="112" y="614" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">ISO/IEC 18033-3 defines block-cipher primitives only: a b-bit plaintext block is mapped to a b-bit ciphertext block</text>
<text x="112" y="632" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">under a key, and the map is invertible. Seven algorithms form 64-bit and 128-bit families; TDEA composes three DES</text>
<text x="112" y="650" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">calls in EDE order, while AES applies SubBytes, ShiftRows, MixColumns and AddRoundKey for 10/12/14 rounds.</text>
<text x="112" y="688" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">Blocks: 64-bit family TDEA, MISTY1, CAST-128, HIGHT; 128-bit family AES, Camellia, SEED.</text>
<text x="112" y="706" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">Keys: TDEA 128/192 bits; AES and Camellia 128/192/256 bits; SEED 128 bits.</text>
<text x="112" y="724" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">The standard stops at primitives: modes are in ISO/IEC 10116, authentication must be added, and a 64-bit block has a</text>
<text x="80" y="774" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">Sources: ISO/IEC 18033-3:2010 official abstract and preview PDF; formulas restate the primitives.</text>
<text x="80" y="790" font-size="11.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6f7788">Boundary: the standard does not define modes, padding or authentication; the 64-bit TDEA/MISTY1/CAST-128/HIGHT family is unsuitable for</text>
<text x="80" y="806" font-size="11.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6f7788">new long-lived data. The figure explains primitives, not mode specifications or implementation audits.</text>
<text x="1160" y="806" text-anchor="end" font-size="10" font-family="ui-monospace, Consolas, monospace" fill="#a39c8a">R129 · 2026-11-24 · iso18033-3-details</text>
</svg>