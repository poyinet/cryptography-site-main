<text x="432" y="342" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">hybrid</text>
<line x1="492" y1="355" x2="514" y2="355" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
