<text x="60" y="143" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#6B655C" text-anchor="left">128 位分组拆成 X0..X3，轮函数只做模加、旋转和异或；128/192/256 位密钥对应 24/28/32 轮。</text>
