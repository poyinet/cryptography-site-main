<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">LEA: an ARX round over four 32-bit words</title>
<desc id="fig-desc">Core path: four-word block → ARX round → 24/28/32 rounds — mechanism schematic with parameters, use and limits.</desc>
<defs>
      <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4B3F9E"/></marker>
      <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1F7A6A"/></marker>
      <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8A6100"/></marker>
      <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9B2C2C"/></marker>
      <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B655C"/></marker>
      <clipPath id="mainClip"><rect x="50" y="185" width="760" height="450" rx="16"/></clipPath>
    </defs>
<rect x="0" y="0" width="1240" height="820" fill="#F7F5EF"/>
<text x="60" y="52" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#6B655C" text-anchor="left">Block cipher · 32-bit ARX</text>
<text x="60" y="104" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="32" font-weight="800" fill="#1F1D1A" text-anchor="left">LEA: an ARX round over four 32-bit words</text>
<text x="60" y="143" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#6B655C" text-anchor="left">A 128-bit block splits into X0..X3; the round uses only modular addition, rotation and XOR, with 24/28/32 rounds for 128/192/256-bit keys.</text>
<rect x="50" y="185" width="760" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="78" y="224" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="800" fill="#1F1D1A" text-anchor="left">Core path: four-word block → ARX round → 24/28/32 rounds</text>
<g clip-path="url(#mainClip)">
<text x="70" y="252" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#6B655C" text-anchor="left">128-bit block = 4 × 32-bit words</text>
<rect x="70" y="268" width="70" height="42" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="105" y="294" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">X0</text>
<rect x="152" y="268" width="70" height="42" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="187" y="294" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">X1</text>
<rect x="234" y="268" width="70" height="42" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="269" y="294" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">X2</text>
<rect x="316" y="268" width="70" height="42" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="351" y="294" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">X3</text>
<text x="505" y="248" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="800" fill="#8A6100" text-anchor="middle">× 24 / 28 / 32 rounds</text>
<rect x="400" y="258" width="210" height="195" rx="10" fill="#FFFFFF" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="505" y="360.5" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#1F7A6A" text-anchor="middle">Round function (ARX)</text>
<rect x="416" y="292" width="178" height="34" rx="8" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="428" y="314" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F7A6A" text-anchor="left">add mod 2³²</text>
<text x="582" y="314" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="end">⊞</text>
<rect x="416" y="336" width="178" height="34" rx="8" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="428" y="358" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F7A6A" text-anchor="left">ROL 9 / ROR 5 / 3</text>
<text x="582" y="358" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="end">≪ ≫</text>
<rect x="416" y="380" width="178" height="34" rx="8" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="428" y="402" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F7A6A" text-anchor="left">round-key XOR</text>
<text x="582" y="402" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="end">⊕ RK</text>
<text x="505" y="440" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">4 words rotate, 1 word passes through</text>
<rect x="70" y="455" width="230" height="60" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="185" y="475" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6100" text-anchor="middle">Key schedule</text>
<text x="185" y="491" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">128/192/256 → 6 RK/round</text>
<line x1="185" y1="455" x2="400" y2="410" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<line x1="386" y1="289" x2="400" y2="300" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<line x1="610" y1="390" x2="690" y2="390" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<line x1="610" y1="440" x2="665" y2="440" stroke="#8A6100" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowAmber)"/>
<line x1="665" y1="440" x2="665" y2="275" stroke="#8A6100" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowAmber)"/>
<line x1="665" y1="275" x2="630" y2="275" stroke="#8A6100" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowAmber)"/>
<text x="658" y="350" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="600" fill="#8A6100" text-anchor="end">loop</text>
<rect x="690" y="275" width="90" height="160" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="735" y="297" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#4B3F9E" text-anchor="middle">Cipher</text>
<text x="735" y="316" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">128 bit</text>
<text x="70" y="545" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F1D1A" text-anchor="left">Each round: ⊕ RK → add → rotate → word shuffle; no S-box</text>
<text x="70" y="568" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">Small code, native 32-bit, suited to general CPUs and IoT</text>
</g>
<rect x="830" y="185" width="360" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
