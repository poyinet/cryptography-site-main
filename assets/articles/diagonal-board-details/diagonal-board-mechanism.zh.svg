<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="对角板 mechanism"><rect width="1240" height="820" fill="#fbf8f1"/><text x="42" y="58" font-family="Georgia,Noto Serif SC,serif" font-size="32" font-weight="700" fill="#2d2a24">对角板</text><text x="42" y="90" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#7a6f5f">公式级机制：步骤、参数、适用与失效边界</text><rect x="42" y="126" width="256" height="120" rx="16" fill="#f6e7d7" stroke="#cfc4b4"/><text x="60" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 1</text><text x="60" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">识别插线板对合</text><path d="M306 186 L332 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="342" y="126" width="256" height="120" rx="16" fill="#e4efe6" stroke="#cfc4b4"/><text x="360" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 2</text><text x="360" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">26×26 对角跨接</text><path d="M606 186 L632 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="642" y="126" width="256" height="120" rx="16" fill="#e6e9f5" stroke="#cfc4b4"/><text x="660" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 3</text><text x="660" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">菜单约束传播</text><path d="M906 186 L932 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="942" y="126" width="256" height="120" rx="16" fill="#f3e3ea" stroke="#cfc4b4"/><text x="960" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 4</text><text x="960" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">转子假设筛选</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a89a86"/></marker></defs><rect x="42" y="272" width="1156" height="204" rx="14" fill="#fffdf8" stroke="#d8cfc2"/><text x="62" y="300" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">核心公式</text><text x="62" y="314" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">S(S(x))=x, S is a plugboard involution</text><text x="62" y="336" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">N_plug=Σ_{k=0}^{13} 26!/(2^k k!(26−2k)!)</text><text x="62" y="358" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">10 cables ⇒ 150,738,274,937,250 plugboard settings</text><text x="62" y="380" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">board: (i,j)↔(j,i); S(i)=j implies S(j)=i</text><text x="62" y="402" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">Bombe: 60 rotor orders × 26^3 = 1,054,560 settings</text><text x="62" y="424" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">stop ⇒ verify on a second message, not a proven key</text><text x="62" y="444" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">插线板是可逆对合，对角板把“i 连 j”与“j 连 i”接成同一约束；它把插线板从 Bombe 的搜索里消去，而不是替人算出插线板。</text><rect x="42" y="496" width="1156" height="190" rx="14" fill="#f8f4eb" stroke="#d8cfc2"/><text x="62" y="524" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">参数与边界</text><text x="62" y="548" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">结构：26 个字母插座、最多 13 根插线、典型 10 根；26×26 对角交叉板。</text><text x="62" y="592" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">搜索：5 转子 Enigma 有 60 种转子顺序，26^3 个位置，共 1,054,560 个候选；10 根插线时约 150 万亿种。</text><text x="62" y="636" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">边界：只利用对合性；停止点必须用第二条报文验证，不能把单个 stop 当唯一密钥。</text><text x="42" y="714" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#4a433a">读法：先核对假设、攻击模型与参数，再检查密钥调度、数据量与失效条件；图不替代论文定理或历史原文。</text><text x="42" y="786" font-family="Inter,Noto Sans SC,sans-serif" font-size="12" fill="#8b7d6b">原创公式级机制图 · CC BY 4.0 · poyi knowledge · 2026-11-23</text></svg>