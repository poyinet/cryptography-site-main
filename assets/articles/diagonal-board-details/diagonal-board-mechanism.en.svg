<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="Diagonal Board mechanism"><rect width="1240" height="820" fill="#fbf8f1"/><text x="42" y="58" font-family="Georgia,Noto Serif SC,serif" font-size="32" font-weight="700" fill="#2d2a24">Diagonal Board</text><text x="42" y="90" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#7a6f5f">Formula-level mechanism: steps, parameters, use and failure boundary</text><rect x="42" y="126" width="256" height="120" rx="16" fill="#f6e7d7" stroke="#cfc4b4"/><text x="60" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 1</text><text x="60" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">identify plugboard</text><text x="60" y="208" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">involution</text><path d="M306 186 L332 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="342" y="126" width="256" height="120" rx="16" fill="#e4efe6" stroke="#cfc4b4"/><text x="360" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 2</text><text x="360" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">wire 26×26</text><text x="360" y="208" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">crossbar</text><path d="M606 186 L632 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="642" y="126" width="256" height="120" rx="16" fill="#e6e9f5" stroke="#cfc4b4"/><text x="660" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 3</text><text x="660" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">propagate menu</text><text x="660" y="208" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">constraints</text><path d="M906 186 L932 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="942" y="126" width="256" height="120" rx="16" fill="#f3e3ea" stroke="#cfc4b4"/><text x="960" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 4</text><text x="960" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">screen rotor</text><text x="960" y="208" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">hypotheses</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a89a86"/></marker></defs><rect x="42" y="272" width="1156" height="204" rx="14" fill="#fffdf8" stroke="#d8cfc2"/><text x="62" y="300" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">CORE FORMULAS</text><text x="62" y="314" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">S(S(x))=x, S is a plugboard involution</text><text x="62" y="336" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">N_plug=Σ_{k=0}^{13} 26!/(2^k k!(26−2k)!)</text><text x="62" y="358" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">10 cables ⇒ 150,738,274,937,250 plugboard settings</text><text x="62" y="380" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">board: (i,j)↔(j,i); S(i)=j implies S(j)=i</text><text x="62" y="402" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">Bombe: 60 rotor orders × 26^3 = 1,054,560 settings</text><text x="62" y="424" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">stop ⇒ verify on a second message, not a proven key</text><text x="62" y="444" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">The plugboard is an involution; the diagonal board wires “i connects to j” and “j connects to i” as one</text><text x="62" y="466" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">constraint. It removes the plugboard from the Bombe search instead of solving the plugboard for the operator.</text><rect x="42" y="496" width="1156" height="190" rx="14" fill="#f8f4eb" stroke="#d8cfc2"/><text x="62" y="524" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">PARAMETERS AND BOUNDARY</text><text x="62" y="548" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">Structure: 26 letter sockets, at most 13 cables, typically 10; a 26×26 diagonal crossbar.</text><text x="62" y="592" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">Search: five-rotor Enigma has 60 rotor orders and 26^3 positions, or 1,054,560 candidates; with 10 cables the</text><text x="62" y="611" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">plugboard has 150,738,274,937,250 settings.</text><text x="62" y="636" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">Boundary: it exploits involution only; a stop must be verified on a second message and is not a proven unique key.</text><text x="42" y="714" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#4a433a">Read the assumptions, attack model and parameters first, then check key schedule, data volume and failure conditions; the diagram</text><text x="42" y="736" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#4a433a">does not replace a paper theorem or historical text.</text><text x="42" y="786" font-family="Inter,Noto Sans SC,sans-serif" font-size="12" fill="#8b7d6b">Original formula-level mechanism diagram · CC BY 4.0 · poyi knowledge · 2026-11-23</text></svg>