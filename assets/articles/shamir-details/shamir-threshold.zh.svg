<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" role="img" aria-labelledby="title desc">
<title id="title">门限秘密共享：k 个份额恢复 D，k−1 个不泄露 D</title>
<desc id="desc">示意图：D 是 k−1 次多项式的常数项，n 个点上取值得到 n 个份额；任意 k 个点插值出 D=q(0)，k−1 个点仍使所有候选 D 等可能。</desc>
<rect width="1400" height="860" fill="#F7F5EF"/>
<text x="80" y="70" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">门限秘密共享：k 个份额恢复 D，k−1 个不泄露 D</text>
<text x="80" y="106" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">按 Shamir 1979 年论文第 6–14、104–118、125–134 行重画；k 与 n 是参数。</text>
<rect x="50" y="150" width="360" height="300" rx="18" fill="#FFFFFF"/>
<rect x="72" y="168" width="150" height="34" rx="12" fill="#ECE8FF"/>
<text x="147.0" y="191.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="middle">1 · 选多项式</text>
<text x="72" y="248" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="start">秘密 D 作为常数项</text>
<rect x="72" y="272" width="92" height="62" rx="12" fill="#FFF4CF"/>
<text x="118" y="311" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="34" font-weight="700" fill="#8A6A00" text-anchor="middle">D</text>
<text x="184" y="305" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="16" font-weight="400" fill="#1F1D1A" text-anchor="start">q(x) = a0 + a1x + …</text>
<text x="184" y="330" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">+ a{k−1}x^{k−1}</text>
<text x="72" y="382" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">随机选取 k−1 次多项式</text>
<text x="72" y="410" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="19" font-weight="700" fill="#6D5BD0" text-anchor="start">a0 = D</text>
<line x1="410" y1="300" x2="448" y2="300" stroke="#6D5BD0" stroke-width="3"/>
<path d="M436 291 L448 300 L436 309" fill="none" stroke="#6D5BD0" stroke-width="3"/>
<rect x="450" y="150" width="360" height="300" rx="18" fill="#FFFFFF"/>
<rect x="472" y="168" width="136" height="34" rx="12" fill="#E3F4EE"/>
<text x="540.0" y="191.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#2E7D6B" text-anchor="middle">2 · 计算份额</text>
<text x="472" y="248" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="start">在 n 个点上取值</text>
<text x="472" y="284" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="400" fill="#1F1D1A" text-anchor="start">D_i = q(i),  i = 1 … n</text>
<circle cx="492" cy="340" r="24" fill="#E3F4EE" stroke="#2E7D6B" stroke-width="1.5"/>
<text x="492" y="346" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="700" fill="#2E7D6B" text-anchor="middle">D1</text>
<circle cx="548" cy="340" r="24" fill="#E3F4EE" stroke="#2E7D6B" stroke-width="1.5"/>
<text x="548" y="346" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="700" fill="#2E7D6B" text-anchor="middle">D2</text>
<circle cx="604" cy="340" r="24" fill="#E3F4EE" stroke="#2E7D6B" stroke-width="1.5"/>
<text x="604" y="346" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="700" fill="#2E7D6B" text-anchor="middle">D3</text>
<circle cx="660" cy="340" r="24" fill="#E3F4EE" stroke="#2E7D6B" stroke-width="1.5"/>
<text x="660" y="346" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="700" fill="#2E7D6B" text-anchor="middle">D4</text>
<circle cx="716" cy="340" r="24" fill="#E3F4EE" stroke="#2E7D6B" stroke-width="1.5"/>
<text x="716" y="346" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="700" fill="#2E7D6B" text-anchor="middle">D5</text>
<text x="472" y="402" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">份额 = (i, D_i)</text>
<text x="472" y="428" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">n 个份额分给 n 个持有者</text>
<line x1="810" y1="300" x2="848" y2="300" stroke="#6D5BD0" stroke-width="3"/>
<path d="M836 291 L848 300 L836 309" fill="none" stroke="#6D5BD0" stroke-width="3"/>
<rect x="850" y="150" width="500" height="300" rx="18" fill="#FFFFFF"/>
<rect x="872" y="168" width="130" height="34" rx="12" fill="#FFF4CF"/>
<text x="937.0" y="191.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#8A6A00" text-anchor="middle">3 · 重建</text>
<rect x="872" y="216" width="220" height="208" rx="14" fill="#FFFFFF"/>
<text x="982" y="246" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#2E7D6B" text-anchor="middle">任意 k 个份额</text>
<text x="982" y="282" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#1F1D1A" text-anchor="middle">插值 q(x)</text>
<text x="982" y="314" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#2E7D6B" text-anchor="middle">D = q(0)</text>
<text x="982" y="354" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="middle">可精确恢复</text>
<text x="982" y="400" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">k ≥ threshold</text>
<rect x="1108" y="216" width="220" height="208" rx="14" fill="#FFFFFF" stroke="#E7D9A8" stroke-width="1.5"/>
<text x="1218" y="246" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#8A6A00" text-anchor="middle">k−1 个份额</text>
<text x="1218" y="282" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#1F1D1A" text-anchor="middle">p 个候选多项式</text>
<text x="1218" y="314" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#8A6A00" text-anchor="middle">D 仍不确定</text>
<text x="1218" y="354" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="middle">所有候选等可能</text>
<text x="1218" y="400" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">k−1 &lt; threshold</text>
<rect x="50" y="500" width="1300" height="118" rx="16" fill="#FFFFFF"/>
<text x="80" y="538" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#1F1D1A" text-anchor="start">读图</text>
<text x="80" y="568" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">D 不直接分发；每个持有者拿到的是一个点 (i, D_i)。任意 k 个点唯一确定 k−1 次多项式，常数项就是 D。</text>
<text x="80" y="594" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">图中 n=5、k=3 仅为画法示意，不代表论文给出的具体参数。</text>
<rect x="50" y="640" width="1300" height="118" rx="16" fill="#FFFFFF" stroke="#E7D9A8" stroke-width="1.5"/>
<text x="80" y="676" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#8A6A00" text-anchor="start">安全边界</text>
<text x="80" y="706" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">少于 k 个份额：每个候选 D′ 都能构造唯一多项式，且这些 p 个多项式等可能，因而得不到 D 的信息。</text>
<text x="80" y="732" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">k 个或更多份额：按定义可直接恢复 D。门限方案防的是份额泄露，不是 k 方合谋。</text>
<text x="80" y="812" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">原创示意图，CC BY 4.0。证据：Shamir 1979，第 6–14、45–51、104–118、125–134 行。</text>
</svg>
