<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" role="img" aria-labelledby="title desc">
<title id="title">Threshold secret sharing: k shares recover D, k−1 reveal nothing</title>
<desc id="desc">Diagram: D is the constant term of a degree k−1 polynomial; values at n points give n shares; any k interpolate D=q(0), while k−1 leave every candidate D equally likely.</desc>
<rect width="1400" height="860" fill="#F7F5EF"/>
<text x="80" y="70" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">Threshold secret sharing: k shares recover D, k−1 reveal nothing</text>
<text x="80" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">Redrawn from Shamir 1979, lines 6–14, 104–118 and 125–134; k and n are parameters.</text>
<rect x="50" y="150" width="360" height="300" rx="18" fill="#FFFFFF"/>
<rect x="72" y="168" width="150" height="34" rx="12" fill="#ECE8FF"/>
<text x="147.0" y="191.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="middle">1 · Pick polynomial</text>
<text x="72" y="248" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="start">Secret D is the constant term</text>
<rect x="72" y="272" width="92" height="62" rx="12" fill="#FFF4CF"/>
<text x="118" y="311" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="34" font-weight="700" fill="#8A6A00" text-anchor="middle">D</text>
<text x="184" y="305" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="16" font-weight="400" fill="#1F1D1A" text-anchor="start">q(x) = a0 + a1x + …</text>
<text x="184" y="330" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">+ a{k−1}x^{k−1}</text>
<text x="72" y="382" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">Choose a random degree k−1 polynomial</text>
<text x="72" y="410" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="19" font-weight="700" fill="#6D5BD0" text-anchor="start">a0 = D</text>
<line x1="410" y1="300" x2="448" y2="300" stroke="#6D5BD0" stroke-width="3"/>
<path d="M436 291 L448 300 L436 309" fill="none" stroke="#6D5BD0" stroke-width="3"/>
<rect x="450" y="150" width="360" height="300" rx="18" fill="#FFFFFF"/>
<rect x="472" y="168" width="136" height="34" rx="12" fill="#E3F4EE"/>
<text x="540.0" y="191.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#2E7D6B" text-anchor="middle">2 · Evaluate</text>
<text x="472" y="248" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1D1A" text-anchor="start">Evaluate at n points</text>
<text x="472" y="284" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="17" font-weight="400" fill="#1F1D1A" text-anchor="start">D_i = q(i),  i = 1 … n</text>
<circle cx="492" cy="340" r="24" fill="#E3F4EE" stroke="#2E7D6B" stroke-width="1.5"/>
<text x="492" y="346" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="700" fill="#2E7D6B" text-anchor="middle">D1</text>
<circle cx="548" cy="340" r="24" fill="#E3F4EE" stroke="#2E7D6B" stroke-width="1.5"/>
<text x="548" y="346" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="700" fill="#2E7D6B" text-anchor="middle">D2</text>
<circle cx="604" cy="340" r="24" fill="#E3F4EE" stroke="#2E7D6B" stroke-width="1.5"/>
<text x="604" y="346" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="700" fill="#2E7D6B" text-anchor="middle">D3</text>
<circle cx="660" cy="340" r="24" fill="#E3F4EE" stroke="#2E7D6B" stroke-width="1.5"/>
<text x="660" y="346" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="700" fill="#2E7D6B" text-anchor="middle">D4</text>
<circle cx="716" cy="340" r="24" fill="#E3F4EE" stroke="#2E7D6B" stroke-width="1.5"/>
<text x="716" y="346" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="700" fill="#2E7D6B" text-anchor="middle">D5</text>
<text x="472" y="402" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">Share = (i, D_i)</text>
<text x="472" y="428" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">n shares go to n holders</text>
<line x1="810" y1="300" x2="848" y2="300" stroke="#6D5BD0" stroke-width="3"/>
<path d="M836 291 L848 300 L836 309" fill="none" stroke="#6D5BD0" stroke-width="3"/>
<rect x="850" y="150" width="500" height="300" rx="18" fill="#FFFFFF"/>
<rect x="872" y="168" width="130" height="34" rx="12" fill="#FFF4CF"/>
<text x="937.0" y="191.0" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#8A6A00" text-anchor="middle">3 · Reconstruct</text>
<rect x="872" y="216" width="220" height="208" rx="14" fill="#FFFFFF"/>
<text x="982" y="246" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#2E7D6B" text-anchor="middle">Any k shares</text>
<text x="982" y="282" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#1F1D1A" text-anchor="middle">Interpolate q(x)</text>
<text x="982" y="314" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#2E7D6B" text-anchor="middle">D = q(0)</text>
<text x="982" y="354" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="middle">Exact recovery</text>
<text x="982" y="400" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">k ≥ threshold</text>
<rect x="1108" y="216" width="220" height="208" rx="14" fill="#FFFFFF" stroke="#E7D9A8" stroke-width="1.5"/>
<text x="1218" y="246" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#8A6A00" text-anchor="middle">k−1 shares</text>
<text x="1218" y="282" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#1F1D1A" text-anchor="middle">p candidate polynomials</text>
<text x="1218" y="314" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#8A6A00" text-anchor="middle">D stays uncertain</text>
<text x="1218" y="354" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="middle">All candidates equally likely</text>
<text x="1218" y="400" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">k−1 &lt; threshold</text>
<rect x="50" y="500" width="1300" height="118" rx="16" fill="#FFFFFF"/>
<text x="80" y="538" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#1F1D1A" text-anchor="start">How to read it</text>
<text x="80" y="568" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">D is not distributed directly; each holder gets a point (i, D_i). Any k points determine the degree k−1 polynomial uniquely, and its constant term is D.</text>
<text x="80" y="594" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#6B655C" text-anchor="start">The drawing uses n=5 and k=3 only for illustration; they are not parameters printed in the paper.</text>
<rect x="50" y="640" width="1300" height="118" rx="16" fill="#FFFFFF" stroke="#E7D9A8" stroke-width="1.5"/>
<text x="80" y="676" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#8A6A00" text-anchor="start">Security boundary</text>
<text x="80" y="706" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">Fewer than k shares: for every candidate D′ a unique polynomial can be built, and these p polynomials are equally likely, so nothing about D is learned.</text>
<text x="80" y="732" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start">k or more shares: D is recoverable by definition. The scheme protects against share leakage, not against collusion of k holders.</text>
<text x="80" y="812" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">Original diagram, CC BY 4.0. Evidence: Shamir 1979, lines 6–14, 45–51, 104–118, 125–134.</text>
</svg>
