<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="紫密破译 mechanism"><rect width="1240" height="820" fill="#fbf8f1"/><text x="42" y="58" font-family="Georgia,Noto Serif SC,serif" font-size="32" font-weight="700" fill="#2d2a24">紫密破译</text><text x="42" y="90" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#7a6f5f">公式级机制：步骤、参数、适用与失效边界</text><rect x="42" y="126" width="256" height="120" rx="16" fill="#f6e7d7" stroke="#cfc4b4"/><text x="60" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 1</text><text x="60" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">分离 6 与 20</text><path d="M306 186 L332 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="342" y="126" width="256" height="120" rx="16" fill="#e4efe6" stroke="#cfc4b4"/><text x="360" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 2</text><text x="360" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">识别 sixes 字母</text><path d="M606 186 L632 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="642" y="126" width="256" height="120" rx="16" fill="#e6e9f5" stroke="#cfc4b4"/><text x="660" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 3</text><text x="660" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">恢复二十组置换</text><path d="M906 186 L932 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="942" y="126" width="256" height="120" rx="16" fill="#f3e3ea" stroke="#cfc4b4"/><text x="960" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 4</text><text x="960" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">重建步进与明文</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a89a86"/></marker></defs><rect x="42" y="272" width="1156" height="204" rx="14" fill="#fffdf8" stroke="#d8cfc2"/><text x="62" y="300" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">核心公式</text><text x="62" y="314" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">E=P_out(T_20(T_6(P_in(p))))</text><text x="62" y="336" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">A=A_6 ⊔ A_20, |A_6|=6, |A_20|=20</text><text x="62" y="358" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">Kspace=26!×6×25^4≈9.45×10^32</text><text x="62" y="380" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">after sixes: 6!·20!; settings 6·25^4→6·25^3=93,750</text><text x="62" y="402" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">period≤25^3=15,625</text><text x="62" y="424" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">Grotjan: repeated pattern in sixes/twenties ⇒ break, Sep 1940</text><text x="62" y="444" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">紫密把 26 个字母拆成 6 个“sixes”和 20 个“twenties”，分别走 1 个与 3 个 25 位步进开关；破译的关键不是穷举 26!，而是先认出哪</text><text x="62" y="466" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a"> 6 个字母属于 sixes。</text><rect x="42" y="496" width="1156" height="190" rx="14" fill="#f8f4eb" stroke="#d8cfc2"/><text x="62" y="524" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">参数与边界</text><text x="62" y="548" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">结构：输入/输出插线板、6 个 sixes（25 位）、20 个 twenties（3×25 位）。</text><text x="62" y="592" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">规模：26!×6×25^4≈9.45×10^32；分离后 6!·20!，设置数约 234 万→9.4 万。</text><text x="62" y="636" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">边界：分离依赖 6-20 结构；若插线板或步进规则改变，参数不适用；重建机器需要已知明文或 crib。</text><text x="42" y="714" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#4a433a">读法：先核对假设、攻击模型与参数，再检查密钥调度、数据量与失效条件；图不替代论文定理或历史原文。</text><text x="42" y="786" font-family="Inter,Noto Sans SC,sans-serif" font-size="12" fill="#8b7d6b">原创公式级机制图 · CC BY 4.0 · poyi knowledge · 2026-11-23</text></svg>