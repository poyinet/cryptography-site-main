<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">RSA：整数原语、CRT正确性与编码方案</title>
<desc id="fig-desc">算法 · 为什么—怎么做—哪里失效</desc>
<rect x="0" y="0" width="1240" height="820" fill="#F7F5EF"/>
<text x="60" y="54" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#6B655C">算法</text>
<text x="60" y="108" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="38" font-weight="800" fill="#1F1D1A">RSA：整数原语、CRT正确性与编码方案</text>
<text x="60" y="150" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#6B655C">从正文提炼的一条解释线：先看问题，再看机制，最后看失效条件。</text>
<rect x="50" y="205" width="350" height="405" rx="22" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="2"/>
<rect x="72" y="227" width="42" height="42" rx="13" fill="#ECE9FA"/><text x="93" y="257" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="800" fill="#4B3F9E" text-anchor="middle">1</text>
<text x="74" y="310" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="800" fill="#4B3F9E">为什么需要</text>
<text x="74" y="358" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">知道(n,e)就能做公共方向模</text>
<text x="74" y="389" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">幂，掌握正确私钥材料则能做逆运</text>
<text x="74" y="420" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">算。这把公开地址与需要保密的能</text>
<text x="74" y="451" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">力分开。知道因子p、q可求λ(n</text>
<text x="74" y="482" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">)并恢复相应d，因此因子必须保</text>
<text x="74" y="513" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">密；但已有分解即可求逆不等于任</text>
<text x="74" y="544" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">何RSA求逆算法都等价于分解。</text>
<line x1="410" y1="400" x2="475" y2="400" stroke="#4B3F9E" stroke-width="3"/><path d="M465 393 L475 400 L465 407" fill="none" stroke="#4B3F9E" stroke-width="3"/>
<rect x="445" y="205" width="350" height="405" rx="22" fill="#FFFFFF" stroke="#1F7A6A" stroke-width="2"/>
<rect x="467" y="227" width="42" height="42" rx="13" fill="#E2F3EE"/><text x="488" y="257" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="800" fill="#1F7A6A" text-anchor="middle">2</text>
<text x="469" y="310" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="800" fill="#1F7A6A">核心机制</text>
<text x="469" y="358" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">RSA 先是一对整数上的模幂运算；</text>
<text x="469" y="389" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">保密加密和数字签名还必须各自配</text>
<text x="469" y="420" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">上不同的编码、参数与验证规则。</text>
<text x="469" y="451" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">它不替代 RFC 8017 标准条目的</text>
<text x="469" y="482" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">详解，也不是可部署的密码服务。</text>
<line x1="805" y1="400" x2="870" y2="400" stroke="#1F7A6A" stroke-width="3"/><path d="M860 393 L870 400 L860 407" fill="none" stroke="#1F7A6A" stroke-width="3"/>
<rect x="840" y="205" width="350" height="405" rx="22" fill="#FFFFFF" stroke="#8A6100" stroke-width="2"/>
<rect x="862" y="227" width="42" height="42" rx="13" fill="#FFF3CD"/><text x="883" y="257" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="800" fill="#8A6100" text-anchor="middle">3</text>
<text x="864" y="310" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="800" fill="#8A6100">边界</text>
<text x="864" y="358" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">裸RSA在固定密钥下是确定的：同</text>
<text x="864" y="389" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">一代表总得到同一密文。消息若只</text>
<text x="864" y="420" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">有少数已知候选，任何人都可用公</text>
<text x="864" y="451" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">钥加密候选后比较。乘法结构又给</text>
<text x="864" y="482" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">E(m1)E(m2) modn=E(m1m2</text>
<text x="864" y="513" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">modn)。</text>
<rect x="60" y="650" width="1120" height="95" rx="18" fill="#ECE9FA"/>
<text x="84" y="685" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="800" fill="#4B3F9E">怎么用这张图</text>
<text x="84" y="718" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">先读第一栏确认它解决的问题，再看中间一栏的机制，最后用第三栏的失效条件检验任何“绝对安全”的说法。</text>
<line x1="60" y1="774" x2="1180" y2="774" stroke="#DED9CE" stroke-width="1.5"/><text x="60" y="800" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" fill="#6B655C">原创示意图 · CC BY 4.0 · poyi knowledge · 2026-11-21 · 文字摘自本篇正文</text>
</svg>
