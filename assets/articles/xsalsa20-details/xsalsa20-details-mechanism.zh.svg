<line x1="590" y1="391" x2="630" y2="388" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<line x1="700" y1="412" x2="700" y2="432" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<text x="80" y="505" font-family="'Consolas','SFMono-Regular',monospace" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">subkey = HSalsa20(K, n₀..₁₂₇)；block = Salsa20(subkey, n₁₂₈..₁₉₁, ctr)</text>
<text x="80" y="527" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="left">HSalsa20 与 Salsa20 共用 20 轮核心，但不把输入加回输出。</text>
