<text x="327.5" y="327.5" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">D₁</text>
<rect x="375" y="300" width="55" height="45" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="402.5" y="327.5" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">D₂</text>
<text x="443" y="329" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#6B655C" text-anchor="left">…</text>
<rect x="465" y="300" width="55" height="45" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
