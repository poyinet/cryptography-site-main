<circle cx="854" cy="280" r="2.5" fill="#4B3F9E"/>
<text x="864" y="284" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">三种 padding</text>
<circle cx="854" cy="308" r="2.5" fill="#4B3F9E"/>
<text x="864" y="312" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">六个 MAC 算法</text>
<rect x="835" y="345" width="350" height="132" rx="12" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.2"/>
<text x="851" y="369" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#1F7A6A" text-anchor="left">用途</text>
<circle cx="854" cy="392" r="2.5" fill="#1F7A6A"/>
<text x="864" y="396" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">银行报文 / EMV</text>
<circle cx="854" cy="420" r="2.5" fill="#1F7A6A"/>
<text x="864" y="424" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">ISO 8731-1 / X9.9</text>
<circle cx="854" cy="448" r="2.5" fill="#1F7A6A"/>
<text x="864" y="452" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">NIST CMAC 并行路径</text>
<rect x="835" y="485" width="350" height="132" rx="12" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.2"/>
<text x="851" y="509" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#8A6100" text-anchor="left">边界</text>
<circle cx="854" cy="532" r="2.5" fill="#8A6100"/>
<text x="864" y="536" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">变长消息需最终变换</text>
<circle cx="854" cy="560" r="2.5" fill="#8A6100"/>
<text x="864" y="564" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">Padding 1 可伪造</text>
<circle cx="854" cy="588" r="2.5" fill="#8A6100"/>
<text x="864" y="592" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">标签截断降低强度</text>
<rect x="78" y="600" width="200" height="32" rx="16" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1"/>
<text x="178" y="621" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="600" fill="#4B3F9E" text-anchor="middle">CBC-MAC</text>
<rect x="296" y="600" width="200" height="32" rx="16" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1"/>
<text x="396" y="621" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="600" fill="#4B3F9E" text-anchor="middle">三种 padding</text>
<rect x="514" y="600" width="200" height="32" rx="16" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1"/>
<text x="614" y="621" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="600" fill="#4B3F9E" text-anchor="middle">2011 二版</text>
<rect x="50" y="660" width="1140" height="105" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="74" y="690" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="800" fill="#4B3F9E" text-anchor="left">怎么读这张图</text>
<text x="74" y="716" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">左侧消息先过 padding，再切成 D1…Dq；中部 CBC 链每块先异或前链值再过 E_K；右侧是可选最终变换、截断和 m </text>
<text x="74" y="739" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">位 MAC。底部标出六个算法共用模型，以及 Padding 1 的可变长度风险。</text>
