<line x1="280" y1="327" x2="300" y2="327" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<rect x="300" y="385" width="55" height="45" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="327.5" y="412.5" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">E_K</text>
<line x1="327" y1="345" x2="327" y2="385" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<line x1="375" y1="345" x2="400" y2="390" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<circle cx="407" cy="407" r="13" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="1.5"/>
<text x="407" y="412" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="800" fill="#4B3F9E" text-anchor="middle">⊕</text>
<line x1="355" y1="407" x2="394" y2="407" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<rect x="435" y="385" width="55" height="45" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="462.5" y="412.5" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">E_K</text>
<line x1="420" y1="407" x2="435" y2="407" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<text x="495" y="370" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="700" fill="#4B3F9E" text-anchor="left">H_q</text>
<line x1="490" y1="407" x2="505" y2="407" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<rect x="525" y="380" width="100" height="55" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="575" y="400" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6100" text-anchor="middle">最终变换</text>
<text x="575" y="416" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">可选</text>
<line x1="490" y1="407" x2="525" y2="407" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<rect x="650" y="380" width="80" height="55" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="690" y="400" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6100" text-anchor="middle">截断</text>
<text x="690" y="416" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">m ≤ n</text>
<line x1="625" y1="407" x2="650" y2="407" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<rect x="750" y="380" width="55" height="55" rx="10" fill="#FBE9E9" stroke="#9B2C2C" stroke-width="1.6"/>
<text x="777.5" y="400" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#9B2C2C" text-anchor="middle">MAC</text>
<text x="777.5" y="416" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">m bit</text>
<line x1="730" y1="407" x2="750" y2="407" stroke="#9B2C2C" stroke-width="2"  marker-end="url(#arrowRed)"/>
<text x="78" y="470" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F1D1A" text-anchor="left">H₁ = E_K(D₁);  H_i = E_K(H_{i-1} ⊕ D_i)</text>
<text x="78" y="500" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#6B655C" text-anchor="left">Algorithm 1 是 CBC-MAC：单密钥、无最终变换，只对固定长度消息可证明安全</text>
<text x="78" y="530" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#6B655C" text-anchor="left">Algorithm 3 = Retail MAC；Algorithm 5 用最少加密次数但需要更长内部密钥</text>
<text x="78" y="575" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="600" fill="#9B2C2C" text-anchor="left">Padding 1 补 0：可变长度下可被 trivial forgery；改用最终变换或 CMAC</text>
</g>
<rect x="830" y="185" width="360" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<rect x="835" y="205" width="350" height="132" rx="12" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.2"/>
