<text x="74" y="310" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="800" fill="#4B3F9E">Context</text>
<text x="74" y="358" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">The datable coordinates are</text>
<text x="74" y="389" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">printed by HAC. Lines</text>
<text x="74" y="420" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">2634–2635 say the concept of</text>
<text x="74" y="451" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">a digital signature was</text>
<text x="74" y="482" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">introduced by Diffie and</text>
<text x="74" y="513" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">Hellman and “independently</text>
<text x="74" y="544" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">by Merkle ”。</text>
