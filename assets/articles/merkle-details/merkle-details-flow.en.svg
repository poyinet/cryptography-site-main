<text x="60" y="150" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#6B655C">One explanatory line drawn from the article: the problem, the mechanism, then the failure condition.</text>
