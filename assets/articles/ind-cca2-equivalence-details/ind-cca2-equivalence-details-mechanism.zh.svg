<text x="430" y="428" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="left">黄金标准：x′ = x + 1 之类的“有意义相关”</text>
<text x="430" y="448" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="left"></text>
<rect x="70" y="480" width="300" height="45" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
