<text x="410" y="581" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">CCA2 下等价；弱模型存在分离</text>
</g>
