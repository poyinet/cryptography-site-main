<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">IND-CCA2 与非延展性等价</title>
<desc id="fig-desc">两个游戏与一条归约 — mechanism schematic with parameters, use and limits.</desc>
