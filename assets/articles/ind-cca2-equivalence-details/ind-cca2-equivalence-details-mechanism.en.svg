<rect x="70" y="250" width="330" height="210" rx="10" fill="#FCFBF7" stroke="#4B3F9E" stroke-width="1.2"/>
<text x="85" y="275" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#4B3F9E" text-anchor="left">IND-CCA2</text>
<rect x="85" y="288" width="90" height="40" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="130" y="313" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">pk / sk</text>
