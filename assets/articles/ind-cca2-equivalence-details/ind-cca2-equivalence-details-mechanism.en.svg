<rect x="430" y="345" width="150" height="40" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="505" y="370" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6100" text-anchor="middle">Output y′ ≠ y</text>
<rect x="600" y="345" width="120" height="40" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="660" y="370" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6100" text-anchor="middle">Relation R</text>
<line x1="580" y1="365" x2="600" y2="365" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<text x="430" y="405" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="600" fill="#1F1D1A" text-anchor="left">decrypt y′ to x′;</text>
<text x="430" y="428" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="left">if R(x_b, x′) ≫ random, B wins</text>
<text x="430" y="448" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="left">Example: x′ = x + 1</text>
<rect x="70" y="480" width="300" height="45" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="220" y="500" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">NM-ATK ⇒ IND-ATK</text>
<text x="220" y="516" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">any attack model</text>
<rect x="400" y="480" width="300" height="45" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="550" y="500" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">IND-CCA2 ⇒ NM-CCA2</text>
<text x="550" y="516" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">Theorem 2 (1998)</text>
<line x1="370" y1="502" x2="400" y2="502" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<rect x="70" y="540" width="680" height="44" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="410" y="562" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#8A6100" text-anchor="middle">IND-CCA2 ⇔ NM-CCA2</text>
<text x="410" y="581" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">equivalent under CCA2; weaker models separate</text>
</g>
