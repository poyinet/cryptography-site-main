<text x="178" y="621" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="600" fill="#4B3F9E" text-anchor="middle">IND-CCA2</text>
<rect x="296" y="600" width="200" height="32" rx="16" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1"/>
<text x="396" y="621" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="600" fill="#4B3F9E" text-anchor="middle">NM-CCA2</text>
<rect x="514" y="600" width="200" height="32" rx="16" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1"/>
<text x="614" y="621" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="600" fill="#4B3F9E" text-anchor="middle">1998 relation graph</text>
<rect x="50" y="660" width="1140" height="105" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="74" y="690" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="800" fill="#4B3F9E" text-anchor="left">How to read this figure</text>
<text x="74" y="716" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">Top left is the IND game: the adversary guesses b and may decrypt after the challenge except on y; top right is</text>
<text x="74" y="739" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">the NM game: the adversary outputs y′ and a relation R. The bottom arrows are NM⇒IND and IND-CCA2⇒NM-CCA2, which</text>
<text x="74" y="762" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">together give equivalence under CCA2.</text>
