<text x="60" y="52" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#6B655C" text-anchor="left">R111 · provable security</text>
<text x="60" y="104" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="31" font-weight="800" fill="#1F1D1A" text-anchor="left">IND-CCA2 equivalence with non-malleability</text>
<text x="60" y="143" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#6B655C" text-anchor="left">Confidentiality and non-malleability coincide under adaptive CCA</text>
