<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">ECB 电子密码本模式：最直接的块变换及其代价</title>
<desc id="fig-desc">算法 · 为什么—怎么做—哪里失效</desc>
<rect x="0" y="0" width="1240" height="820" fill="#F7F5EF"/>
<text x="60" y="54" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#6B655C">算法</text>
<text x="60" y="108" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="38" font-weight="800" fill="#1F1D1A">ECB 电子密码本模式：最直接的块变换及其代价</text>
<text x="60" y="150" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#6B655C">从正文提炼的一条解释线：先看问题，再看机制，最后看失效条件。</text>
<rect x="50" y="205" width="350" height="405" rx="22" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="2"/>
<rect x="72" y="227" width="42" height="42" rx="13" fill="#ECE9FA"/><text x="93" y="257" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="800" fill="#4B3F9E" text-anchor="middle">1</text>
<text x="74" y="310" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="800" fill="#4B3F9E">为什么需要</text>
<text x="74" y="358" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">ECB 是理解其他模式的基线。它</text>
<text x="74" y="389" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">展示了分组密码最原始的使用方式：</text>
<text x="74" y="420" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">一个块进，一个块出，没有 IV、</text>
<text x="74" y="451" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">没有链接、没有状态。其他模式的</text>
<text x="74" y="482" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">大部分设计，都是在解决 ECB 暴</text>
<text x="74" y="513" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">露出的问题。</text>
<line x1="410" y1="400" x2="475" y2="400" stroke="#4B3F9E" stroke-width="3"/><path d="M465 393 L475 400 L465 407" fill="none" stroke="#4B3F9E" stroke-width="3"/>
<rect x="445" y="205" width="350" height="405" rx="22" fill="#FFFFFF" stroke="#1F7A6A" stroke-width="2"/>
<rect x="467" y="227" width="42" height="42" rx="13" fill="#E2F3EE"/><text x="488" y="257" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="800" fill="#1F7A6A" text-anchor="middle">2</text>
<text x="469" y="310" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="800" fill="#1F7A6A">核心机制</text>
<text x="469" y="358" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">ECB（Electronic Codebook，</text>
<text x="469" y="389" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">电子密码本）是定义最简单的工作</text>
<text x="469" y="420" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">模式。它把明文切成固定长度的块，</text>
<text x="469" y="451" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">对每个块独立执行分组密码的正向</text>
<text x="469" y="482" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">函数： 解密同样独立： ECB 不</text>
<text x="469" y="513" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">使用 IV，也没有块之间的链接。</text>
<line x1="805" y1="400" x2="870" y2="400" stroke="#1F7A6A" stroke-width="3"/><path d="M860 393 L870 400 L860 407" fill="none" stroke="#1F7A6A" stroke-width="3"/>
<rect x="840" y="205" width="350" height="405" rx="22" fill="#FFFFFF" stroke="#8A6100" stroke-width="2"/>
<rect x="862" y="227" width="42" height="42" rx="13" fill="#FFF3CD"/><text x="883" y="257" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="800" fill="#8A6100" text-anchor="middle">3</text>
<text x="864" y="310" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="800" fill="#8A6100">边界</text>
<text x="864" y="358" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">ECB 对相同明文块产生相同密文</text>
<text x="864" y="389" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">块。攻击者不需要密钥，就能看出</text>
<text x="864" y="420" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">哪些块相等、哪些块重复、数据是</text>
<text x="864" y="451" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">否有固定结构。对图像，这会保留</text>
<text x="864" y="482" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">轮廓；对数据库，这会泄露字段重</text>
<text x="864" y="513" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">复；对协议记录，这会泄露相同的</text>
<text x="864" y="544" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">首部或固定字段。</text>
<rect x="60" y="650" width="1120" height="95" rx="18" fill="#ECE9FA"/>
<text x="84" y="685" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="800" fill="#4B3F9E">怎么用这张图</text>
<text x="84" y="718" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">先读第一栏确认它解决的问题，再看中间一栏的机制，最后用第三栏的失效条件检验任何“绝对安全”的说法。</text>
<line x1="60" y1="774" x2="1180" y2="774" stroke="#DED9CE" stroke-width="1.5"/><text x="60" y="800" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" fill="#6B655C">原创示意图 · CC BY 4.0 · poyi knowledge · 2026-11-21 · 文字摘自本篇正文</text>
</svg>
