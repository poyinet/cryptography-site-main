<text x="84" y="268" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="800" fill="#1F7A6A" text-anchor="start">提供</text>
<circle cx="84" cy="323" r="5" fill="#1F7A6A"/>
<text x="102" y="330" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">Ring-LWE 的最坏情况归约</text>
<circle cx="84" cy="369" r="5" fill="#1F7A6A"/>
<text x="102" y="376" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">更小的密钥与更快乘法</text>
<circle cx="84" cy="415" r="5" fill="#1F7A6A"/>
<text x="102" y="422" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">Kyber 等模块格方案的祖先</text>
<rect x="440" y="225" width="360" height="505" rx="24" fill="#FFFFFF" stroke="#8A6100" stroke-width="2"/>
<rect x="441" y="226" width="358" height="66" rx="22" fill="#FFF3CD"/>
<text x="464" y="268" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="800" fill="#8A6100" text-anchor="start">不提供</text>
<circle cx="464" cy="323" r="5" fill="#8A6100"/>
<text x="482" y="330" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">不保证环结构没有弱点</text>
