<text x="482" y="376" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">不覆盖所有多项式</text>
<circle cx="464" cy="415" r="5" fill="#8A6100"/>
<text x="482" y="422" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">不自动给出具体参数</text>
<rect x="820" y="225" width="360" height="505" rx="24" fill="#FFFFFF" stroke="#A33A32" stroke-width="2"/>
<rect x="821" y="226" width="358" height="66" rx="22" fill="#FBE7E3"/>
<text x="844" y="268" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="800" fill="#A33A32" text-anchor="start">不要混入</text>
<circle cx="844" cy="323" r="5" fill="#A33A32"/>
<text x="862" y="330" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">把 Ring-LWE 当普通 LWE</text>
<circle cx="844" cy="369" r="5" fill="#A33A32"/>
<text x="862" y="376" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">忽略环的代数结构</text>
<circle cx="844" cy="415" r="5" fill="#A33A32"/>
<text x="862" y="422" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="start">把效率提升当成安全提升</text>
