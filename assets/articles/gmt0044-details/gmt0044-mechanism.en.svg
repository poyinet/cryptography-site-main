<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="GM/T 0044 SM9 Identity-based Algorithms">
<rect width="1240" height="820" fill="#f6f3ea"/>
<rect x="28" y="24" width="1184" height="784" rx="18" fill="#fffdf7" stroke="#d8d2c4" stroke-width="1.5"/>
<text x="80" y="74" font-size="22" font-weight="700" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">GM/T 0044 SM9 Identity-based Algorithms</text>
<text x="82" y="104" font-size="14" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6c7486">Bilinear pairing · signing master key · (h,S) signature · KEM/KDF</text>
<rect x="80" y="120" width="1080" height="1" fill="#ded8c8"/>
<text x="82" y="144" font-size="12" letter-spacing="1.2" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">FORMULA LEVEL · REPRODUCIBLE, TRACEABLE, COMPARABLE</text>
<rect x="80" y="170" width="250" height="150" rx="10" fill="#fffaf0" stroke="#c8a24b" stroke-width="1.2"/>
<circle cx="106" cy="196" r="14" fill="#c8a24b"/>
<text x="106" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">1</text>
<text x="128" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">Step 1</text>
<text x="104" y="232" font-size="13" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">Pairing and params</text>
<text x="104" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">definition / input</text>
<rect x="350" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="376" cy="196" r="14" fill="#14213d"/>
<text x="376" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">2</text>
<text x="398" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">Step 2</text>
<text x="374" y="232" font-size="13" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">Master/user keys</text>
<text x="374" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">transform / equation</text>
<rect x="620" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="646" cy="196" r="14" fill="#14213d"/>
<text x="646" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">3</text>
<text x="668" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">Step 3</text>
<text x="644" y="232" font-size="13" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">Sign (h,S)</text>
<text x="644" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">observe / decode</text>
<rect x="890" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="916" cy="196" r="14" fill="#14213d"/>
<text x="916" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">4</text>
<text x="938" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">Step 4</text>
<text x="914" y="232" font-size="13" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">Verify and encapsulate</text>
<text x="914" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">boundary / result</text>
<rect x="80" y="350" width="1080" height="200" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<text x="102" y="382" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">Core formulas and scales</text>
<text x="112" y="412" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">e: G1×G2→GT, e([a]P,[b]Q)=e(P,Q)^{ab}</text>
<text x="112" y="429" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">P_pub-s=[ks]P2, ds_A=[ks/(H1(ID_A)+ks)]P1</text>
<text x="112" y="446" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">g=e(P1,P_pub-s), w=g^r, h=H2(M‖w,N)</text>
<text x="112" y="463" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">l=(r-h) mod N, S=[l]ds_A; signature is (h,S)</text>
<text x="112" y="480" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Verify: t=g^h, P=[H1(ID_A)]P2+P_pub-s</text>
<text x="112" y="497" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">u=e(S,P), w′=u·t, h′=H2(M‖w′,N); accept iff h′=h</text>
<text x="112" y="514" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">KEM: Q_B=[H1(ID_B‖hid,N)]P1+P_pub-e, C=[r]Q_B</text>
<text x="112" y="531" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">KEM: w=e(P_pub-e,P2)^r, K=KDF(C‖w‖ID_B,klen)</text>
<rect x="80" y="570" width="1080" height="190" rx="10" fill="#fbfaf4" stroke="#ded8c8" stroke-width="1.2"/>
<text x="102" y="590" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">Detail / parameters / boundary</text>
<text x="112" y="614" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">SM9 uses a bilinear pairing on a BN curve; G1, G2 and GT have prime order N.</text>
<text x="112" y="632" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">The KGC keeps the signing master secret ks and publishes P_pub-s=[ks]P2.</text>
<text x="112" y="650" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">A signature is (h,S): h hashes the message with w, and S is a point in G1.</text>
<text x="112" y="668" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">Verification rebuilds w′=e(S,P)·g^h; KEM/encryption uses C=[r]Q_B and KDF.</text>
<text x="112" y="688" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">GM/T 0044-2016: published 2016-03-28, five parts: general, signature, key exchange, KEM/encryption, parameters.</text>
<text x="112" y="706" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">The 2025 revision took effect 2026-07-01 and abolished the 2016 parts; signing/encryption master keys are separate.</text>
<text x="112" y="724" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">Boundary: the KGC holds the master secret, so this is not trust-free; KEM still needs KDF and SM4.</text>
<text x="80" y="774" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">Sources: GM/T 0044.1-2016, GM/T 0044.4-2016, NCA Announcement No. 54, and the national standards public-service SM9 record.</text>
<text x="80" y="790" font-size="11.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6f7788">Boundary: a trusted KGC is a precondition for SM9; master-key compromise affects the whole identity domain.</text>
<text x="80" y="806" font-size="11.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6f7788">The (h,S) signature cannot be split; verification first checks S∈G1, then pairs and rehashes.</text>
<text x="1160" y="806" text-anchor="end" font-size="10" font-family="ui-monospace, Consolas, monospace" fill="#a39c8a">R134 · 2026-11-24 · gmt0044-details</text>
</svg>