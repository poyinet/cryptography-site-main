<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="Red Army “Hao Mi” Cipher mechanism"><rect width="1240" height="820" fill="#fbf8f1"/><text x="42" y="58" font-family="Georgia,Noto Serif SC,serif" font-size="32" font-weight="700" fill="#2d2a24">Red Army “Hao Mi” Cipher</text><text x="42" y="90" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#7a6f5f">Formula-level mechanism: steps, parameters, use and failure boundary</text><rect x="42" y="126" width="256" height="120" rx="16" fill="#f6e7d7" stroke="#cfc4b4"/><text x="60" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 1</text><text x="60" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">look up the base</text><text x="60" y="208" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">text</text><path d="M306 186 L332 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="342" y="126" width="256" height="120" rx="16" fill="#e4efe6" stroke="#cfc4b4"/><text x="360" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 2</text><text x="360" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">add random digits</text><path d="M606 186 L632 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="642" y="126" width="256" height="120" rx="16" fill="#e6e9f5" stroke="#cfc4b4"/><text x="660" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 3</text><text x="660" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">send the group</text><path d="M906 186 L932 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="942" y="126" width="256" height="120" rx="16" fill="#f3e3ea" stroke="#cfc4b4"/><text x="960" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 4</text><text x="960" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">subtract to</text><text x="960" y="208" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">recover</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a89a86"/></marker></defs><rect x="42" y="272" width="1156" height="204" rx="14" fill="#fffdf8" stroke="#d8cfc2"/><text x="62" y="300" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">CORE FORMULAS</text><text x="62" y="320" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">P_i = Book[page_i, line_i, char_i]</text><text x="62" y="342" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">C_i = (P_i + R_i) mod 10</text><text x="62" y="364" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">R_i fresh and uniform per message; H(R_i)=log2 10</text><text x="62" y="386" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">H(C)=H(P) if R is a true one-time key</text><text x="62" y="408" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">reuse ⇒ C_i⊖C_j=P_i⊖P_j (depth)</text><text x="62" y="444" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">The public account of Hao Mi is a one-time system of base text plus random digits: the base supplies a page,</text><text x="62" y="466" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">line and character index, and fresh random digits recode each telegram.</text><rect x="42" y="496" width="1156" height="190" rx="14" fill="#f8f4eb" stroke="#d8cfc2"/><text x="62" y="524" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">PARAMETERS AND BOUNDARY</text><text x="62" y="548" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">Structure: base-text index (page/line/character) plus random digits; digit groups carry Chinese characters.</text><text x="62" y="592" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">One-time: each telegram uses a fresh random stream, so “same character, different code; same code, different</text><text x="62" y="611" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">character”; a uniform digit carries log2 10 bits.</text><text x="62" y="636" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">Boundary: leakage of base or random tables, reuse or a non-random stream breaks it; Party history and scholarly</text><text x="62" y="655" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">accounts differ on authorship.</text><text x="42" y="714" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#4a433a">Read the codebook, splitting and random-stream assumptions first, then check the message set, shared text and failure conditions;</text><text x="42" y="736" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#4a433a">the diagram does not replace Liu Tao, the Wujing Zongyao or Party-history scholarship.</text><text x="42" y="786" font-family="Inter,Noto Sans SC,sans-serif" font-size="12" fill="#8b7d6b">Original formula-level mechanism diagram · CC BY 4.0 · poyi knowledge · 2026-11-23</text></svg>