<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="阴符 mechanism"><rect width="1240" height="820" fill="#fbf8f1"/><text x="42" y="58" font-family="Georgia,Noto Serif SC,serif" font-size="32" font-weight="700" fill="#2d2a24">阴符</text><text x="42" y="90" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#7a6f5f">公式级机制：步骤、参数、适用与失效边界</text><rect x="42" y="126" width="256" height="120" rx="16" fill="#f6e7d7" stroke="#cfc4b4"/><text x="60" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 1</text><text x="60" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">约定八等符长</text><path d="M306 186 L332 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="342" y="126" width="256" height="120" rx="16" fill="#e4efe6" stroke="#cfc4b4"/><text x="360" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 2</text><text x="360" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">按军情选符</text><path d="M606 186 L632 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="642" y="126" width="256" height="120" rx="16" fill="#e6e9f5" stroke="#cfc4b4"/><text x="660" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 3</text><text x="660" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">使者送符</text><path d="M906 186 L932 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="942" y="126" width="256" height="120" rx="16" fill="#f3e3ea" stroke="#cfc4b4"/><text x="960" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 4</text><text x="960" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">按长度查表</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a89a86"/></marker></defs><rect x="42" y="272" width="1156" height="204" rx="14" fill="#fffdf8" stroke="#d8cfc2"/><text x="62" y="300" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">核心公式</text><text x="62" y="320" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">M = D(L), L ∈ {10,9,8,7,6,5,4,3} cun</text><text x="62" y="342" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">L_i = 11 − i, i=1,...,8</text><text x="62" y="364" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">|M| = 8 ⇒ H(M) ≤ log2 8 = 3 bit</text><text x="62" y="386" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">no text on the tally: only length is visible</text><text x="62" y="408" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">codebook D shared by ruler and commander</text><text x="62" y="444" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">阴符把军情压进八种长度：一尺表示大胜，九寸表示破军杀将，依次到三寸表示失利亡士。它没有文字，敌人只能看到一根符的长短；没有共享码本，长度本身不说明任何含义。</text><rect x="42" y="496" width="1156" height="190" rx="14" fill="#f8f4eb" stroke="#d8cfc2"/><text x="62" y="524" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">参数与边界</text><text x="62" y="548" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">符号：8 等，长度 1 尺、9/8/7/6/5/4/3 寸；1 尺=10 寸，步长 1 寸。</text><text x="62" y="592" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">信息量：8 个预设军情，单符至多 3 bit；只能表达约定表内的消息。</text><text x="62" y="636" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">边界：符长可被观察，码本被缴获即失效；阴符不等于可加密任意文本的密码。</text><text x="42" y="714" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#4a433a">读法：先核对码本、分片与乱数假设，再检查消息集、共享文本与失效条件；图不替代《六韬》《武经总要》原文或党史考证。</text><text x="42" y="786" font-family="Inter,Noto Sans SC,sans-serif" font-size="12" fill="#8b7d6b">原创公式级机制图 · CC BY 4.0 · poyi knowledge · 2026-11-23</text></svg>