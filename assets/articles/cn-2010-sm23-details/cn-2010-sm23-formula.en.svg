<text x="112" y="614" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">SM2 and SM3 were released in 2010, adding public-key signatures and a hash to the SM family. The card gives</text>
<text x="112" y="632" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">comparable parameters: a 256-bit prime-field curve, 256-bit order and 256-bit digest</text>
