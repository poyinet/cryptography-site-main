<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">双重换位密码</title>
<desc id="fig-desc">术语 · 为什么—怎么做—哪里失效</desc>
<rect x="0" y="0" width="1240" height="820" fill="#F7F5EF"/>
<text x="60" y="54" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#6B655C">术语</text>
<text x="60" y="108" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="38" font-weight="800" fill="#1F1D1A">双重换位密码</text>
<text x="60" y="150" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#6B655C">从正文提炼的一条解释线：先看问题，再看机制，最后看失效条件。</text>
<rect x="50" y="205" width="350" height="405" rx="22" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="2"/>
<rect x="72" y="227" width="42" height="42" rx="13" fill="#ECE9FA"/><text x="93" y="257" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="800" fill="#4B3F9E" text-anchor="middle">1</text>
<text x="74" y="310" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="800" fill="#4B3F9E">定义</text>
<text x="74" y="358" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">为什么值得再做一次：讲义在同一</text>
<text x="74" y="385" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">处把代价对照写得很直白——单层</text>
<text x="74" y="412" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">栏式换位的还原虽繁但可行，长报</text>
<text x="74" y="439" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">文尤其如此；再加一层是把手工重</text>
<text x="74" y="466" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">排的搜索推得更深，其评估是提高</text>
<text x="74" y="493" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">还原难度而不改变问题性质。于是</text>
<text x="74" y="520" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">这一层存在的理由是工作量，不是</text>
<text x="74" y="547" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">不可解。</text>
<line x1="410" y1="400" x2="475" y2="400" stroke="#4B3F9E" stroke-width="3"/><path d="M465 393 L475 400 L465 407" fill="none" stroke="#4B3F9E" stroke-width="3"/>
<rect x="445" y="205" width="350" height="405" rx="22" fill="#FFFFFF" stroke="#1F7A6A" stroke-width="2"/>
<rect x="467" y="227" width="42" height="42" rx="13" fill="#E2F3EE"/><text x="488" y="257" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="800" fill="#1F7A6A" text-anchor="middle">2</text>
<text x="469" y="310" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="800" fill="#1F7A6A">机制</text>
<text x="469" y="358" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">机制只有一句话可引：讲义把双重</text>
<text x="469" y="389" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">换位写作在两个不同关键词下各排</text>
<text x="469" y="420" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">一次格——「with two</text>
<text x="469" y="451" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">different keywords」，先做一</text>
<text x="469" y="482" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">次栏式换位、再对结果做一次。它</text>
<text x="469" y="513" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">只说明两次叠用的构成，不进一步</text>
<text x="469" y="544" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">交代操作细节，也不给公式。</text>
<line x1="805" y1="400" x2="870" y2="400" stroke="#1F7A6A" stroke-width="3"/><path d="M860 393 L870 400 L860 407" fill="none" stroke="#1F7A6A" stroke-width="3"/>
<rect x="840" y="205" width="350" height="405" rx="22" fill="#FFFFFF" stroke="#8A6100" stroke-width="2"/>
<rect x="862" y="227" width="42" height="42" rx="13" fill="#FFF3CD"/><text x="883" y="257" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="800" fill="#8A6100" text-anchor="middle">3</text>
<text x="864" y="310" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="800" fill="#8A6100">误用</text>
<text x="864" y="358" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">限度由定义给出：HAC 把两个以</text>
<text x="864" y="389" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">上简单换位的相继复合称作复合换</text>
<text x="864" y="420" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">位（「is called a compound</text>
<text x="864" y="451" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">transposition」），紧随其后</text>
<text x="864" y="482" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">的事实说明它等价于一个周期为各</text>
<text x="864" y="513" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="500" fill="#1F1D1A">层周期最小公倍数的单一换位。</text>
<rect x="60" y="650" width="1120" height="95" rx="18" fill="#ECE9FA"/>
<text x="84" y="685" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="800" fill="#4B3F9E">怎么用这张图</text>
<text x="84" y="718" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#1F1D1A">先读第一栏确认它解决的问题，再看中间一栏的机制，最后用第三栏的失效条件检验任何“绝对安全”的说法。</text>
<line x1="60" y1="774" x2="1180" y2="774" stroke="#DED9CE" stroke-width="1.5"/><text x="60" y="800" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" fill="#6B655C">原创示意图 · CC BY 4.0 · poyi knowledge · 2026-11-21 · 文字摘自本篇正文</text>
</svg>
