<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">电磁分析</title>
<desc id="fig-desc">芯片翻转时，电磁场把中间值带出封装 — mechanism schematic with parameters, use and limits.</desc>
<defs>
<marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4B3F9E"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1F7A6A"/></marker>
<marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8A6100"/></marker>
<marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9B2C2C"/></marker>
<marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B655C"/></marker>
<clipPath id="mainClip"><rect x="50" y="185" width="760" height="450" rx="16"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="820" fill="#F7F5EF"/>
<text x="60" y="52" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#6B655C" text-anchor="left">侧信道 · 电磁泄漏</text>
<text x="60" y="104" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="37" font-weight="800" fill="#1F1D1A" text-anchor="left">电磁分析</text>
<text x="60" y="143" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#6B655C" text-anchor="left">近场探头 · 轨迹对齐 · 相关/差分分析</text>
<rect x="50" y="185" width="760" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="78" y="224" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="800" fill="#1F1D1A" text-anchor="left">芯片翻转时，电磁场把中间值带出封装</text>
<g clip-path="url(#mainClip)">
<text x="80" y="255" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F1D1A" text-anchor="left">芯片翻转的电磁场经探头、轨迹与假设检验变成密钥候选</text>
<rect x="80" y="285" width="155" height="88" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="157.5" y="305" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">芯片 / 模块</text>
<text x="157.5" y="322" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">S 盒、寄存器或总线</text>
<line x1="237" y1="329" x2="278" y2="329" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<rect x="278" y="285" width="160" height="88" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="358" y="305" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">近场探头</text>
<text x="358" y="322" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">H / E field</text>
<line x1="440" y1="329" x2="482" y2="329" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<rect x="482" y="285" width="160" height="88" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="562" y="305" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6100" text-anchor="middle">示波器轨迹</text>
<text x="562" y="322" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">L(t)</text>
<line x1="644" y1="329" x2="686" y2="329" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<rect x="686" y="285" width="105" height="88" rx="10" fill="#FBE9E9" stroke="#9B2C2C" stroke-width="1.6"/>
<text x="738.5" y="305" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#9B2C2C" text-anchor="middle">密钥排序</text>
<text x="738.5" y="322" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">k*</text>
<rect x="80" y="405" width="710" height="40" rx="8" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1"/>
<text x="94" y="431" font-family="'Consolas','SFMono-Regular',monospace" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="left">L(t) = a·HW(v(t)) + b + n(t)</text>
<rect x="80" y="460" width="710" height="40" rx="8" fill="#ECE9FA" stroke="#1F7A6A" stroke-width="1"/>
<text x="94" y="486" font-family="'Consolas','SFMono-Regular',monospace" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="left">DPA：Δ(t) = E[L(t)|b=0] - E[L(t)|b=1]</text>
<rect x="80" y="515" width="710" height="40" rx="8" fill="#ECE9FA" stroke="#8A6100" stroke-width="1"/>
<text x="94" y="541" font-family="'Consolas','SFMono-Regular',monospace" font-size="13" font-weight="700" fill="#8A6100" text-anchor="left">CPA：ρ(t,k) = Cov(L,H_k) / √(Var L · Var H_k)</text>
<text x="80" y="575" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="600" fill="#1F1D1A" text-anchor="left">正确假设在某个时刻给出稳定极值；错误假设的峰值随轨迹数增加而消退。</text>
<text x="80" y="605" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="600" fill="#9B2C2C" text-anchor="left">边界：掩码、随机延迟、双轨逻辑、屏蔽与探头距离都会降低信噪比。</text>
</g>
<rect x="830" y="185" width="360" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<rect x="835" y="205" width="350" height="132" rx="12" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.2"/>
<text x="851" y="229" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#4B3F9E" text-anchor="left">物理量</text>
<circle cx="854" cy="252" r="2.5" fill="#4B3F9E"/>
<text x="864" y="256" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">L(t) = a·HW(v(t)) + b + n(t)</text>
<circle cx="854" cy="280" r="2.5" fill="#4B3F9E"/>
<text x="864" y="284" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">近场 H/E 探头</text>
<rect x="835" y="345" width="350" height="132" rx="12" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.2"/>
<text x="851" y="369" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#1F7A6A" text-anchor="left">统计</text>
<circle cx="854" cy="392" r="2.5" fill="#1F7A6A"/>
<text x="864" y="396" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">Δ(t) = E[L|b=0] - E[L|b=1]</text>
<circle cx="854" cy="420" r="2.5" fill="#1F7A6A"/>
<text x="864" y="424" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">ρ(t,k) = Cov(L,H_k)/√(Var L·Var H_k)</text>
<rect x="835" y="485" width="350" height="132" rx="12" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.2"/>
<text x="851" y="509" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#8A6100" text-anchor="left">目标</text>
<circle cx="854" cy="532" r="2.5" fill="#8A6100"/>
<text x="864" y="536" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">AES S 盒</text>
<circle cx="854" cy="560" r="2.5" fill="#8A6100"/>
<text x="864" y="564" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">RSA 模幂 / ECC 标量乘</text>
<rect x="50" y="660" width="1140" height="105" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="74" y="690" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="800" fill="#4B3F9E" text-anchor="left">怎么读这张图</text>
<text x="74" y="716" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">读法：电磁分析不是“用探头直接读密钥”，而是把芯片翻转的电磁轨迹对齐，按候选密钥建立中间值模型，再用差分或相关统计找出正确假设。</text>
<text x="74" y="739" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">探头位置、轨迹数量和信噪比决定成败。</text>
<line x1="60" y1="782" x2="1180" y2="782" stroke="#DED9CE" stroke-width="1.2"/>
<text x="60" y="804" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">原创机制示意图 · CC BY 4.0 · poyi knowledge · 2026-11-22 · 定理陈述与界据所引论文绘制</text>
</svg>
