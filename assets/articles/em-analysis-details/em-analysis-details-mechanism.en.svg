<text x="78" y="224" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="800" fill="#1F1D1A" text-anchor="left">Gate switching leaks intermediates as an EM field</text>
<g clip-path="url(#mainClip)">
<text x="80" y="255" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F1D1A" text-anchor="left">Gate switching becomes an EM field, then traces, then a key hypothesis</text>
