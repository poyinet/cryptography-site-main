<text x="157.5" y="305" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">chip / module</text>
<text x="157.5" y="322" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">S-box, register or bus</text>
<line x1="237" y1="329" x2="278" y2="329" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<rect x="278" y="285" width="160" height="88" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
