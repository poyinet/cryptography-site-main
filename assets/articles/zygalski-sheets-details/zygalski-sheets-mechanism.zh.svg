<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="齐加尔斯基记录表 mechanism"><rect width="1240" height="820" fill="#fbf8f1"/><text x="42" y="58" font-family="Georgia,Noto Serif SC,serif" font-size="32" font-weight="700" fill="#2d2a24">齐加尔斯基记录表</text><text x="42" y="90" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#7a6f5f">公式级机制：步骤、参数、适用与失效边界</text><rect x="42" y="126" width="256" height="120" rx="16" fill="#f6e7d7" stroke="#cfc4b4"/><text x="60" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 1</text><text x="60" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">识别 female</text><path d="M306 186 L332 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="342" y="126" width="256" height="120" rx="16" fill="#e4efe6" stroke="#cfc4b4"/><text x="360" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 2</text><text x="360" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">按转子顺序制表</text><path d="M606 186 L632 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="642" y="126" width="256" height="120" rx="16" fill="#e6e9f5" stroke="#cfc4b4"/><text x="660" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 3</text><text x="660" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">叠加并平移</text><path d="M906 186 L932 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="942" y="126" width="256" height="120" rx="16" fill="#f3e3ea" stroke="#cfc4b4"/><text x="960" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">步骤 4</text><text x="960" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="18" font-weight="600" fill="#2d2a24">读取唯一孔位</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a89a86"/></marker></defs><rect x="42" y="272" width="1156" height="204" rx="14" fill="#fffdf8" stroke="#d8cfc2"/><text x="62" y="300" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">核心公式</text><text x="62" y="314" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">female: c_i=c_{i+3}, i∈{1,2,3} (1-4, 2-5, 3-6)</text><text x="62" y="336" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">Z_{o,ℓ}: 26×26 grid for middle/right positions</text><text x="62" y="358" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">6 rotor orders × 26 left positions = 156 sheets (3 rotors)</text><text x="62" y="380" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">5 rotors: 60 orders × 26 = 1,560 sheets</text><text x="62" y="402" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">about 10-12 females ⇒ intersection to one aperture</text><text x="62" y="424" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">total settings: 6×26^3=105,456; 60×26^3=1,054,560</text><text x="62" y="444" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">每张表对应一种转子顺序和一个左转子位置；孔位表示“该中/右转子位置可能产生 female”。多张表按指示字母平移叠加，唯一透光孔就是候选设置。</text><rect x="42" y="496" width="1156" height="190" rx="14" fill="#f8f4eb" stroke="#d8cfc2"/><text x="62" y="524" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">参数与边界</text><text x="62" y="548" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">输入：双倍加密的 6 字母指示，female 出现在 1-4、2-5 或 3-6 位。</text><text x="62" y="592" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">规模：3 转子时 6×26=156 张；5 转子时 60×26=1,560 张；每张 26×26 网格、约 1,000 个孔。</text><text x="62" y="636" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">边界：1940 年 5 月德国停止双倍加密指示后失效；需要约 10-12 条 female，单条报文不足以定位。</text><text x="42" y="714" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#4a433a">读法：先核对假设、攻击模型与参数，再检查密钥调度、数据量与失效条件；图不替代论文定理或历史原文。</text><text x="42" y="786" font-family="Inter,Noto Sans SC,sans-serif" font-size="12" fill="#8b7d6b">原创公式级机制图 · CC BY 4.0 · poyi knowledge · 2026-11-23</text></svg>