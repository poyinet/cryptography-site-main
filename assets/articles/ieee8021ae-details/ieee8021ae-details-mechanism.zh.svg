<circle cx="854" cy="532" r="2.5" fill="#8A6100"/>
<text x="864" y="536" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">CAK → MKA → SAK</text>
<circle cx="854" cy="560" r="2.5" fill="#8A6100"/>
<text x="864" y="564" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">AN 两位 · 4 个 SA</text>
<rect x="50" y="660" width="1140" height="105" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="74" y="690" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="800" fill="#4B3F9E" text-anchor="left">怎么读这张图</text>
<text x="74" y="716" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">读法：上方是以太网帧从 DA/SA 到 FCS 的字段顺序，SecTAG 插在 SA 之后，ICV 在帧尾；下方是 MKA 用 </text>
<text x="74" y="739" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">CAK 选出密钥服务器并分发 SAK。接收端用 SCI+PN 构造 IV，验证 ICV 并检查重放窗口。</text>
