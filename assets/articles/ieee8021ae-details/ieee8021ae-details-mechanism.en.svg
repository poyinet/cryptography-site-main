<text x="60" y="104" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="37" font-weight="800" fill="#1F1D1A" text-anchor="left">MACsec link encryption (IEEE 802.1AE)</text>
<text x="60" y="143" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#6B655C" text-anchor="left">SecTAG + AES-GCM + MKA</text>
