<text x="70" y="250" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="800" fill="#4B3F9E" text-anchor="left">ETHERNET FRAME</text>
<rect x="70" y="265" width="55" height="58" rx="10" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="97.5" y="299" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">DA</text>
<rect x="125" y="265" width="55" height="58" rx="10" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="152.5" y="299" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">SA</text>
<rect x="180" y="265" width="75" height="58" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
