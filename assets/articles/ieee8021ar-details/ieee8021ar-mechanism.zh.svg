<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="安全设备标识">
<rect width="1240" height="820" fill="#f6f3ea"/>
<rect x="28" y="24" width="1184" height="784" rx="18" fill="#fffdf7" stroke="#d8d2c4" stroke-width="1.5"/>
<text x="80" y="74" font-size="28" font-weight="700" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">安全设备标识</text>
<text x="82" y="104" font-size="14" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6c7486">IDevID / LDevID · 证书绑定 · 注册证明</text>
<rect x="80" y="120" width="1080" height="1" fill="#ded8c8"/>
<text x="82" y="144" font-size="12" letter-spacing="1.2" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">公式级 · 可复述、可核源、可对照</text>
<rect x="80" y="170" width="250" height="150" rx="10" fill="#fffaf0" stroke="#c8a24b" stroke-width="1.2"/>
<circle cx="106" cy="196" r="14" fill="#c8a24b"/>
<text x="106" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">1</text>
<text x="128" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 1</text>
<text x="104" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">厂商烧录 IDevID</text>
<text x="104" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">定义 / 输入</text>
<rect x="350" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="376" cy="196" r="14" fill="#14213d"/>
<text x="376" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">2</text>
<text x="398" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 2</text>
<text x="374" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">设备证明私钥</text>
<text x="374" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">变换 / 方程</text>
<rect x="620" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="646" cy="196" r="14" fill="#14213d"/>
<text x="646" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">3</text>
<text x="668" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 3</text>
<text x="644" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">域 CA 签发 LDevID</text>
<text x="644" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">观测 / 解码</text>
<rect x="890" y="170" width="250" height="150" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<circle cx="916" cy="196" r="14" fill="#14213d"/>
<text x="916" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">4</text>
<text x="938" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 4</text>
<text x="914" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">链验证与授权</text>
<text x="914" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">边界 / 结果</text>
<rect x="80" y="350" width="1080" height="200" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<text x="102" y="382" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">核心公式与量级</text>
<text x="112" y="412" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">DevID = (SK_dev, Cert_dev)</text>
<text x="112" y="429" font-size="14" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Cert_IDevID = Sign(SK_mfr, {vendor, model, serial, PK_dev})</text>
<text x="112" y="446" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">LDevID binding: H(Cert_IDevID) = fp_IDevID</text>
<text x="112" y="463" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Enroll: proof = Sign(SK_IDevID, nonce || domainID)</text>
<text x="112" y="480" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Verify: Verify(PK_IDevID, proof) ∧ path(Cert_LDevID)</text>
<text x="112" y="497" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">Cert fields: version, serial, sig, issuer, validity</text>
<text x="112" y="514" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">  subject, subjectPublicKeyInfo, extensions</text>
<text x="112" y="531" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">IDevID: global, manufacturer; LDevID: local, domain CA</text>
<rect x="80" y="570" width="1080" height="190" rx="10" fill="#fbfaf4" stroke="#ded8c8" stroke-width="1.2"/>
<text x="102" y="590" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">细节 / 参数 / 边界</text>
<text x="112" y="614" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">DevID 是设备私钥加 X.509 证书；IDevID 由厂商提供、全局唯一，私钥不可导出或修改。</text>
<text x="112" y="632" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">LDevID 由本地管理员/域 CA 签发，必须绑定到同一设备的 IDevID，换设备无法复用。</text>
<text x="112" y="650" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">注册证明用 IDevID 私钥签 nonce 与域标识；验证方验签并验 LDevID 到信任锚的证书链。</text>
<text x="112" y="668" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">证书字段按 RFC 5280；设备序列号可放 subject 或 SAN otherName，2018 版新增 ECDSA P-384/SHA-384。</text>
<text x="112" y="688" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">版本：IEEE 802.1AR-2018 于 2018-08-02 发布，现行；IEEE GET 计划提供免费 PDF。</text>
<text x="112" y="706" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">标识：IDevID 厂商级、LDevID 域级；证书链、SAN otherName、硬件序列号与密钥用途。</text>
<text x="112" y="724" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">边界：证书只证明密钥与身份绑定，不授权业务角色；吊销、时钟、密钥保护仍要单独做。</text>
<text x="80" y="774" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">来源：IEEE 802.1AR-2018 官方记录与工作组说明、IEC/IEEE 60802 IDevID 配置草案、RFC 9733 BRSKI-AE 与 RFC 5280。</text>
<text x="80" y="790" font-size="11.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6f7788">边界：DevID 不是用户名/口令，也不是 EAP 本身；它是可被 EAP-TLS/BRSKI 使用的设备身份。</text>
<text x="80" y="806" font-size="11.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6f7788">IDevID 泄露等于设备身份被盗；LDevID 不能脱离 IDevID 绑定单独迁移。</text>
<text x="1160" y="806" text-anchor="end" font-size="10" font-family="ui-monospace, Consolas, monospace" fill="#a39c8a">R132 · 2026-11-24 · ieee8021ar-details</text>
</svg>