<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="Universally Composable Security (UC) mechanism"><rect width="1240" height="820" fill="#fbf8f1"/><text x="42" y="58" font-family="Georgia,Noto Serif SC,serif" font-size="32" font-weight="700" fill="#2d2a24">Universally Composable Security (UC)</text><text x="42" y="90" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#7a6f5f">Formula-level mechanism: steps, parameters, use and failure boundary</text><rect x="42" y="126" width="256" height="120" rx="16" fill="#f6e7d7" stroke="#cfc4b4"/><text x="60" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 1</text><text x="60" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">real execution</text><text x="60" y="208" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">π,A,Z</text><path d="M306 186 L332 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="342" y="126" width="256" height="120" rx="16" fill="#e4efe6" stroke="#cfc4b4"/><text x="360" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 2</text><text x="360" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">ideal execution</text><text x="360" y="208" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">F,S,Z</text><path d="M606 186 L632 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="642" y="126" width="256" height="120" rx="16" fill="#e6e9f5" stroke="#cfc4b4"/><text x="660" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 3</text><text x="660" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">environment</text><text x="660" y="208" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">indistinguishability</text><path d="M906 186 L932 186" stroke="#a89a86" stroke-width="3" marker-end="url(#a)"/><rect x="942" y="126" width="256" height="120" rx="16" fill="#f3e3ea" stroke="#cfc4b4"/><text x="960" y="154" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">STEP 4</text><text x="960" y="184" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">composition and</text><text x="960" y="208" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">non-black-box</text><text x="960" y="232" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#2d2a24">boundary</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a89a86"/></marker></defs><rect x="42" y="272" width="1156" height="204" rx="14" fill="#fffdf8" stroke="#d8cfc2"/><text x="62" y="300" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">CORE FORMULAS</text><text x="62" y="328" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">∀A ∃S ∀Z: EXEC_{π,A,Z}(k,a)≈EXEC_{F,S,Z}(k,a)</text><text x="62" y="355" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">|Pr[Z=1|real]−Pr[Z=1|ideal]|≤negl(k)</text><text x="62" y="382" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">π UC-realizes F ⇒ ρ^π UC-realizes ρ^F</text><text x="62" y="409" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" fill="#2d2a24">Barak: Sim(code(A)) ⇒ constant-round concurrent ZK argument (CRH)</text><text x="62" y="444" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">Z supplies inputs and reads outputs; A controls the real network, S simulates the same view in the ideal</text><text x="62" y="466" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#4a433a">execution; composition replaces a proved π inside any context ρ.</text><rect x="42" y="496" width="1156" height="190" rx="14" fill="#f8f4eb" stroke="#d8cfc2"/><text x="62" y="524" font-family="Inter,Noto Sans SC,sans-serif" font-size="13" fill="#8a5a3b">PARAMETERS AND BOUNDARY</text><text x="62" y="548" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">Security parameter k and auxiliary input a; environment Z is polynomial time, A/S are polynomial time, and negl(k) is</text><text x="62" y="567" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">a negligible function.</text><text x="62" y="592" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">Ideal functionality F specifies inputs, outputs, leakage and errors; composition is written ρ^π and ρ^F, allowing</text><text x="62" y="611" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">concurrency, nesting and arbitrary protocol contexts.</text><text x="62" y="636" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">Boundary: under plain UC some tasks need setup (CRS/PKI/trusted party) or non-black-box simulation; Barak&#39;s technique</text><text x="62" y="655" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#3b352d">does not automatically yield efficient deployable protocols and does not cover implementation side channels.</text><text x="42" y="714" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#4a433a">Read the assumptions, reduction direction and parameters first, then check implementation modes and failure conditions; the</text><text x="42" y="736" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#4a433a">diagram does not replace a paper theorem or clause text.</text><text x="42" y="786" font-family="Inter,Noto Sans SC,sans-serif" font-size="12" fill="#8b7d6b">Original formula-level mechanism diagram · CC BY 4.0 · poyi knowledge · 2026-11-23</text></svg>