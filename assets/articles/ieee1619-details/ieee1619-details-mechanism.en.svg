<rect x="360" y="260" width="110" height="50" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="415" y="290" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">E_K2</text>
<line x1="335" y1="285" x2="360" y2="285" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<rect x="495" y="260" width="130" height="50" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
