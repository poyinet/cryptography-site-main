<text x="560" y="296" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">GF(2¹²⁸)</text>
<line x1="470" y1="285" x2="495" y2="285" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<rect x="300" y="330" width="130" height="45" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="365" y="350" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6100" text-anchor="middle">T_j</text>
<text x="365" y="366" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">128 bit</text>
