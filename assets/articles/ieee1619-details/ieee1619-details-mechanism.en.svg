<text x="130" y="422" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#4B3F9E" text-anchor="middle">Plaintext P_j</text>
<text x="130" y="441" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">128 bit</text>
<circle cx="230" cy="425" r="14" fill="#FFFFFF" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="230" y="430" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="800" fill="#4B3F9E" text-anchor="middle">⊕</text>
<line x1="190" y1="425" x2="216" y2="425" stroke="#4B3F9E" stroke-width="2"  marker-end="url(#arrowPurple)"/>
<line x1="300" y1="350" x2="245" y2="420" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<rect x="265" y="400" width="130" height="50" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="330" y="420" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">AES E_K1</text>
<text x="330" y="436" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">data key</text>
<line x1="244" y1="425" x2="265" y2="425" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<circle cx="435" cy="425" r="14" fill="#FFFFFF" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="435" y="430" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="800" fill="#1F7A6A" text-anchor="middle">⊕</text>
<line x1="395" y1="425" x2="421" y2="425" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<line x1="430" y1="375" x2="435" y2="411" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<rect x="470" y="400" width="120" height="50" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="530" y="422" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#4B3F9E" text-anchor="middle">Ciphertext C_j</text>
<text x="530" y="441" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="middle">128 bit</text>
<line x1="449" y1="425" x2="470" y2="425" stroke="#1F7A6A" stroke-width="2"  marker-end="url(#arrowGreen)"/>
<text x="78" y="505" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="left">C_j = E_K1(P_j ⊕ T_j) ⊕ T_j</text>
<text x="78" y="535" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#6B655C" text-anchor="left">T_j = E_K2(i) ⊗ α^j, the address tweak needs no storage</text>
<rect x="620" y="470" width="150" height="60" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="695" y="490" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6100" text-anchor="middle">Ciphertext stealing</text>
<text x="695" y="506" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">last 2 blocks, no pad</text>
<text x="78" y="585" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="600" fill="#9B2C2C" text-anchor="left">Data unit ≤ 2^20 AES blocks (16 MiB); one key pair ≤ 2^36–2^44 blocks</text>
</g>
<rect x="830" y="185" width="360" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
