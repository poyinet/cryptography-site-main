<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">One-Way Functions Imply P≠NP</title>
<desc id="fig-desc">If P=NP, every one-way function falls — mechanism schematic with parameters, use and limits.</desc>
<defs>
<marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4B3F9E"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1F7A6A"/></marker>
<marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8A6100"/></marker>
<marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9B2C2C"/></marker>
<marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B655C"/></marker>
<clipPath id="mainClip"><rect x="50" y="185" width="760" height="450" rx="16"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="820" fill="#F7F5EF"/>
<text x="60" y="52" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#6B655C" text-anchor="left">COMPLEXITY FOUNDATIONS · AVERAGE-CASE HARDNESS</text>
<text x="60" y="104" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="37" font-weight="800" fill="#1F1D1A" text-anchor="left">One-Way Functions Imply P≠NP</text>
<text x="60" y="143" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="500" fill="#6B655C" text-anchor="left">OWF definition · NP search · contrapositive</text>
<rect x="50" y="185" width="760" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="78" y="224" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="800" fill="#1F1D1A" text-anchor="left">If P=NP, every one-way function falls</text>
<g clip-path="url(#mainClip)">
<text x="80" y="255" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F1D1A" text-anchor="left">Write inversion as NP search, then collapse it with P=NP</text>
<rect x="80" y="280" width="175" height="72" rx="10" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.6"/>
<text x="167.5" y="300" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="middle">x → f(x)=y</text>
<text x="167.5" y="317" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">one-way function</text>
<rect x="305" y="280" width="175" height="72" rx="10" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.6"/>
<text x="392.5" y="300" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A6A" text-anchor="middle">A(y) → x′</text>
<text x="392.5" y="317" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">adversary inverts</text>
<line x1="258" y1="316" x2="303" y2="316" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<rect x="535" y="280" width="210" height="72" rx="10" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.6"/>
<text x="640" y="300" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6100" text-anchor="middle">L_y = {x : f(x)=y}</text>
<text x="640" y="317" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">NP language, witness x</text>
<line x1="483" y1="316" x2="533" y2="316" stroke="#8A6100" stroke-width="2"  marker-end="url(#arrowAmber)"/>
<text x="80" y="405" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="800" fill="#9B2C2C" text-anchor="left">Assume P=NP</text>
<rect x="80" y="425" width="210" height="62" rx="10" fill="#FBE9E9" stroke="#9B2C2C" stroke-width="1.6"/>
<text x="185" y="445" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#9B2C2C" text-anchor="middle">L_y ∈ NP</text>
<text x="185" y="462" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">polynomial decider</text>
<line x1="185" y1="490" x2="185" y2="510" stroke="#9B2C2C" stroke-width="2"  marker-end="url(#arrowRed)"/>
<rect x="80" y="515" width="210" height="62" rx="10" fill="#FBE9E9" stroke="#9B2C2C" stroke-width="1.6"/>
<text x="185" y="535" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#9B2C2C" text-anchor="middle">find a preimage</text>
<text x="185" y="552" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="500" fill="#6B655C" text-anchor="middle">for each y in poly time</text>
<text x="350" y="435" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="800" fill="#9B2C2C" text-anchor="left">violates OWF definition</text>
<text x="350" y="465" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#1F1D1A" text-anchor="left">so P=NP ⇒ no OWF</text>
<rect x="350" y="500" width="390" height="40" rx="8" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1"/>
<text x="364" y="526" font-family="'Consolas','SFMono-Regular',monospace" font-size="13" font-weight="700" fill="#4B3F9E" text-anchor="left">OWF exists ⇒ P≠NP</text>
<text x="350" y="570" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="600" fill="#6B655C" text-anchor="left">Converse fails: P≠NP does not guarantee average-case hardness.</text>
</g>
<rect x="830" y="185" width="360" height="450" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<rect x="835" y="205" width="350" height="132" rx="12" fill="#ECE9FA" stroke="#4B3F9E" stroke-width="1.2"/>
<text x="851" y="229" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#4B3F9E" text-anchor="left">OWF</text>
<circle cx="854" cy="252" r="2.5" fill="#4B3F9E"/>
<text x="864" y="256" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">easy f(x)</text>
<circle cx="854" cy="280" r="2.5" fill="#4B3F9E"/>
<text x="864" y="284" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">hard to find preimage x</text>
<rect x="835" y="345" width="350" height="132" rx="12" fill="#E2F3EE" stroke="#1F7A6A" stroke-width="1.2"/>
<text x="851" y="369" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#1F7A6A" text-anchor="left">NP LANGUAGE</text>
<circle cx="854" cy="392" r="2.5" fill="#1F7A6A"/>
<text x="864" y="396" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">L = {(y,x): f(x)=y}</text>
<circle cx="854" cy="420" r="2.5" fill="#1F7A6A"/>
<text x="864" y="424" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">witness is a preimage x</text>
<rect x="835" y="485" width="350" height="132" rx="12" fill="#FFF3CD" stroke="#8A6100" stroke-width="1.2"/>
<text x="851" y="509" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="800" fill="#8A6100" text-anchor="left">CONSEQUENCE</text>
<circle cx="854" cy="532" r="2.5" fill="#8A6100"/>
<text x="864" y="536" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">P=NP ⇒ no OWF</text>
<circle cx="854" cy="560" r="2.5" fill="#8A6100"/>
<text x="864" y="564" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#1F1D1A" text-anchor="left">OWF ⇒ P≠NP</text>
<rect x="50" y="660" width="1140" height="105" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="74" y="690" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="800" fill="#4B3F9E" text-anchor="left">How to read this figure</text>
<text x="74" y="716" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">Reading: a one-way function is average-case hardness; P=NP is a worst-case algorithmic statement. The arrow goes</text>
<text x="74" y="739" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#1F1D1A" text-anchor="left">from OWF to P≠NP, never back. P≠NP alone does not make any function hard for an average adversary.</text>
<line x1="60" y1="782" x2="1180" y2="782" stroke="#DED9CE" stroke-width="1.2"/>
<text x="60" y="804" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="500" fill="#6B655C" text-anchor="left">Original mechanism diagram · CC BY 4.0 · poyi knowledge · 2026-11-22 · statements and bounds drawn from the cited papers</text>
</svg>
