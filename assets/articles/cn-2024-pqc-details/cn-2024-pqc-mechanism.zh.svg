<text x="916" y="201" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">4</text>
<text x="938" y="201" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">步骤 4</text>
<text x="914" y="232" font-size="15" font-weight="600" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#14213d">国内标准进展</text>
<text x="914" y="304" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">边界 / 结果</text>
<rect x="80" y="350" width="1080" height="200" rx="10" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.2"/>
<text x="102" y="382" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">核心公式与量级</text>
<text x="112" y="412" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">ML-KEM: |ek|/|dk|/|ct| = 800/1632/768 B (512)</text>
<text x="112" y="429" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">  1184/2400/1088 (768); 1568/3168/1568 (1024)</text>
<text x="112" y="446" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">ML-DSA: |pk|/|sk|/|sig| = 1312/2560/2420 B (44)</text>
<text x="112" y="463" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">  1952/4032/3309 (65); 2592/4896/4627 (87)</text>
<text x="112" y="480" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">SLH-DSA sig = 7856/17088/16224/35664/29792/49856 B</text>
<text x="112" y="497" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">categories: KEM 1/3/5; DSA 2/3/5; SLH-DSA 1/3/5</text>
<text x="112" y="514" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">NIST FIPS 203/204/205: published 2024-08-13</text>
<text x="112" y="531" font-size="14" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#14213d">China: SM3-LMS/HSS project (2023); X25519Kyber768 test (2024-11)</text>
<rect x="80" y="570" width="1080" height="190" rx="10" fill="#fbfaf4" stroke="#ded8c8" stroke-width="1.2"/>
<text x="102" y="590" font-size="12" font-weight="700" letter-spacing="1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#9a7b2f">细节 / 参数 / 边界</text>
<text x="112" y="614" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">2024-08-13 NIST 发布 FIPS 203（ML-KEM）、FIPS 204（ML-DSA）、FIPS 205（SLH-DSA）。</text>
<text x="112" y="632" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">ML-KEM 三档封装键/解封装键/密文；ML-DSA 三档公钥/私钥/签名；SLH-DSA 12 个参数集。</text>
<text x="112" y="650" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">2024-11 中国信通院完成 X25519Kyber768Draft00 混合加密网关升级验证，性能与现有算法基本一致。</text>
<text x="112" y="668" font-size="13" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#27324a">国内 SM3 基 LMS/HSS 标准项目 2023 年底立项；2024-12 发布的 GM/T 标准属于通用密码标准，不等于 PQC 国标已发布。</text>
<text x="112" y="688" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">ML-KEM：n=256、q=3329，三档安全类别 1/3/5；共享密钥 32 字节。</text>
<text x="112" y="706" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">ML-DSA：q=8380417，三档安全类别 2/3/5；SLH-DSA n=16/24/32，12 个参数集。</text>
<text x="112" y="724" font-size="12.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5a647a">边界：PQC 抗量子攻击公钥密码分析，不自动抗侧信道/实现故障；迁移应混合部署并验证协议与性能。</text>
<text x="80" y="774" font-size="11" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#8a8f9c">来源：NIST FIPS 203/204/205 全文、中国信通院 PQC 网关验证报道、国家密码管理局公告第50号、电信科学 SM3-LMS/HSS 标准化综述。</text>
<text x="80" y="790" font-size="11.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6f7788">边界：PQC ≠ 全栈安全；密钥/签名变大，会冲击带宽、存储、证书链与固件。</text>
<text x="80" y="806" font-size="11.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6f7788">国内 PQC 标准仍在推进；不能把 FIPS 编号写成中国国标，也不能把立项写成已发布。</text>
<text x="1160" y="806" text-anchor="end" font-size="10" font-family="ui-monospace, Consolas, monospace" fill="#a39c8a">R132 · 2026-11-24 · cn-2024-pqc-details</text>
</svg>