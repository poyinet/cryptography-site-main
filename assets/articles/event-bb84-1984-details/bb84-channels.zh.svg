<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="title desc">
<title id="title">两张信道，两种信任</title>
<desc id="desc">示意图：上方量子信道传单光子，Eve 的测量会扰动；下方公开经典信道用于公布基和比对子集，可被被动窃听但不能被注入或篡改；若要防主动攻击，需要预先共享小密钥做认证。</desc>
<defs><filter id="soft" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F1D1A" flood-opacity="0.07"/></filter></defs>
<rect width="1400" height="760" fill="#F7F5EF"/>
<text x="58" y="68" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">两张信道，两种信任</text>
<text x="58" y="106" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">BB84 的安全性不只来自量子物理，也来自对公开信道的前提。</text>
<rect x="58" y="150" width="1284" height="232" rx="18" fill="#FFFFFF" filter="url(#soft)"/>
<rect x="82" y="174" width="170" height="36" rx="10" fill="#ECE9FA"/>
<text x="167.0" y="197.1" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#4B3F9E" text-anchor="middle">量子信道</text>
<rect x="100" y="240" width="190" height="90" rx="14" fill="#ECE9FA"/>
<text x="122" y="276" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#4B3F9E" text-anchor="start">Alice</text>
<text x="122" y="306" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">发送单光子</text>
<rect x="1096" y="240" width="190" height="90" rx="14" fill="#E2F3EE"/>
<text x="1118" y="276" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#1F7A6A" text-anchor="start">Bob</text>
<text x="1118" y="306" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">测量单光子</text>
<line x1="298" y1="285" x2="1088" y2="285" stroke="#4B3F9E" stroke-width="4"/>
<path d="M1077.0 280.1 L1088.0 285.0 L1077.0 289.9" fill="none" stroke="#4B3F9E" stroke-width="4"/>
<circle cx="420" cy="285" r="7" fill="#4B3F9E" opacity="0.8"/>
<circle cx="560" cy="285" r="7" fill="#4B3F9E" opacity="0.8"/>
<circle cx="700" cy="285" r="7" fill="#4B3F9E" opacity="0.8"/>
<circle cx="840" cy="285" r="7" fill="#4B3F9E" opacity="0.8"/>
<circle cx="980" cy="285" r="7" fill="#4B3F9E" opacity="0.8"/>
<rect x="600" y="186" width="240" height="52" rx="12" fill="#FBE7E3" stroke="#A33A32" stroke-width="1.2"/>
<text x="720" y="218" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#A33A32" text-anchor="middle">Eve 测量 → 扰动</text>
<text x="720" y="362" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">量子态不可可靠复制；扰动会变成误码。</text>
<rect x="58" y="414" width="1284" height="218" rx="18" fill="#FFFFFF" filter="url(#soft)"/>
<rect x="82" y="438" width="170" height="36" rx="10" fill="#FFF3CD"/>
<text x="167.0" y="461.1" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#9A6A00" text-anchor="middle">公开经典信道</text>
<rect x="100" y="502" width="190" height="90" rx="14" fill="#ECE9FA"/>
<text x="122" y="538" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#4B3F9E" text-anchor="start">Alice</text>
<text x="122" y="568" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">公布基 / 比对子集</text>
<rect x="1096" y="502" width="190" height="90" rx="14" fill="#E2F3EE"/>
<text x="1118" y="538" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="700" fill="#1F7A6A" text-anchor="start">Bob</text>
<text x="1118" y="568" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">公布基 / 比对子集</text>
<line x1="298" y1="547" x2="1088" y2="547" stroke="#9A6A00" stroke-width="4"/>
<path d="M1077.0 542.0 L1088.0 547.0 L1077.0 552.0" fill="none" stroke="#9A6A00" stroke-width="4"/>
<line x1="1088" y1="575" x2="298" y2="575" stroke="#9A6A00" stroke-width="4"/>
<path d="M309.0 580.0 L298.0 575.0 L309.0 570.0" fill="none" stroke="#9A6A00" stroke-width="4"/>
<rect x="596" y="452" width="250" height="50" rx="12" fill="#FFF3CD" stroke="#9A6A00" stroke-width="1.2"/>
<text x="721" y="483" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#9A6A00" text-anchor="middle">可被动窃听，不可注入/篡改</text>
<text x="720" y="608" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" fill="#6B655C" text-anchor="middle">若要防主动攻击：先用预共享小密钥做认证。</text>
<rect x="58" y="660" width="1284" height="72" rx="14" fill="#F0EDE6" stroke="#DED9CE" stroke-width="1.5"/>
<text x="84" y="690" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="600" fill="#1F1D1A" text-anchor="start">读图：公开信道不是“天然安全”；它只是被假设为不可被主动改写。</text>
<text x="84" y="716" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">依据：TCS 560 (2014) 251–254, 316–328。</text>
</svg>
