<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" role="img" aria-labelledby="title desc">
<title id="title">同一篇论文：1984 年会议版，2014 年重印</title>
<desc id="desc">时间线：1984 年 12 月 10–12 日 BB84 论文收入 Bangalore 会议论文集第 175–179 页；2014 年 Theoretical Computer Science 560 卷 7–11 页重新排版，文本仍是 1984 年版。</desc>
<defs><filter id="soft" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F1D1A" flood-opacity="0.07"/></filter></defs>
<rect width="1400" height="560" fill="#F7F5EF"/>
<text x="58" y="68" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">同一篇论文：1984 年会议版，2014 年重印</text>
<text x="58" y="106" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">读时间线时不要把“重印”当成“再次提出”。</text>
<line x1="150" y1="300" x2="1250" y2="300" stroke="#DED9CE" stroke-width="5"/>
<line x1="150" y1="300" x2="1250" y2="300" stroke="#4B3F9E" stroke-width="2" stroke-dasharray="10 8"/>
<circle cx="390" cy="300" r="22" fill="#4B3F9E"/>
<circle cx="390" cy="300" r="34" fill="none" stroke="#4B3F9E" stroke-width="2" opacity="0.25"/>
<text x="390" y="238" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="30" font-weight="700" fill="#4B3F9E" text-anchor="middle">1984</text>
<text x="390" y="206" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="500" fill="#6B655C" text-anchor="middle">会议论文</text>
<rect x="210" y="356" width="360" height="100" rx="14" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="232" y="388" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="600" fill="#1F1D1A" text-anchor="start">12 月 10–12 日 · Bangalore</text>
<text x="232" y="416" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">Proc. ICSSP, pp. 175–179</text>
<text x="232" y="442" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">标题：Quantum Cryptography</text>
<circle cx="980" cy="300" r="22" fill="#1F7A6A"/>
<circle cx="980" cy="300" r="34" fill="none" stroke="#1F7A6A" stroke-width="2" opacity="0.25"/>
<text x="980" y="238" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="30" font-weight="700" fill="#1F7A6A" text-anchor="middle">2014</text>
<text x="980" y="206" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="500" fill="#6B655C" text-anchor="middle">重新排版</text>
<rect x="800" y="356" width="360" height="100" rx="14" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="822" y="388" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="600" fill="#1F1D1A" text-anchor="start">Theoretical Computer Science 560</text>
<text x="822" y="416" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">pp. 7–11 · 同一篇 1984 年文本</text>
<text x="822" y="442" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">只做排版与书目更新</text>
<line x1="420" y1="300" x2="940" y2="300" stroke="#4B3F9E" stroke-width="3"/>
<path d="M929.0 295.1 L940.0 300.0 L929.0 304.9" fill="none" stroke="#4B3F9E" stroke-width="3"/>
<text x="680" y="280" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#6B655C" text-anchor="middle">同一文本</text>
<rect x="58" y="482" width="1284" height="56" rx="12" fill="#FFF3CD" stroke="#DED9CE" stroke-width="1.5"/>
<text x="84" y="516" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="500" fill="#6B655C" text-anchor="start">2014 年不是新协议；重印不是再次提出。</text>
</svg>
