<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" role="img" aria-labelledby="title desc">
<title id="title">One paper: the 1984 proceedings version and the 2014 reprint</title>
<desc id="desc">Timeline: the BB84 paper appears in the Bangalore proceedings, pages 175–179, on 10–12 December 1984; Theoretical Computer Science 560 (2014), pages 7–11, is a fresh typesetting of the same 1984 text.</desc>
<defs><filter id="soft" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F1D1A" flood-opacity="0.07"/></filter></defs>
<rect width="1400" height="560" fill="#F7F5EF"/>
<text x="58" y="68" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">One paper: the 1984 proceedings version and the 2014 reprint</text>
<text x="58" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">Do not read a reprint as a second proposal.</text>
<line x1="150" y1="300" x2="1250" y2="300" stroke="#DED9CE" stroke-width="5"/>
<line x1="150" y1="300" x2="1250" y2="300" stroke="#4B3F9E" stroke-width="2" stroke-dasharray="10 8"/>
<circle cx="390" cy="300" r="22" fill="#4B3F9E"/>
<circle cx="390" cy="300" r="34" fill="none" stroke="#4B3F9E" stroke-width="2" opacity="0.25"/>
<text x="390" y="238" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#4B3F9E" text-anchor="middle">1984</text>
<text x="390" y="206" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="500" fill="#6B655C" text-anchor="middle">proceedings paper</text>
<rect x="210" y="356" width="360" height="100" rx="14" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="232" y="388" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#1F1D1A" text-anchor="start">10–12 December · Bangalore</text>
<text x="232" y="416" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" font-weight="400" fill="#6B655C" text-anchor="start">Proc. ICSSP, pp. 175–179</text>
<text x="232" y="442" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">Title: Quantum Cryptography</text>
<circle cx="980" cy="300" r="22" fill="#1F7A6A"/>
<circle cx="980" cy="300" r="34" fill="none" stroke="#1F7A6A" stroke-width="2" opacity="0.25"/>
<text x="980" y="238" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#1F7A6A" text-anchor="middle">2014</text>
<text x="980" y="206" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="500" fill="#6B655C" text-anchor="middle">fresh typesetting</text>
<rect x="800" y="356" width="360" height="100" rx="14" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="822" y="388" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#1F1D1A" text-anchor="start">Theoretical Computer Science 560</text>
<text x="822" y="416" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">pp. 7–11 · same 1984 text</text>
<text x="822" y="442" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">typesetting and bibliography only</text>
<line x1="420" y1="300" x2="940" y2="300" stroke="#4B3F9E" stroke-width="3"/>
<path d="M929.0 295.1 L940.0 300.0 L929.0 304.9" fill="none" stroke="#4B3F9E" stroke-width="3"/>
<text x="680" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#6B655C" text-anchor="middle">same text</text>
<rect x="58" y="482" width="1284" height="56" rx="12" fill="#FFF3CD" stroke="#DED9CE" stroke-width="1.5"/>
<text x="84" y="516" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#6B655C" text-anchor="start">2014 is not a new protocol; a reprint is not a second proposal.</text>
