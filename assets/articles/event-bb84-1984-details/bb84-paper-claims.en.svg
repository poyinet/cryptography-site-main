<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" role="img" aria-labelledby="title desc">
<title id="title">What the 1984 paper claims, assumes, and does not provide</title>
<desc id="desc">Diagram: the left panel is the claimed random-key distribution; the middle panel lists public-channel and one-time-pad assumptions; the right panel lists what the paper explicitly does not provide: digital signatures, certified mail, dispute adjudication.</desc>
<defs><filter id="soft" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F1D1A" flood-opacity="0.07"/></filter></defs>
<rect width="1400" height="780" fill="#F7F5EF"/>
<text x="58" y="68" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">What the 1984 paper claims, assumes, and does not provide</text>
<text x="58" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">Separate what the paper says from what modern QKD systems can do.</text>
<rect x="58" y="160" width="420" height="300" rx="20" fill="#FFFFFF" filter="url(#soft)"/>
<rect x="82" y="184" width="190" height="40" rx="10" fill="#ECE9FA"/>
<text x="177.0" y="209.44" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#4B3F9E" text-anchor="middle">claim</text>
<circle cx="96" cy="255" r="4" fill="#4B3F9E"/>
<text x="112" y="262" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#1F1D1A" text-anchor="start">quantum channel + ordinary insecure</text>
<text x="112" y="283" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#1F1D1A" text-anchor="start">classical channel;</text>
<circle cx="96" cy="321" r="4" fill="#4B3F9E"/>
<text x="112" y="328" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#1F1D1A" text-anchor="start">two users with no initial shared secret;</text>
<circle cx="96" cy="366" r="4" fill="#4B3F9E"/>
<text x="112" y="373" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#1F1D1A" text-anchor="start">a random key unknown to anyone else.</text>
<rect x="490" y="160" width="420" height="300" rx="20" fill="#FFFFFF" filter="url(#soft)"/>
<rect x="514" y="184" width="190" height="40" rx="10" fill="#FFF3CD"/>
<text x="609.0" y="209.44" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#9A6A00" text-anchor="middle">assumes</text>
<circle cx="528" cy="255" r="4" fill="#9A6A00"/>
<text x="544" y="262" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#1F1D1A" text-anchor="start">public channel can be eavesdropped, not</text>
<text x="544" y="283" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#1F1D1A" text-anchor="start">altered;</text>
<circle cx="528" cy="321" r="4" fill="#9A6A00"/>
<text x="544" y="328" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#1F1D1A" text-anchor="start">key is used once as a one-time pad;</text>
<circle cx="528" cy="366" r="4" fill="#9A6A00"/>
<text x="544" y="373" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#1F1D1A" text-anchor="start">quantum signals are weak and cannot be</text>
<text x="544" y="394" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#1F1D1A" text-anchor="start">amplified.</text>
<rect x="922" y="160" width="420" height="300" rx="20" fill="#FFFFFF" filter="url(#soft)"/>
<rect x="946" y="184" width="190" height="40" rx="10" fill="#FBE7E3"/>
<text x="1041.0" y="209.44" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#A33A32" text-anchor="middle">does not provide</text>
<circle cx="960" cy="255" r="4" fill="#A33A32"/>
<text x="976" y="262" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#1F1D1A" text-anchor="start">digital signatures;</text>
<circle cx="960" cy="300" r="4" fill="#A33A32"/>
<text x="976" y="307" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#1F1D1A" text-anchor="start">certified mail;</text>
<circle cx="960" cy="345" r="4" fill="#A33A32"/>
<text x="976" y="352" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#1F1D1A" text-anchor="start">settling disputes before a judge.</text>
<rect x="58" y="488" width="1284" height="236" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="84" y="522" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="start">The paper’s own words</text>
<text x="84" y="556" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">“Such a quantum channel can be used in conjunction with ordinary insecure classical channels to distribute random key information between two users...”</text>
<text x="84" y="584" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">“...quantum cryptography does not provide digital signatures, or applications such as certified mail or the ability to settle disputes before a judge.”</text>
<text x="84" y="624" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#1F1D1A" text-anchor="start">Reading: BB84 outputs a shared random key, not ciphertext; it does not provide signatures, nor make the public channel trustworthy by itself.</text>
<text x="84" y="660" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">Evidence: TCS 560 (2014) 10–26, 93–94, 211–230, 251–254.</text>
</svg>
