<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" role="img" aria-labelledby="title desc">
<title id="title">1984 年论文的声称、前提与不提供</title>
<desc id="desc">示意图：左栏是论文声称的随机密钥分发；中栏是公开信道与一次性密码本的前提；右栏是论文明确不提供的数字签名、认证邮件与争议裁决。</desc>
<defs><filter id="soft" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F1D1A" flood-opacity="0.07"/></filter></defs>
<rect width="1400" height="780" fill="#F7F5EF"/>
<text x="58" y="68" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="31" font-weight="700" fill="#1F1D1A" text-anchor="start">1984 年论文的声称、前提与不提供</text>
<text x="58" y="106" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="400" fill="#6B655C" text-anchor="start">把“论文说了什么”与“现代 QKD 能做什么”分开。</text>
<rect x="58" y="160" width="420" height="300" rx="20" fill="#FFFFFF" filter="url(#soft)"/>
<rect x="82" y="184" width="190" height="40" rx="10" fill="#ECE9FA"/>
<text x="177.0" y="209.44" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#4B3F9E" text-anchor="middle">论文声称</text>
<circle cx="96" cy="255" r="4" fill="#4B3F9E"/>
<text x="112" y="262" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#1F1D1A" text-anchor="start">量子信道 + 普通不安全经典信道；</text>
<circle cx="96" cy="311" r="4" fill="#4B3F9E"/>
<text x="112" y="318" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#1F1D1A" text-anchor="start">在两个原本无共享秘密的用户之间</text>
<circle cx="96" cy="367" r="4" fill="#4B3F9E"/>
<text x="112" y="374" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#1F1D1A" text-anchor="start">分发随机密钥；密钥对其他人未知。</text>
<rect x="490" y="160" width="420" height="300" rx="20" fill="#FFFFFF" filter="url(#soft)"/>
<rect x="514" y="184" width="190" height="40" rx="10" fill="#FFF3CD"/>
<text x="609.0" y="209.44" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#9A6A00" text-anchor="middle">论文前提</text>
<circle cx="528" cy="255" r="4" fill="#9A6A00"/>
<text x="544" y="262" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#1F1D1A" text-anchor="start">公开信道可被窃听，但不能被注入/篡改；</text>
<circle cx="528" cy="311" r="4" fill="#9A6A00"/>
<text x="544" y="318" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#1F1D1A" text-anchor="start">密钥当一次性密码本用完即弃；</text>
<circle cx="528" cy="367" r="4" fill="#9A6A00"/>
<text x="544" y="374" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#1F1D1A" text-anchor="start">量子传输很弱，不能在中途放大。</text>
<rect x="922" y="160" width="420" height="300" rx="20" fill="#FFFFFF" filter="url(#soft)"/>
<rect x="946" y="184" width="190" height="40" rx="10" fill="#FBE7E3"/>
<text x="1041.0" y="209.44" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#A33A32" text-anchor="middle">论文不提供</text>
<circle cx="960" cy="255" r="4" fill="#A33A32"/>
<text x="976" y="262" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#1F1D1A" text-anchor="start">数字签名；</text>
<circle cx="960" cy="311" r="4" fill="#A33A32"/>
<text x="976" y="318" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#1F1D1A" text-anchor="start">认证邮件（certified mail）；</text>
<circle cx="960" cy="367" r="4" fill="#A33A32"/>
<text x="976" y="374" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400" fill="#1F1D1A" text-anchor="start">在法官面前解决争议的能力。</text>
<rect x="58" y="488" width="1284" height="236" rx="16" fill="#FFFFFF" stroke="#DED9CE" stroke-width="1.5"/>
<text x="84" y="522" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1F1D1A" text-anchor="start">原文对照</text>
<text x="84" y="556" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">「Such a quantum channel can be used in conjunction with ordinary insecure classical channels to distribute random key information between two users...」</text>
<text x="84" y="584" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">「...quantum cryptography does not provide digital signatures, or applications such as certified mail or the ability to settle disputes before a judge.」</text>
<text x="84" y="624" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="600" fill="#1F1D1A" text-anchor="start">读图：BB84 输出的是共享随机密钥，不是密文；它不提供签名，也不把公开信道自动变可信。</text>
<text x="84" y="660" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" fill="#6B655C" text-anchor="start">依据：TCS 560 (2014) 10–26, 93–94, 211–230, 251–254。</text>
</svg>
